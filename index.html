<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跳跃躲避障碍物</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at top, #2f2f5f, #09090f 68%);
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #gameContainer {
      position: relative;
      width: 900px;
      max-width: 100%;
      background: #12131b;
      border: 3px solid #4d5b7a;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }

    canvas {
      display: block;
      width: 100%;
      background: linear-gradient(180deg, #12131b, #050609);
      image-rendering: auto;
    }

    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      gap: 12px;
      flex-wrap: wrap;
      background: rgba(12, 16, 30, 0.96);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    #hud div {
      font-size: 16px;
      white-space: nowrap;
    }

    #hud span {
      color: #7fe9ff;
      font-weight: bold;
    }

    #watermark {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.45);
      font-size: 22px;
      letter-spacing: 0.25em;
      pointer-events: none;
      z-index: 20;
      text-shadow: 0 0 14px rgba(255,255,255,0.16);
    }

    #message {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: rgba(2, 4, 12, 0.82);
      backdrop-filter: blur(3px);
      color: #fff;
      font-size: 24px;
      text-align: center;
      padding: 24px;
      visibility: hidden;
      z-index: 9;
    }

    #message button {
      margin-top: 18px;
      padding: 12px 24px;
      border: none;
      background: linear-gradient(135deg, #2fa8ff, #1f6cff);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      border-radius: 10px;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 6px 18px rgba(31, 140, 255, 0.35);
    }

    #message button:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 10px 26px rgba(31, 140, 255, 0.5);
    }

    #instructions {
      margin-top: 16px;
      font-size: 14px;
      color: #b8c0e0;
      line-height: 1.6;
      max-width: 620px;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <div id="hud">
      <div>玩家: 55</div>
      <div>关卡: <span id="stage">1</span></div>
      <div>得分: <span id="score">0</span></div>
      <div>最高分: <span id="bestScore">0</span></div>
      <div>速度: <span id="speed">1.0</span></div>
    </div>
    <div id="watermark">sjx制作</div>
    <canvas id="gameCanvas" width="900" height="450"></canvas>
    <div id="message">
      <div id="messageText">按空格开始游戏</div>
      <button id="restartButton">继续</button>
      <div id="instructions">
        控制：A/D 左右移动，W/空格 跳跃，S 下蹲。躲避障碍与天降坠落物，冲向闪光大门！
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const speedEl = document.getElementById('speed');
    const message = document.getElementById('message');
    const messageText = document.getElementById('messageText');
    const restartButton = document.getElementById('restartButton');

    const canvasWidth = canvas.width;
    const canvasHeight = canvas.height;
    const groundHeight = 90;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // HiDPI：按屏幕像素密度提升画布实际分辨率，避免高分屏下发虚发糊
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = canvasWidth * dpr;
    canvas.height = canvasHeight * dpr;
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
    ctx.scale(dpr, dpr);
    ctx.imageSmoothingEnabled = true;

    const player = {
      x: 120,
      y: canvasHeight - groundHeight - 66,
      width: 44,
      height: 64,
      dy: 0,
      vx: 0,
      maxVx: 6.6,
      accel: 0.95,
      airAccel: 0.55,
      friction: 0.80,
      airFriction: 0.94,
      jumpPower: 16.5,
      gravity: 0.78,
      fallGravity: 1.15,
      lowJumpGravity: 1.7,
      jumpCount: 0,
      maxJumps: 1,
      crouching: false,
      direction: 'right',
      shootCooldown: 0,
      charging: false,
      chargeTime: 0,
      chargeReady: false,
      // 手感相关
      onGround: true,
      coyoteTimer: 0,
      coyoteMax: 8,
      jumpBuffer: 0,
      jumpBufferMax: 8,
      jumpHeld: false,
      // 表现相关
      squash: 1,
      stretch: 1,
      runPhase: 0,
      trail: [],
    };

    // Ensure initial y is aligned to player.height to avoid sinking into ground
    player.y = canvasHeight - groundHeight - player.height;

    const state = {
      score: 0,
      stage: 1,
      speed: 1,
      spawnTimer: 0,
      spawnInterval: 78,
      obstacles: [],
      platforms: [],
      enemies: [],
      playerShots: [],
      enemyShots: [],
      particles: [],
      stars: [],
      hills: [],
      groundScroll: 0,
      boss: null,
      obstaclesCreated: 0,
      passedObstacles: 0,
      obstaclesToPass: 55,
      door: null,
      doorSequence: false,
      doorFlashTimer: 0,
      hintText: '',
      bossMusic: null,
      active: false,
      bestScore: Number(localStorage.getItem('jumpDodgeBestScore') || 0),
      shakeTimer: 0,
      shakeStrength: 0,
      shakeBase: 0,
      messageMode: 'start',
      keys: {
        Space: false,
        KeyA: false,
        KeyD: false,
        KeyJ: false,
        KeyS: false,
      },
      fallingObjects: [],
      fallTimer: 120,
    };

    /* ============================ 音效 ============================ */
    function playTone(freq, type = 'sine', duration = 0.1) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.02);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration + 0.02);
    }

    function playJumpSound() { playTone(520, 'triangle', 0.12); }
    function playDoubleJumpSound() { playTone(680, 'triangle', 0.12); }
    function playLandSound(impact = 0.5) {
      // 厚重的落地"咚"：低频下滑 + 冲击越大越响越低
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      const f = 190 + impact * 40;
      osc.frequency.setValueAtTime(f, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(55, audioCtx.currentTime + 0.13);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const vol = 0.12 + impact * 0.22;
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(vol, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.22);
      // 冲击较大时叠一层短促噪声"啪"，增加打击感
      if (impact > 0.45) playTone(90, 'triangle', 0.05);
    }
    function playShootSound() { playTone(760, 'square', 0.06); }
    function playChargeSound() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      osc.type = 'triangle';
      osc.frequency.value = 320;
      filter.type = 'lowpass';
      filter.frequency.value = 660;
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.16, audioCtx.currentTime + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.32);
    }
    function playChargeReleaseSound() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.22, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.24);
    }
    function playEnemyHitSound() { playTone(260, 'triangle', 0.08); }
    function playBossHitSound() { playTone(180, 'square', 0.1); }
    function playDoorMusic() {
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc1.type = 'triangle';
      osc2.type = 'sine';
      osc1.frequency.value = 520;
      osc2.frequency.value = 660;
      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.02);
      osc1.start();
      osc2.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
      osc1.stop(audioCtx.currentTime + 0.7);
      osc2.stop(audioCtx.currentTime + 0.7);
    }
    function playFailSound() { playTone(140, 'sawtooth', 0.22); }
    function playWinSound() { playTone(880, 'triangle', 0.18); }

    /* ==================== 背景 & 粒子系统 ==================== */
    function initBackground() {
      state.stars = [];
      for (let i = 0; i < 100; i++) {
        state.stars.push({
          x: Math.random() * canvasWidth,
          y: Math.random() * (canvasHeight - groundHeight),
          r: Math.random() * 1.6 + 0.4,
          speed: Math.random() * 0.5 + 0.1,
          twinkle: Math.random() * Math.PI * 2,
        });
      }
      const layers = [
        { color: '#171f45', speed: 0.35, amp: 40, base: canvasHeight - groundHeight + 14, step: 170 },
        { color: '#212a5c', speed: 0.7, amp: 30, base: canvasHeight - groundHeight + 8, step: 130 },
        { color: '#2c3878', speed: 1.15, amp: 22, base: canvasHeight - groundHeight + 4, step: 100 },
      ];
      state.hills = layers.map(l => ({ ...l, offset: 0 }));
    }

    function spawnParticles(x, y, count, opts = {}) {
      const colors = Array.isArray(opts.color) ? opts.color : [opts.color || '#8df4ff'];
      const spread = opts.spread != null ? opts.spread : Math.PI * 2;
      const baseAngle = opts.angle != null ? opts.angle : 0;
      const speedMin = opts.speedMin != null ? opts.speedMin : 1;
      const speedMax = opts.speedMax != null ? opts.speedMax : 3;
      const life = opts.life != null ? opts.life : 24;
      for (let i = 0; i < count; i++) {
        const ang = opts.angle != null ? baseAngle + (Math.random() - 0.5) * spread : Math.random() * Math.PI * 2;
        const sp = speedMin + Math.random() * (speedMax - speedMin);
        state.particles.push({
          x, y,
          vx: Math.cos(ang) * sp + (opts.vx || 0),
          vy: Math.sin(ang) * sp + (opts.vy || 0),
          life: life + Math.random() * (life * 0.4),
          maxLife: life * 1.4,
          size: (opts.size || 3) * (0.6 + Math.random() * 0.7),
          color: colors[Math.floor(Math.random() * colors.length)],
          gravity: opts.gravity != null ? opts.gravity : 0.15,
        });
      }
    }

    function updateParticles() {
      for (const p of state.particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= 0.98;
        p.life -= 1;
      }
      state.particles = state.particles.filter(p => p.life > 0);
    }

    function updateBackground() {
      const spd = 1 + state.speed;
      for (const s of state.stars) {
        s.x -= s.speed * spd * 0.35;
        if (s.x < -2) { s.x = canvasWidth + 2; s.y = Math.random() * (canvasHeight - groundHeight); }
        s.twinkle += 0.05;
      }
      for (const h of state.hills) {
        h.offset -= h.speed * spd;
        if (h.offset <= -h.step) h.offset += h.step;
      }
      state.groundScroll -= (3 + state.speed * 2);
    }

    /* ============================ 界面 ============================ */
    function showMessage(text, buttonText = '继续', mode = 'info') {
      messageText.textContent = text;
      restartButton.textContent = buttonText;
      message.style.visibility = 'visible';
      state.active = false;
      state.messageMode = mode;
    }

    function hideMessage() {
      message.style.visibility = 'hidden';
      state.active = true;
      if (state.stage === 2 && state.messageMode === 'stage2') {
        state.messageMode = 'playing';
      }
    }

    function resetPlayerFeel() {
      player.onGround = true;
      player.coyoteTimer = 0;
      player.jumpBuffer = 0;
      player.jumpHeld = false;
      player.squash = 1;
      player.stretch = 1;
      player.runPhase = 0;
      player.trail = [];
      player.crouching = false;
    }

    function resetGame() {
      if (!state.stars.length) initBackground();
      state.stage = 1;
      state.score = 0;
      state.speed = 1;
      state.spawnTimer = 0;
      state.spawnInterval = 90;
      state.obstacles = [];
      state.enemies = [];
      state.playerShots = [];
      state.enemyShots = [];
      state.particles = [];
      state.fallingObjects = [];
      state.fallTimer = 120;
      state.boss = null;
      state.obstaclesCreated = 0;
      state.passedObstacles = 0;
      state.door = null;
      state.doorSequence = false;
      state.doorFlashTimer = 0;
      state.hintText = '';
      state.platforms = [];
      state.shakeTimer = 0;
      stopBossMusic();
      player.x = 120;
      player.y = canvasHeight - groundHeight - player.height;
      player.dy = 0;
      player.vx = 0;
      player.jumpCount = 0;
      player.maxJumps = 1;
      player.direction = 'right';
      player.shootCooldown = 0;
      player.charging = false;
      player.chargeTime = 0;
      resetPlayerFeel();
      scoreEl.textContent = state.score;
      speedEl.textContent = state.speed.toFixed(1);
      document.getElementById('stage').textContent = state.stage;
      document.getElementById('bestScore').textContent = state.bestScore;
      showMessage('按空格开始游戏', '开始', 'start');
      drawScene();
    }

    function updateBestScore() {
      if (state.score > state.bestScore) {
        state.bestScore = state.score;
        localStorage.setItem('jumpDodgeBestScore', state.bestScore);
      }
    }

    function createBossMusic() {
      if (state.bossMusic) return;
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const lfo = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();
      osc1.type = 'triangle';
      osc2.type = 'sawtooth';
      osc1.frequency.value = 100;
      osc2.frequency.value = 140;
      filter.type = 'lowpass';
      filter.frequency.value = 520;
      filter.Q.value = 12;
      lfo.type = 'sine';
      lfo.frequency.value = 0.45;
      lfo.connect(filter.frequency);
      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.5);
      osc1.start();
      osc2.start();
      lfo.start();
      state.bossMusic = {osc1, osc2, lfo, filter, gain};
    }

    function stopBossMusic() {
      if (!state.bossMusic) return;
      const {osc1, osc2, lfo, gain} = state.bossMusic;
      gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
      osc1.stop(audioCtx.currentTime + 0.5);
      osc2.stop(audioCtx.currentTime + 0.5);
      lfo.stop(audioCtx.currentTime + 0.5);
      state.bossMusic = null;
    }

    function addShake(strength, time) {
      state.shakeStrength = Math.max(state.shakeStrength, strength);
      state.shakeTimer = Math.max(state.shakeTimer, time);
      state.shakeBase = Math.max(state.shakeBase, time);
    }

    function endGame(text) {
      stopBossMusic();
      state.active = false;
      updateBestScore();
      document.getElementById('bestScore').textContent = state.bestScore;
      // 死亡爆裂粒子
      spawnParticles(player.x + player.width / 2, player.y + player.height / 2, 30, {
        color: ['#ff6d6d', '#ffd86a', '#ffffff'], speedMin: 2, speedMax: 6, gravity: 0.2, life: 34, size: 4
      });
      addShake(10, 16);
      drawScene();
      showMessage(text, '重新开始', 'end');
      playFailSound();
    }

    function winGame() {
      stopBossMusic();
      updateBestScore();
      document.getElementById('bestScore').textContent = state.bestScore;
      playWinSound();
      drawScene();
      showMessage('恭喜！玩家55 击败 Boss，游戏结束', '重新开始', 'end');
    }

    function startStage2() {
      state.stage = 2;
      state.score = 0;
      state.speed = 1.1;
      state.spawnTimer = 90; // 开局缓冲，避免一进关就被围
      state.spawnInterval = 90;
      state.obstacles = [];
      state.platforms = [
        { x: 250, y: canvasHeight - groundHeight - 96, width: 150, height: 14 },
        { x: 540, y: canvasHeight - groundHeight - 168, width: 140, height: 14 },
      ];
      state.enemies = [];
      state.playerShots = [];
      state.enemyShots = [];
      state.boss = null;
      state.obstaclesCreated = 0;
      state.passedObstacles = 0;
      state.door = null;
      state.doorSequence = false;
      state.doorFlashTimer = 0;
      state.hintText = '';
      player.x = 28;
      player.y = canvasHeight - groundHeight - player.height;
      player.jumpCount = 0;
      player.maxJumps = 2;
      resetPlayerFeel();
      document.getElementById('stage').textContent = state.stage;
      scoreEl.textContent = state.score;
      speedEl.textContent = state.speed.toFixed(1);
      showMessage('第二关开启！可二段跳，按 J 蓄力射击。按空格继续', '进入第二关', 'stage2');
    }

    /* ============================ 生成 ============================ */
    function spawnObstacle() {
      if (state.stage !== 1) return;
      if (state.obstaclesCreated >= state.obstaclesToPass) return;
      const r = Math.random();
      let type, width, height, y;
      if (r < 0.4) {
        type = 'block';
        width = 34 + Math.random() * 24;
        height = 40 + Math.random() * 30;
        y = canvasHeight - groundHeight - height;
      } else if (r < 0.62) {
        type = 'tall';
        width = 30 + Math.random() * 16;
        height = 74 + Math.random() * 34;
        y = canvasHeight - groundHeight - height;
      } else if (r < 0.82) {
        type = 'spike';
        width = 40 + Math.random() * 30;
        height = 30 + Math.random() * 22;
        y = canvasHeight - groundHeight - height;
      } else {
        type = 'floating';
        height = 36 + Math.random() * 26;
        width = 62 + Math.random() * 40;
        const gap = 30 + Math.random() * 10; // 低压顶障碍：站着/跳起会撞，必须下蹲通过
        y = canvasHeight - groundHeight - gap - height;
      }
      state.obstacles.push({ x: canvasWidth + 40, y, width, height, type, passed: false });
      state.obstaclesCreated += 1;
    }

    function spawnEnemy() {
      if (state.stage !== 2 || state.boss) return;
      const r = Math.random();
      let type;
      if (r < 0.38) type = 'green';
      else if (r < 0.62) type = 'red';
      else if (r < 0.83) type = 'flyer';
      else type = 'charger';
      const enemy = {
        x: canvasWidth + 60,
        width: 46,
        height: 52,
        dy: 0,
        gravity: 0.85,
        jumpTimer: 0,
        canJump: true,
        type,
        hp: 2,
        alive: true,
        blink: 0,
        phase: 'move',
        skillTimer: 0,
        pulse: Math.random() * Math.PI * 2,
        trail: [],
      };
      if (type === 'green') {
        enemy.width = 44; enemy.height = 48;
        enemy.y = canvasHeight - groundHeight - enemy.height;
        enemy.vx = -(2 + state.speed * 0.25);
        enemy.hp = 2;
      } else if (type === 'red') {
        enemy.height = 52;
        enemy.y = canvasHeight - groundHeight - enemy.height;
        enemy.vx = -(1.8 + state.speed * 0.2);
        enemy.hp = 2;
        enemy.skillTimer = 120 + Math.random() * 60;
      } else if (type === 'flyer') {
        enemy.width = 44; enemy.height = 40;
        enemy.baseY = 80 + Math.random() * 120;
        enemy.y = enemy.baseY;
        enemy.vx = -(2.6 + state.speed * 0.35);
        enemy.gravity = 0;
        enemy.floatPhase = Math.random() * Math.PI * 2;
        enemy.floatAmp = 18 + Math.random() * 30;
        enemy.hp = 1;
        enemy.skillTimer = 90 + Math.random() * 60;
      } else { // charger
        enemy.width = 46; enemy.height = 44;
        enemy.y = canvasHeight - groundHeight - enemy.height;
        enemy.vx = -(3 + state.speed * 0.3);
        enemy.hp = 3;
        enemy.phase = 'run';
        enemy.skillTimer = 70 + Math.random() * 40;
      }
      state.enemies.push(enemy);
    }

    function spawnBoss() {
      state.boss = {
        x: canvasWidth + 80,
        y: 70,
        width: 120,
        height: 120,
        hp: 20,
        maxHp: 20,
        dx: -2,
        phaseTimer: 120,
        shootTimer: 60,
        dashTimer: 180,
        dashSpeed: 8,
        inDash: false,
        entering: true,
        entryTimer: 80,
        minX: 80,
        maxX: canvasWidth - 220,
        hitTimer: 0,
        particles: [],
      };
      createBossMusic();
      showMessage('警告：Boss来袭！按空格继续战斗', '挑战 Boss', 'boss');
    }

    function firePlayerShot(damage, charged = false) {
      if (player.shootCooldown > 0) return;
      const dir = player.direction === 'left' ? -1 : 1;
      const muzzleX = player.x + player.width / 2 + dir * (player.width / 2 + 4);
      const shot = {
        x: muzzleX,
        y: player.y + 24,
        vx: (charged ? 16 : 11) * dir,
        vy: 0,
        radius: charged ? 20 : 6,
        damage,
        color: charged ? '#7effff' : '#7cff9b',
        charged,
        spin: 0,
      };
      state.playerShots.push(shot);
      player.shootCooldown = charged ? 26 : 14;
      // 枪口粒子（朝射击方向喷发）
      spawnParticles(muzzleX, shot.y, charged ? 20 : 5, {
        color: charged ? ['#7effff', '#ffffff', '#b6fff0'] : ['#7cff9b', '#ffffff'],
        angle: dir > 0 ? 0 : Math.PI, spread: charged ? 1.1 : 0.6,
        speedMin: 1, speedMax: charged ? 5 : 3, gravity: 0, life: charged ? 18 : 12, size: charged ? 3.5 : 2
      });
      if (charged) { playChargeReleaseSound(); addShake(7, 10); }
      else playShootSound();
    }

    function fireEnemyShot(enemy, vx, vy = 0, color = '#fc5e5e', homing = 0) {
      state.enemyShots.push({
        x: enemy.x,
        y: enemy.y + enemy.height / 2,
        vx,
        vy,
        radius: 6,
        color,
        homing,
      });
    }

    /* ============================ 输入 ============================ */
    function handleInput() {
      if (!state.active) return;

      // 跳跃：缓冲 + 土狼时间 + 二段跳
      if (player.jumpBuffer > 0) {
        const canGroundJump = player.onGround || player.coyoteTimer > 0;
        if (canGroundJump) {
          player.dy = -player.jumpPower;
          player.jumpCount = 1;
          player.onGround = false;
          player.coyoteTimer = 0;
          player.jumpBuffer = 0;
          player.squash = 0.7; player.stretch = 1.35;
          playJumpSound();
          spawnParticles(player.x + player.width / 2, player.y + player.height, 10, {
            color: ['#8df4ff', '#ffffff'], angle: Math.PI / 2, spread: Math.PI * 0.7,
            speedMin: 1, speedMax: 3, gravity: 0.12, life: 18, size: 2.5
          });
        } else if (player.jumpCount < player.maxJumps) {
          player.dy = -player.jumpPower * 0.92;
          player.jumpCount += 1;
          player.jumpBuffer = 0;
          player.squash = 0.72; player.stretch = 1.3;
          playDoubleJumpSound();
          // 二段跳空中环形气浪
          spawnParticles(player.x + player.width / 2, player.y + player.height / 2, 14, {
            color: ['#8df4ff', '#7cff9b', '#ffffff'], angle: Math.PI / 2, spread: Math.PI,
            speedMin: 1.5, speedMax: 3.5, gravity: 0.04, life: 22, size: 2.5
          });
        }
      }

      // 下蹲：仅地面有效，下蹲时移动减速
      player.crouching = state.keys.KeyS && player.onGround;

      const accel = (player.onGround ? player.accel : player.airAccel) * (player.crouching ? 0.55 : 1);
      if (state.keys.KeyA) {
        player.vx -= accel;
        player.direction = 'left';
      }
      if (state.keys.KeyD) {
        player.vx += accel;
        player.direction = 'right';
      }

      player.vx = Math.max(-player.maxVx, Math.min(player.maxVx, player.vx));

      if (state.stage === 2 && state.keys.KeyJ) {
        if (!player.charging) {
          player.charging = true;
          player.chargeTime = 0;
          player.chargeReady = false;
        } else {
          player.chargeTime += 1;
          if (player.chargeTime === 55) {
            player.chargeReady = true;
            playChargeSound();
          }
        }
      } else if (state.stage !== 2) {
        player.charging = false;
        player.chargeTime = 0;
        player.chargeReady = false;
      }
    }

    /* ============================ 更新 ============================ */
    function updatePlayer() {
      if (player.jumpBuffer > 0) player.jumpBuffer -= 1;
      if (player.coyoteTimer > 0) player.coyoteTimer -= 1;

      // 可变重力：上升松手减速快（短跳），下落更干脆（更好的平台手感）
      let g = player.gravity;
      if (player.dy > 0) g = player.fallGravity;
      else if (player.dy < 0 && !player.jumpHeld) g = player.lowJumpGravity;
      player.dy += g;
      if (player.dy > 20) player.dy = 20;

      const prevY = player.y;
      const fallSpeed = player.dy; // 落地前的下落速度，用于计算冲击强度
      player.y += player.dy;
      const wasOnGround = player.onGround;
      player.onGround = false;

      if (state.stage === 2) {
        for (const platform of state.platforms) {
          if (player.dy >= 0 && prevY + player.height <= platform.y && player.y + player.height >= platform.y && player.x + player.width > platform.x + 8 && player.x < platform.x + platform.width - 8) {
            player.y = platform.y - player.height;
            player.dy = 0;
            player.jumpCount = 0;
            player.onGround = true;
          }
        }
      }
      if (player.y >= canvasHeight - groundHeight - player.height) {
        player.y = canvasHeight - groundHeight - player.height;
        player.dy = 0;
        player.jumpCount = 0;
        player.onGround = true;
      }

      if (player.onGround) {
        player.coyoteTimer = player.coyoteMax;
        if (!wasOnGround) {
          // 冲击强度：下落越快，震动/压扁/尘土越强（0~1）
          const impact = Math.min(1, Math.max(0, fallSpeed / 15));
          player.squash = 0.68 - impact * 0.3;
          player.stretch = 1.24 + impact * 0.42;
          // 向上扬起的尘土
          const dust = Math.round(10 + impact * 18);
          spawnParticles(player.x + player.width / 2, player.y + player.height, dust, {
            color: ['#c9d4ff', '#ffffff'], angle: -Math.PI / 2, spread: Math.PI * 0.95,
            speedMin: 1, speedMax: 2.5 + impact * 4.5, gravity: 0.24, life: 20 + impact * 14, size: 2.6
          });
          // 向左右扩散的冲击波尘土（冲击越大越明显）
          const wave = Math.round(impact * 12);
          spawnParticles(player.x + player.width / 2, player.y + player.height, wave, {
            color: ['#aeb8e0', '#ffffff'], angle: 0, spread: 0.35, speedMin: 3 + impact * 3, speedMax: 6 + impact * 5, gravity: 0.22, life: 18, size: 2.2
          });
          spawnParticles(player.x + player.width / 2, player.y + player.height, wave, {
            color: ['#aeb8e0', '#ffffff'], angle: Math.PI, spread: 0.35, speedMin: 3 + impact * 3, speedMax: 6 + impact * 5, gravity: 0.22, life: 18, size: 2.2
          });
          playLandSound(impact);
        }
      }

      player.x += player.vx;
      player.vx *= player.onGround ? player.friction : player.airFriction;
      if (Math.abs(player.vx) < 0.08) player.vx = 0;
      player.x = Math.max(10, Math.min(canvasWidth - player.width - 10, player.x));

      // 跑步相位 + 跑动尘土
      if (player.onGround && Math.abs(player.vx) > 0.6) {
        player.runPhase += Math.abs(player.vx) * 0.05;
        if (Math.random() < 0.22) {
          spawnParticles(player.x + player.width / 2 - player.vx * 2, player.y + player.height - 2, 1, {
            color: ['#9fb0e0', '#c9d4ff'], angle: Math.PI, spread: 0.8,
            vx: -player.vx * 0.25, speedMin: 0.3, speedMax: 1, gravity: 0.05, life: 16, size: 2
          });
        }
      } else {
        player.runPhase *= 0.8;
      }

      // squash & stretch 回弹
      player.squash += (1 - player.squash) * 0.2;
      player.stretch += (1 - player.stretch) * 0.2;

      // 拖尾记录
      player.trail.unshift({ x: player.x, y: player.y });
      if (player.trail.length > 6) player.trail.pop();

      if (player.shootCooldown > 0) player.shootCooldown -= 1;
    }

    function updateObstacles() {
      state.obstacles.forEach(obs => {
        obs.x -= 5.5 + state.speed * 1.6;
        if (!obs.passed && obs.x + obs.width < 0) {
          obs.passed = true;
          state.passedObstacles += 1;
          state.score = state.passedObstacles;
          scoreEl.textContent = state.score;
          if (state.passedObstacles === state.obstaclesToPass) {
            state.door = {
              x: canvasWidth - 120,
              y: canvasHeight - groundHeight - 160,
              width: 80,
              height: 140,
              flash: 0,
            };
            state.hintText = '前往闪光大门进入第二关';
          }
        }
      });
      state.obstacles = state.obstacles.filter(obs => obs.x + obs.width > -40);
    }

    /* ==================== 天降坠落物（需左右躲避） ==================== */
    function spawnFalling() {
      const targetX = Math.max(20, Math.min(canvasWidth - 60, player.x + player.vx * 6 + (Math.random() - 0.5) * 70));
      state.fallingObjects.push({
        x: targetX, y: -44, width: 36, height: 36,
        phase: 'warn', timer: 42, vy: 0,
      });
    }

    function updateFalling() {
      state.fallingObjects.forEach(o => {
        if (o.phase === 'warn') {
          o.timer -= 1;
          if (o.timer <= 0) { o.phase = 'fall'; o.vy = 7; o.y = -44; }
        } else if (o.phase === 'fall') {
          o.vy += 0.9;
          o.y += o.vy;
          if (o.y + o.height >= canvasHeight - groundHeight) {
            o.phase = 'done';
            spawnParticles(o.x + o.width / 2, canvasHeight - groundHeight, 18, {
              color: ['#ffb060', '#ff5b5b', '#ffffff'], angle: -Math.PI / 2, spread: Math.PI,
              speedMin: 2, speedMax: 5.5, gravity: 0.3, life: 22, size: 3
            });
          }
        }
      });
      state.fallingObjects = state.fallingObjects.filter(o => o.phase !== 'done');
    }

    function drawFalling() {
      const gy = canvasHeight - groundHeight;
      state.fallingObjects.forEach(o => {
        const cxo = o.x + o.width / 2;
        if (o.phase === 'warn') {
          const blink = 0.35 + 0.45 * Math.sin(Date.now() * 0.02);
          ctx.save();
          ctx.strokeStyle = `rgba(255,80,80,${blink})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(cxo, gy - 3, o.width * 0.7, 8, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = `rgba(255,80,80,${blink * 0.32})`;
          ctx.beginPath();
          ctx.ellipse(cxo, gy - 3, o.width * 0.7, 8, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          // 顶部下落警示三角
          ctx.fillStyle = `rgba(255,90,90,${blink})`;
          ctx.beginPath();
          ctx.moveTo(cxo - 8, 8);
          ctx.lineTo(cxo + 8, 8);
          ctx.lineTo(cxo, 22);
          ctx.closePath(); ctx.fill();
        } else if (o.phase === 'fall') {
          ctx.save();
          ctx.shadowBlur = 16; ctx.shadowColor = '#ff7b30';
          // 火焰尾
          ctx.fillStyle = '#ffce6a';
          ctx.beginPath();
          ctx.moveTo(o.x + 4, o.y);
          ctx.lineTo(cxo, o.y - 22);
          ctx.lineTo(o.x + o.width - 4, o.y);
          ctx.closePath(); ctx.fill();
          // 陨石本体
          ctx.fillStyle = '#6a4a3a';
          ctx.beginPath();
          ctx.arc(cxo, o.y + o.height / 2, o.width / 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#8a6a55';
          ctx.beginPath();
          ctx.arc(cxo - 5, o.y + o.height / 2 - 4, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      });
    }

    function updateEnemies() {
      state.enemies.forEach(enemy => {
        if (enemy.blink > 0) enemy.blink -= 1;
        enemy.pulse += 0.15;

        // 拖尾记录（飞行/冲刺怪）
        if (enemy.type === 'flyer' || enemy.type === 'charger') {
          enemy.trail.unshift({ x: enemy.x, y: enemy.y });
          if (enemy.trail.length > 8) enemy.trail.pop();
        }

        // 浮游炮：空中浮动，技能=朝玩家三连散射
        if (enemy.type === 'flyer') {
          enemy.x += enemy.vx;
          enemy.floatPhase += 0.06;
          enemy.y = enemy.baseY + Math.sin(enemy.floatPhase) * enemy.floatAmp;
          enemy.skillTimer -= 1;
          if (enemy.skillTimer <= 0) {
            enemy.skillTimer = 130 + Math.random() * 60;
            const dx = (player.x + player.width / 2) - enemy.x;
            const dy = (player.y + 20) - (enemy.y + enemy.height / 2);
            const base = Math.atan2(dy, dx);
            for (let a = -1; a <= 1; a++) {
              const ang = base + a * 0.28;
              fireEnemyShot(enemy, Math.cos(ang) * 5, Math.sin(ang) * 5, '#c9a3ff');
            }
            spawnParticles(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, 8, { color: ['#c9a3ff', '#ffffff'], speedMin: 1, speedMax: 3, gravity: 0, life: 14, size: 2 });
          }
          return;
        }

        const prevY = enemy.y;
        enemy.x += enemy.vx;
        enemy.y += enemy.dy;
        enemy.dy += enemy.gravity;

        for (const platform of state.platforms) {
          if (enemy.dy >= 0 && prevY + enemy.height <= platform.y && enemy.y + enemy.height >= platform.y && enemy.x + enemy.width > platform.x + 6 && enemy.x < platform.x + platform.width - 6) {
            enemy.y = platform.y - enemy.height;
            enemy.dy = 0;
            enemy.canJump = true;
          }
        }

        if (enemy.y >= canvasHeight - groundHeight - enemy.height) {
          enemy.y = canvasHeight - groundHeight - enemy.height;
          enemy.dy = 0;
          enemy.canJump = true;
        }

        if (enemy.type === 'green') {
          // 弹跳晶体：定期跳跃
          enemy.jumpTimer -= 1;
          if (enemy.jumpTimer <= 0 && enemy.canJump) {
            enemy.jumpTimer = 80 + Math.random() * 60;
            enemy.dy = -12 - Math.random() * 5;
            enemy.canJump = false;
          }
        } else if (enemy.type === 'red') {
          // 法师：蓄力预警 → 发射追踪弹
          enemy.skillTimer -= 1;
          if (enemy.phase === 'move' && enemy.skillTimer <= 30) enemy.phase = 'aim';
          if (enemy.skillTimer <= 0) {
            enemy.phase = 'move';
            enemy.skillTimer = 150 + Math.random() * 80;
            const dx = (player.x + player.width / 2) - enemy.x;
            const dy = (player.y + 20) - (enemy.y + enemy.height / 2);
            const len = Math.hypot(dx, dy) || 1;
            fireEnemyShot(enemy, (dx / len) * 4.5, (dy / len) * 4.5, '#ff5e8a', 70);
            spawnParticles(enemy.x, enemy.y + enemy.height / 2, 12, { color: ['#ff5e8a', '#ffffff'], speedMin: 1, speedMax: 3.5, gravity: 0, life: 16, size: 2 });
          }
        } else if (enemy.type === 'charger') {
          // 冲锋怪：奔跑 → 蓄力预警 → 高速冲刺（留残影）
          enemy.skillTimer -= 1;
          if (enemy.phase === 'run') {
            if (enemy.skillTimer <= 0) {
              enemy.phase = 'windup';
              enemy.skillTimer = 36;
              enemy.vx = -0.3;
            }
          } else if (enemy.phase === 'windup') {
            enemy.vx = -0.3 + Math.sin(enemy.pulse * 3) * 0.6;
            if (enemy.skillTimer <= 0) {
              enemy.phase = 'dash';
              enemy.skillTimer = 60;
              enemy.vx = -(11 + state.speed);
              spawnParticles(enemy.x + enemy.width, enemy.y + enemy.height / 2, 14, { color: ['#ff9a3c', '#ffffff'], angle: 0, spread: 1.2, speedMin: 2, speedMax: 5, gravity: 0.1, life: 18, size: 2.5 });
            }
          } else if (enemy.phase === 'dash') {
            if (Math.random() < 0.6) spawnParticles(enemy.x + enemy.width, enemy.y + enemy.height / 2, 2, { color: ['#ff9a3c', '#ffd86a'], speedMin: 0.5, speedMax: 2, gravity: 0.05, life: 12, size: 2 });
            if (enemy.skillTimer <= 0) {
              enemy.phase = 'run';
              enemy.skillTimer = 90 + Math.random() * 50;
              enemy.vx = -(3 + state.speed * 0.3);
            }
          }
        }
      });
      state.enemies = state.enemies.filter(enemy => enemy.x + enemy.width > -80 && enemy.alive);
    }

    function updateBoss() {
      if (!state.boss) return;
      const boss = state.boss;
      if (boss.entering) {
        boss.entryTimer -= 1;
        boss.x -= 3.4;
        if (boss.entryTimer <= 0 || boss.x <= boss.maxX) {
          boss.entering = false;
          boss.dx = 0;
          boss.x = boss.maxX;
          addShake(8, 18);
        }
      } else if (!boss.inDash) {
        if (boss.x > boss.maxX) {
          boss.x -= 1.8;
        }
      } else {
        boss.x -= boss.dashSpeed;
        if (boss.x < boss.minX) {
          boss.x = boss.minX;
          boss.inDash = false;
          boss.dx = 0;
        }
      }

      boss.phaseTimer -= 1;
      if (boss.phaseTimer <= 0) {
        boss.phaseTimer = 140;
        boss.inDash = !boss.inDash;
        if (!boss.inDash) boss.dx = 0;
      }

      boss.shootTimer -= 1;
      if (boss.shootTimer <= 0) {
        boss.shootTimer = 40;
        [{vx: -6, vy: 0}, {vx: -5, vy: -2}, {vx: -5, vy: 2}].forEach(s => fireEnemyShot(boss, s.vx, s.vy));
      }

      boss.dashTimer -= 1;
      if (boss.dashTimer <= 0) {
        boss.dashTimer = 220;
        boss.inDash = true;
        boss.dashSpeed = 10 + Math.random() * 4;
      }

      if (boss.hitTimer && boss.hitTimer > 0) boss.hitTimer -= 1;
      for (const p of boss.particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life -= 1;
      }
      boss.particles = boss.particles.filter(p => p.life > 0);
    }

    function updatePlayerShots() {
      state.playerShots.forEach(shot => {
        shot.x += shot.vx;
        if (shot.charged) {
          shot.spin = (shot.spin || 0) + 0.3;
          // 沿途发光拖尾
          if (Math.random() < 0.9) {
            spawnParticles(shot.x, shot.y, 2, {
              color: ['#8df4ff', '#ffffff', '#b6fff0'], speedMin: 0.2, speedMax: 1.2,
              gravity: 0, life: 14, size: 3
            });
          }
        }
      });
      state.playerShots = state.playerShots.filter(shot => shot.x > -40 && shot.x < canvasWidth + 40);
    }

    function updateEnemyShots() {
      state.enemyShots.forEach(shot => {
        // 追踪弹：一段时间内朝玩家微调方向
        if (shot.homing && shot.homing > 0) {
          const dx = (player.x + player.width / 2) - shot.x;
          const dy = (player.y + 20) - shot.y;
          const len = Math.hypot(dx, dy) || 1;
          const sp = Math.hypot(shot.vx, shot.vy) || 4.5;
          shot.vx += ((dx / len) * sp - shot.vx) * 0.05;
          shot.vy += ((dy / len) * sp - shot.vy) * 0.05;
          shot.homing -= 1;
        }
        shot.x += shot.vx;
        shot.y += shot.vy;
      });
      state.enemyShots = state.enemyShots.filter(shot => shot.x > -20 && shot.x < canvasWidth + 20 && shot.y > 0 && shot.y < canvasHeight - groundHeight);
    }

    /* ============================ 碰撞 ============================ */
    function rectOverlap(a, b) {
      return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
    }

    function pointCircleCollide(px, py, circle) {
      const dx = px - circle.x;
      const dy = py - circle.y;
      return dx * dx + dy * dy <= circle.radius * circle.radius;
    }

    function handleCollisions() {
      // 下蹲时碰撞盒变矮（顶部降低），可从低压顶障碍下方钻过
      const ph = player.crouching ? player.height * 0.5 : player.height;
      const playerBox = {x: player.x + 6, y: player.y + (player.height - ph) + 8, width: player.width - 12, height: ph - 12};

      if (state.stage === 1) {
        for (const obs of state.obstacles) {
          if (rectOverlap(playerBox, obs)) {
            endGame('游戏失败！被障碍物撞到了');
            return;
          }
        }
        for (const o of state.fallingObjects) {
          if (o.phase === 'fall') {
            const box = {x: o.x, y: o.y, width: o.width, height: o.height};
            if (rectOverlap(playerBox, box)) {
              endGame('游戏失败！被坠落物砸中');
              return;
            }
          }
        }
        if (state.door) {
          const doorBox = {x: state.door.x, y: state.door.y, width: state.door.width, height: state.door.height};
          if (rectOverlap(playerBox, doorBox)) {
            state.doorSequence = true;
            state.doorFlashTimer = 120;
            state.door = null;
            state.hintText = '传送门闪烁中...';
            spawnParticles(playerBox.x + playerBox.width / 2, playerBox.y + playerBox.height / 2, 30, {
              color: ['#5ae2ff', '#ffffff', '#7cff9b'], speedMin: 1, speedMax: 5, gravity: 0.02, life: 40, size: 3
            });
            playDoorMusic();
          }
        }
      }

      if (state.stage === 2) {
        for (const enemy of state.enemies) {
          if (rectOverlap(playerBox, enemy)) {
            endGame('游戏失败！被小怪碰到');
            return;
          }
        }
        if (state.boss && rectOverlap(playerBox, state.boss)) {
          endGame('游戏失败！被 Boss 撞到了');
          return;
        }
      }

      for (const shot of state.enemyShots) {
        if (pointCircleCollide(player.x + player.width/2, player.y + 20, shot)) {
          endGame('游戏失败！被敌人攻击命中');
          return;
        }
      }

      state.playerShots.forEach(shot => {
        state.enemies.forEach(enemy => {
          if (!enemy.alive) return;
          const ecx = enemy.x + enemy.width / 2, ecy = enemy.y + enemy.height / 2;
          const rr = Math.max(enemy.width, enemy.height) / 2 + (shot.radius || 4);
          if ((shot.x - ecx) ** 2 + (shot.y - ecy) ** 2 <= rr * rr) {
            enemy.hp -= shot.damage;
            enemy.blink = 6;
            playEnemyHitSound();
            spawnParticles(shot.x, shot.y, shot.charged ? 12 : 6, { color: ['#ffd86a', '#ffffff'], speedMin: 1, speedMax: shot.charged ? 5 : 3, gravity: 0.1, life: 16, size: 2 });
            if (!shot.charged) shot.x = canvasWidth + 200; // 普通弹命中即消失；蓄力弹穿透杂兵
            if (enemy.hp <= 0) {
              enemy.alive = false;
              state.score += 5;
              scoreEl.textContent = state.score;
              state.speed = Math.min(2.4, state.speed + 0.08);
              speedEl.textContent = state.speed.toFixed(1);
              const col = enemy.type === 'green' ? ['#5edc5e', '#ffffff']
                : enemy.type === 'red' ? ['#ff6c6c', '#ffffff']
                : enemy.type === 'flyer' ? ['#c17cff', '#ffffff']
                : ['#ff9a3c', '#ffffff'];
              spawnParticles(ecx, ecy, 18, { color: col, speedMin: 1.5, speedMax: 4.5, gravity: 0.18, life: 26, size: 3 });
              if (state.score >= 55 && !state.boss) spawnBoss();
            }
          }
        });
        if (state.boss) {
          const bossBox = {x: state.boss.x, y: state.boss.y, width: state.boss.width, height: state.boss.height};
          if (pointCircleCollide(shot.x, shot.y, {x: bossBox.x + bossBox.width/2, y: bossBox.y + bossBox.height/2, radius: bossBox.width/2 + (shot.radius || 4)})) {
            state.boss.hp -= shot.damage;
            state.boss.hitTimer = 12;
            for (let i = 0; i < 14; i++) {
              state.boss.particles.push({
                x: shot.x, y: shot.y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 1.5) * 6,
                life: 30 + Math.floor(Math.random() * 20),
                color: Math.random() < 0.5 ? '#ff9bca' : '#ffd86a'
              });
            }
            shot.x = canvasWidth + 100;
            playBossHitSound();
            addShake(3, 4);
            if (state.boss.hp <= 0) {
              state.score += 20;
              scoreEl.textContent = state.score;
              for (let i = 0; i < 48; i++) {
                state.boss.particles.push({
                  x: state.boss.x + state.boss.width/2,
                  y: state.boss.y + state.boss.height/2,
                  vx: (Math.random() - 0.5) * 10,
                  vy: (Math.random() - 0.8) * 10,
                  life: 40 + Math.floor(Math.random() * 40),
                  color: ['#ff6d6d','#7cff9b','#8df4ff','#ffd86a'][Math.floor(Math.random()*4)]
                });
              }
              addShake(12, 24);
              winGame();
            }
          }
        }
      });
    }

    /* ============================ 绘制 ============================ */
    function drawBackground() {
      // 天空渐变
      const skyGradient = ctx.createLinearGradient(0, 0, 0, canvasHeight);
      skyGradient.addColorStop(0, '#1a1040');
      skyGradient.addColorStop(0.5, '#131b3a');
      skyGradient.addColorStop(1, '#05060c');
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      // 远处光晕
      const glowGrad = ctx.createRadialGradient(canvasWidth * 0.75, 80, 20, canvasWidth * 0.75, 80, 260);
      glowGrad.addColorStop(0, 'rgba(120,90,220,0.35)');
      glowGrad.addColorStop(1, 'rgba(120,90,220,0)');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      // 星星
      for (const st of state.stars) {
        const a = 0.35 + 0.45 * Math.sin(st.twinkle);
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.beginPath();
        ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 视差山丘
      for (const h of state.hills) {
        ctx.fillStyle = h.color;
        ctx.beginPath();
        ctx.moveTo(-h.step, canvasHeight - groundHeight);
        let up = true;
        for (let x = -h.step + h.offset; x <= canvasWidth + h.step; x += h.step) {
          ctx.quadraticCurveTo(x - h.step / 2, h.base - (up ? h.amp : h.amp * 0.35), x, h.base);
          up = !up;
        }
        ctx.lineTo(canvasWidth + h.step, canvasHeight - groundHeight);
        ctx.closePath();
        ctx.fill();
      }

      // 地面
      const groundGrad = ctx.createLinearGradient(0, canvasHeight - groundHeight, 0, canvasHeight);
      groundGrad.addColorStop(0, '#2b3357');
      groundGrad.addColorStop(1, '#12162c');
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, canvasHeight - groundHeight, canvasWidth, groundHeight);
      ctx.fillStyle = '#5a6cae';
      ctx.fillRect(0, canvasHeight - groundHeight, canvasWidth, 4);
      ctx.fillStyle = 'rgba(150,190,255,0.5)';
      ctx.fillRect(0, canvasHeight - groundHeight, canvasWidth, 1);

      // 地面斜纹网格（随速度滚动）
      ctx.strokeStyle = 'rgba(90,110,190,0.16)';
      ctx.lineWidth = 1;
      const gridOffset = ((state.groundScroll % 60) + 60) % 60;
      for (let x = gridOffset; x < canvasWidth + 60; x += 60) {
        ctx.beginPath();
        ctx.moveTo(x, canvasHeight - groundHeight + 6);
        ctx.lineTo(x - 40, canvasHeight);
        ctx.stroke();
      }
    }

    function drawParticles() {
      for (const p of state.particles) {
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawPlayer() {
      const groundY = canvasHeight - groundHeight;

      // 影子（随高度缩放）
      const heightAbove = groundY - (player.y + player.height);
      const shadowScale = Math.max(0.35, 1 - heightAbove / 320);
      ctx.save();
      ctx.fillStyle = `rgba(0,0,0,${0.4 * shadowScale})`;
      ctx.beginPath();
      ctx.ellipse(player.x + player.width / 2, groundY - 2, (player.width / 2 + 4) * shadowScale, 6 * shadowScale, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 高速/空中拖尾残影
      if (Math.abs(player.vx) > 2.6 || !player.onGround) {
        for (let i = 1; i < player.trail.length; i++) {
          const t = player.trail[i];
          ctx.save();
          ctx.globalAlpha = 0.12 * (1 - i / player.trail.length);
          ctx.fillStyle = '#4fe3ff';
          ctx.fillRect(t.x + 10, t.y + 8, player.width - 20, player.height - 10);
          ctx.restore();
        }
      }

      const s = player.height / 64;
      const U = n => n * s;
      const cx = player.x + player.width / 2;
      const feetY = player.y + player.height;
      const face = player.direction === 'left' ? -1 : 1;
      const glow = 0.5 + 0.35 * Math.sin(Date.now() * 0.006);
      const legOff = (player.onGround && Math.abs(player.vx) > 0.6) ? Math.sin(player.runPhase) * 4 : 0;

      ctx.save();
      // squash & stretch 以脚底为锚点
      ctx.translate(cx, feetY);
      const crouchY = player.crouching ? 0.5 : 1;
      ctx.scale(player.squash * (player.crouching ? 1.2 : 1), player.stretch * crouchY);
      ctx.scale(face, 1);
      // 坐标系：原点脚底中心，向上为 -y，x 已按朝向翻转

      // —— 围巾（身后，随速度/跳跃飘动）——
      const sw = Math.sin(Date.now() * 0.015) * 3 + Math.abs(player.vx) * 0.7 + player.dy * 0.25;
      ctx.fillStyle = '#ff5d7a';
      ctx.beginPath();
      ctx.moveTo(U(-2), -U(42));
      ctx.quadraticCurveTo(U(-16), -U(44) - sw, U(-26), -U(30) - sw * 1.3);
      ctx.quadraticCurveTo(U(-14), -U(30), U(-4), -U(37));
      ctx.closePath();
      ctx.fill();

      // —— 腿 + 发光鞋 ——
      ctx.fillStyle = '#232a52';
      ctx.fillRect(U(-11) - legOff, -U(17), U(9), U(17)); // 后腿
      ctx.fillStyle = '#2c356a';
      ctx.fillRect(U(2) + legOff, -U(17), U(9), U(17));   // 前腿
      ctx.save();
      ctx.shadowBlur = 8 * glow; ctx.shadowColor = '#4fe3ff';
      ctx.fillStyle = '#4fe3ff';
      ctx.fillRect(U(-12) - legOff, -U(3), U(11), U(4));
      ctx.fillRect(U(1) + legOff, -U(3), U(11), U(4));
      ctx.restore();

      // —— 身体（机甲）——
      ctx.fillStyle = '#2b3470';
      ctx.fillRect(U(-13), -U(40), U(26), U(24));
      ctx.fillStyle = '#3a4a9e';
      ctx.fillRect(U(-13), -U(40), U(26), U(6));
      // 能量核心
      ctx.save();
      ctx.shadowBlur = 14; ctx.shadowColor = '#4fe3ff';
      ctx.fillStyle = `rgba(140,240,255,${0.7 + 0.3 * Math.sin(Date.now() * 0.01)})`;
      ctx.beginPath();
      ctx.arc(0, -U(28), U(5), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      // 发光描边
      ctx.strokeStyle = `rgba(79,227,255,${glow})`;
      ctx.lineWidth = Math.max(1, U(1.4));
      ctx.strokeRect(U(-13), -U(40), U(26), U(24));

      // —— 前臂（能量手套）——
      ctx.fillStyle = '#2c356a';
      ctx.fillRect(U(9), -U(37), U(6), U(15));
      ctx.save();
      ctx.shadowBlur = 8 * glow; ctx.shadowColor = '#4fe3ff';
      ctx.fillStyle = '#4fe3ff';
      ctx.fillRect(U(9), -U(24), U(6), U(3));
      ctx.restore();

      // —— 头 ——
      ctx.fillStyle = '#f7d9c4';
      ctx.beginPath();
      ctx.arc(0, -U(48), U(9), 0, Math.PI * 2);
      ctx.fill();
      // 头盔
      ctx.fillStyle = '#2b3470';
      ctx.beginPath();
      ctx.arc(0, -U(49), U(9.5), Math.PI, 0);
      ctx.fill();
      ctx.fillRect(U(-9.5), -U(50), U(19), U(4));
      // 天线 + 发光点
      ctx.strokeStyle = '#4fe3ff';
      ctx.lineWidth = Math.max(1, U(1.2));
      ctx.beginPath();
      ctx.moveTo(U(5), -U(56));
      ctx.lineTo(U(9), -U(63));
      ctx.stroke();
      ctx.save();
      ctx.shadowBlur = 10; ctx.shadowColor = '#4fe3ff';
      ctx.fillStyle = '#8df4ff';
      ctx.beginPath();
      ctx.arc(U(9), -U(63), U(2), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      // 护目镜（发光横条，朝向前方）
      ctx.save();
      ctx.shadowBlur = 12; ctx.shadowColor = '#4fe3ff';
      ctx.fillStyle = '#0d1638';
      ctx.fillRect(U(-6), -U(51), U(13), U(6));
      ctx.fillStyle = `rgba(140,244,255,${0.85})`;
      ctx.fillRect(U(-4), -U(50), U(9), U(2.6));
      ctx.restore();

      ctx.restore(); // 结束角色变换
    }

    function drawScene() {
      ctx.save();
      // 屏幕震动
      if (state.shakeTimer && state.shakeTimer > 0) {
        // 随时间衰减的抖动，位移加大，落地/命中更有冲击感
        const decay = state.shakeBase ? state.shakeTimer / state.shakeBase : 1;
        const st = (state.shakeStrength || 6) * decay;
        ctx.translate((Math.random() - 0.5) * st * 2, (Math.random() - 0.5) * st * 1.6);
        state.shakeTimer -= 1;
        if (state.shakeTimer <= 0) { state.shakeStrength = 0; state.shakeBase = 0; }
      }

      ctx.clearRect(0, 0, canvasWidth, canvasHeight);
      drawBackground();

      // 障碍物（多样化：柱子 / 高柱 / 尖刺 / 悬空）
      if (state.stage === 1) {
        state.obstacles.forEach(obs => {
          if (obs.type === 'spike') {
            const n = Math.max(2, Math.round(obs.width / 16));
            const sw = obs.width / n;
            ctx.save();
            ctx.shadowBlur = 8; ctx.shadowColor = '#ff5b5b';
            ctx.fillStyle = '#d34b4b';
            for (let i = 0; i < n; i++) {
              ctx.beginPath();
              ctx.moveTo(obs.x + i * sw, obs.y + obs.height);
              ctx.lineTo(obs.x + i * sw + sw / 2, obs.y);
              ctx.lineTo(obs.x + (i + 1) * sw, obs.y + obs.height);
              ctx.closePath(); ctx.fill();
            }
            ctx.restore();
            ctx.fillStyle = '#ffb0b0';
            for (let i = 0; i < n; i++) {
              ctx.fillRect(obs.x + i * sw + sw / 2 - 1, obs.y, 2, obs.height * 0.5);
            }
            ctx.fillStyle = '#7d2b2b';
            ctx.fillRect(obs.x, obs.y + obs.height - 5, obs.width, 5);
          } else if (obs.type === 'floating') {
            // 悬浮能量束
            ctx.strokeStyle = 'rgba(90,208,255,0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(obs.x + obs.width / 2, 0);
            ctx.lineTo(obs.x + obs.width / 2, obs.y);
            ctx.stroke();
            ctx.save();
            ctx.shadowBlur = 14; ctx.shadowColor = '#5ad0ff';
            const g = ctx.createLinearGradient(obs.x, obs.y, obs.x, obs.y + obs.height);
            g.addColorStop(0, '#5fc7f5');
            g.addColorStop(1, '#2d7fb8');
            ctx.fillStyle = g;
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            ctx.restore();
            ctx.fillStyle = '#cdeeff';
            ctx.fillRect(obs.x, obs.y, obs.width, 6);
            ctx.fillStyle = '#bfe9ff';
            ctx.fillRect(obs.x, obs.y + obs.height - 4, obs.width, 4);
          } else if (obs.type === 'tall') {
            const g = ctx.createLinearGradient(obs.x, obs.y, obs.x, obs.y + obs.height);
            g.addColorStop(0, '#b26bff');
            g.addColorStop(1, '#6a2fb0');
            ctx.fillStyle = g;
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            ctx.fillStyle = '#e0c0ff';
            ctx.fillRect(obs.x, obs.y, obs.width, 8);
            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.fillRect(obs.x + 4, obs.y + 12, 4, obs.height - 20);
            ctx.fillStyle = '#4a1d80';
            ctx.fillRect(obs.x, obs.y + obs.height - 6, obs.width, 6);
          } else { // block
            const g = ctx.createLinearGradient(obs.x, obs.y, obs.x, obs.y + obs.height);
            g.addColorStop(0, '#e8a05f');
            g.addColorStop(1, '#b8642f');
            ctx.fillStyle = g;
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            ctx.fillStyle = '#f2c48a';
            ctx.fillRect(obs.x, obs.y, obs.width, 8);
            ctx.fillStyle = '#8a4a22';
            ctx.fillRect(obs.x, obs.y + obs.height - 6, obs.width, 6);
          }
        });
      }
      // 天降坠落物（预警圈 + 陨石）
      if (state.stage === 1) drawFalling();
      // 平台
      if (state.stage === 2) {
        state.platforms.forEach(platform => {
          ctx.fillStyle = '#6a7cff';
          ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
          ctx.fillStyle = '#d5e0ff';
          ctx.fillRect(platform.x, platform.y, platform.width, 4);
        });
      }

      // 玩家子弹
      state.playerShots.forEach(shot => {
        if (shot.charged) {
          const t = shot.spin || 0;
          ctx.save();
          ctx.shadowBlur = 30;
          ctx.shadowColor = '#8df4ff';
          // 外层放射光晕
          const grd = ctx.createRadialGradient(shot.x, shot.y, 0, shot.x, shot.y, shot.radius * 1.7);
          grd.addColorStop(0, 'rgba(255,255,255,0.98)');
          grd.addColorStop(0.4, 'rgba(122,255,255,0.8)');
          grd.addColorStop(1, 'rgba(80,200,255,0)');
          ctx.fillStyle = grd;
          ctx.beginPath();
          ctx.arc(shot.x, shot.y, shot.radius * 1.7, 0, Math.PI * 2);
          ctx.fill();
          // 旋转能量环（两道十字椭圆）
          ctx.strokeStyle = 'rgba(180,255,255,0.95)';
          ctx.lineWidth = 3;
          for (let k = 0; k < 2; k++) {
            ctx.beginPath();
            ctx.ellipse(shot.x, shot.y, shot.radius, shot.radius * 0.45, t + k * Math.PI / 2, 0, Math.PI * 2);
            ctx.stroke();
          }
          // 高亮核心
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(shot.x, shot.y, shot.radius * 0.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else {
          ctx.save();
          ctx.shadowBlur = 8;
          ctx.shadowColor = shot.color || '#7cff9b';
          ctx.fillStyle = shot.color || '#7cff9b';
          ctx.beginPath();
          ctx.arc(shot.x, shot.y, shot.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      });

      // 敌人子弹
      state.enemyShots.forEach(shot => {
        ctx.save();
        ctx.shadowBlur = 8;
        ctx.shadowColor = shot.color;
        ctx.fillStyle = shot.color;
        ctx.beginPath();
        ctx.arc(shot.x, shot.y, shot.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 敌人（炫酷造型 + 技能预警 + 拖尾）
      state.enemies.forEach(enemy => {
        const flash = enemy.blink > 0;
        const cx = enemy.x + enemy.width / 2;
        const cy = enemy.y + enemy.height / 2;

        // 拖尾残影（飞行/冲刺）
        if (enemy.trail && enemy.trail.length) {
          for (let i = 1; i < enemy.trail.length; i++) {
            const tp = enemy.trail[i];
            ctx.save();
            ctx.globalAlpha = 0.12 * (1 - i / enemy.trail.length);
            ctx.fillStyle = enemy.type === 'charger' ? '#ff9a3c' : '#c9a3ff';
            ctx.fillRect(tp.x + 6, tp.y + 6, enemy.width - 12, enemy.height - 12);
            ctx.restore();
          }
        }

        if (enemy.type === 'flyer') {
          // 浮游炮：发光圆身 + 拍翅 + 脉动单眼
          const wf = Math.sin(Date.now() * 0.03) * 6;
          ctx.save();
          ctx.shadowBlur = 14; ctx.shadowColor = '#a86cff';
          ctx.fillStyle = flash ? '#ffffff' : '#d8b0ff';
          ctx.beginPath();
          ctx.moveTo(cx, cy); ctx.lineTo(enemy.x - 8, enemy.y + wf); ctx.lineTo(enemy.x - 8, enemy.y + enemy.height - wf); ctx.closePath(); ctx.fill();
          ctx.beginPath();
          ctx.moveTo(cx, cy); ctx.lineTo(enemy.x + enemy.width + 8, enemy.y + wf); ctx.lineTo(enemy.x + enemy.width + 8, enemy.y + enemy.height - wf); ctx.closePath(); ctx.fill();
          ctx.fillStyle = flash ? '#ffffff' : '#a24cff';
          ctx.beginPath(); ctx.arc(cx, cy, enemy.width / 2, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
          const eye = 0.5 + 0.5 * Math.sin(enemy.pulse);
          ctx.fillStyle = `rgba(255,80,140,${0.6 + eye * 0.4})`;
          ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, Math.PI * 2); ctx.fill();
        } else if (enemy.type === 'charger') {
          // 冲锋怪：尖箭头，蓄力时红光闪烁 + 感叹号预警
          const windup = enemy.phase === 'windup';
          const dashing = enemy.phase === 'dash';
          ctx.save();
          ctx.shadowBlur = dashing ? 20 : (windup ? 14 : 8);
          ctx.shadowColor = windup ? '#ff3030' : '#ff9a3c';
          const col = flash ? '#fff' : windup ? (Math.sin(enemy.pulse * 4) > 0 ? '#ff3030' : '#ffb060') : '#ff9a3c';
          ctx.fillStyle = col;
          ctx.beginPath();
          ctx.moveTo(enemy.x, enemy.y);
          ctx.lineTo(enemy.x + enemy.width, cy);
          ctx.lineTo(enemy.x, enemy.y + enemy.height);
          ctx.closePath(); ctx.fill();
          ctx.restore();
          ctx.fillStyle = '#5a1500';
          ctx.fillRect(enemy.x + 8, cy - 4, 8, 4);
          if (windup) {
            ctx.fillStyle = '#ff3030';
            ctx.font = 'bold 20px Arial';
            ctx.fillText('!', cx - 4, enemy.y - 6);
          }
        } else if (enemy.type === 'green') {
          // 晶体怪：发光菱形 + 脉动内核
          ctx.save();
          ctx.shadowBlur = 14; ctx.shadowColor = '#4ff0a0';
          ctx.fillStyle = flash ? '#fff' : '#3fe08a';
          ctx.beginPath();
          ctx.moveTo(cx, enemy.y);
          ctx.lineTo(enemy.x + enemy.width, cy);
          ctx.lineTo(cx, enemy.y + enemy.height);
          ctx.lineTo(enemy.x, cy);
          ctx.closePath(); ctx.fill();
          ctx.restore();
          ctx.fillStyle = `rgba(200,255,230,${0.6 + 0.4 * Math.sin(enemy.pulse)})`;
          ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#0c2a1a';
          ctx.fillRect(cx - 6, cy - 2, 4, 4);
          ctx.fillRect(cx + 2, cy - 2, 4, 4);
        } else { // red 法师
          const aiming = enemy.phase === 'aim';
          ctx.save();
          ctx.shadowBlur = aiming ? 18 : 8;
          ctx.shadowColor = '#ff5e8a';
          const col = flash ? '#fff' : aiming ? (Math.sin(enemy.pulse * 5) > 0 ? '#ff3060' : '#ff8fae') : '#ff6c6c';
          ctx.fillStyle = col;
          ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
          ctx.restore();
          // 兜帽尖顶
          ctx.fillStyle = flash ? '#fff' : '#c0304f';
          ctx.beginPath();
          ctx.moveTo(enemy.x, enemy.y + 6);
          ctx.lineTo(cx, enemy.y - 12);
          ctx.lineTo(enemy.x + enemy.width, enemy.y + 6);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.fillRect(enemy.x + 12, enemy.y + 14, 8, 8);
          ctx.fillRect(enemy.x + enemy.width - 20, enemy.y + 14, 8, 8);
          // 蓄力法球预警
          if (aiming) {
            const gr = ctx.createRadialGradient(enemy.x, cy, 0, enemy.x, cy, 12);
            gr.addColorStop(0, '#ffffff');
            gr.addColorStop(0.5, '#ff5e8a');
            gr.addColorStop(1, 'rgba(255,94,138,0)');
            ctx.fillStyle = gr;
            ctx.beginPath(); ctx.arc(enemy.x, cy, 12, 0, Math.PI * 2); ctx.fill();
          }
        }
      });

      // 门
      if (state.door) {
        const glow = 0.5 + 0.5 * Math.sin(Date.now() * 0.012);
        ctx.save();
        ctx.shadowBlur = 24; ctx.shadowColor = '#5ae2ff';
        ctx.fillStyle = `rgba(82, 214, 255, ${0.18 + glow * 0.18})`;
        ctx.fillRect(state.door.x - 8, state.door.y - 8, state.door.width + 16, state.door.height + 16);
        ctx.fillStyle = '#5ae2ff';
        ctx.fillRect(state.door.x, state.door.y, state.door.width, state.door.height);
        ctx.restore();
        ctx.fillStyle = '#ffffff';
        ctx.font = '18px Arial';
        ctx.fillText('门', state.door.x + state.door.width / 2 - 10, state.door.y + state.door.height / 2 + 8);
      }

      // 提示条
      if (state.hintText) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(0, 0, canvasWidth, 46);
        ctx.fillStyle = '#b8f1ff';
        ctx.font = '18px Arial';
        ctx.fillText(state.hintText, 18, 30);
      }

      // Boss
      if (state.boss) {
        const boss = state.boss;
        const glow = 0.2 + 0.2 * Math.sin(Date.now() * 0.03);
        ctx.save();
        ctx.shadowBlur = 22;
        ctx.shadowColor = `rgba(140, 82, 255, ${0.28 + glow * 0.4})`;
        ctx.fillStyle = '#7c3cff';
        ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
        ctx.restore();
        ctx.fillStyle = '#431f8c';
        ctx.fillRect(boss.x + 12, boss.y + 18, boss.width - 24, 18);
        ctx.fillStyle = '#ffda5c';
        ctx.fillRect(boss.x + 26, boss.y + 10, boss.width - 52, 10);
        ctx.fillStyle = '#fff';
        ctx.fillRect(boss.x + 18, boss.y + 40, 12, 12);
        ctx.fillRect(boss.x + boss.width - 30, boss.y + 40, 12, 12);
        ctx.fillStyle = '#ff6d6d';
        ctx.beginPath();
        ctx.moveTo(boss.x + 20, boss.y + 8);
        ctx.lineTo(boss.x + 30, boss.y - 6);
        ctx.lineTo(boss.x + 40, boss.y + 8);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(boss.x + boss.width - 20, boss.y + 8);
        ctx.lineTo(boss.x + boss.width - 30, boss.y - 6);
        ctx.lineTo(boss.x + boss.width - 40, boss.y + 8);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#ffeb3b';
        ctx.fillRect(boss.x + 42, boss.y + 78, 36, 14);
        ctx.fillStyle = '#fff';
        ctx.font = '14px Arial';
        ctx.fillText('BOSS', boss.x + 36, boss.y + 18);
        // 血条
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(boss.x, boss.y - 12, boss.width, 8);
        ctx.fillStyle = '#f77';
        ctx.fillRect(boss.x, boss.y - 12, boss.width * (Math.max(0, boss.hp) / boss.maxHp), 8);
        // 受击闪白
        if (boss.hitTimer && boss.hitTimer > 0) {
          ctx.fillStyle = `rgba(255,255,255,${0.18 + boss.hitTimer / 24})`;
          ctx.fillRect(boss.x - 6, boss.y - 6, boss.width + 12, boss.height + 12);
        }
        // Boss 粒子
        for (const p of boss.particles) {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 40));
          ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
          ctx.globalAlpha = 1;
        }
      }

      // 蓄力特效：聚能光环 + 核心光球（取代旧的进度条）
      if (player.charging && state.stage === 2) {
        const ratio = Math.min(1, player.chargeTime / 55);
        const dir = player.direction === 'left' ? -1 : 1;
        const ox = player.x + player.width / 2 + dir * (player.width / 2 + 6);
        const oy = player.y + 24;
        const t = Date.now() * 0.02;
        ctx.save();
        // 向内聚拢的旋转粒子
        for (let i = 0; i < 10; i++) {
          const ang = t + i * (Math.PI * 2 / 10);
          const rad = (1 - ratio) * 24 + 9 + Math.sin(t * 2 + i) * 2;
          const px = ox + Math.cos(ang) * rad;
          const py = oy + Math.sin(ang) * rad;
          ctx.globalAlpha = 0.4 + ratio * 0.5;
          ctx.fillStyle = ratio >= 1 ? '#ffe07a' : '#8df4ff';
          ctx.beginPath();
          ctx.arc(px, py, 2 + ratio * 1.6, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        // 核心光球
        const coreR = 4 + ratio * 13;
        ctx.shadowBlur = 20 + ratio * 24;
        ctx.shadowColor = ratio >= 1 ? '#ffd86a' : '#4fe3ff';
        const grd = ctx.createRadialGradient(ox, oy, 0, ox, oy, coreR);
        grd.addColorStop(0, '#ffffff');
        grd.addColorStop(0.5, ratio >= 1 ? '#ffe07a' : '#8df4ff');
        grd.addColorStop(1, 'rgba(80,200,255,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(ox, oy, coreR, 0, Math.PI * 2);
        ctx.fill();
        // 蓄满脉冲环
        if (ratio >= 1) {
          const pulse = (Math.sin(Date.now() * 0.02) + 1) / 2;
          ctx.strokeStyle = `rgba(255,224,122,${0.85 - pulse * 0.5})`;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(ox, oy, coreR + 6 + pulse * 12, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      // 通用粒子（尘土/命中/爆裂）
      drawParticles();

      // 玩家
      drawPlayer();

      // 暂停/结束时压暗
      if (!state.active) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
      }
      ctx.restore();
    }

    /* ==================== 固定步长主循环 ==================== */
    function stepGame() {
      handleInput();
      updatePlayer();
      if (state.stage === 1) updateObstacles();
      if (state.stage === 2) {
        updateEnemies();
        updateBoss();
      }
      updatePlayerShots();
      updateEnemyShots();
      updateParticles();
      updateBackground();
      handleCollisions();
      if (!state.active) return; // 碰撞可能已结束游戏

      if (state.stage === 1) {
        if (state.doorSequence) {
          state.doorFlashTimer -= 1;
          if (state.doorFlashTimer <= 0) {
            startStage2();
            state.doorSequence = false;
            state.hintText = '';
          }
        } else {
          if (state.spawnTimer <= 0) {
            spawnObstacle();
            state.spawnTimer = state.spawnInterval;
          }
          state.spawnTimer -= 1 + state.speed * 0.2;
          state.speed = Math.min(3.2, state.speed + 0.0012);
          speedEl.textContent = state.speed.toFixed(1);
          // 天降坠落物：定期生成，需左右移动躲避
          state.fallTimer -= 1;
          if (state.fallTimer <= 0) {
            spawnFalling();
            state.fallTimer = 150 - Math.min(80, state.speed * 28);
          }
        }
        updateFalling();
      }

      if (state.stage === 2 && !state.boss) {
        // 生成放缓：一次只来一个，间隔更大，不再成群
        if (state.spawnTimer <= 0) {
          spawnEnemy();
          state.spawnTimer = 175 - Math.min(55, state.speed * 12);
        }
        state.spawnTimer -= 1 + state.speed * 0.1;
      }
    }

    let _lastTime = null;
    let _accumulator = 0;
    const FIXED_DT = 1000 / 60;

    function gameLoop(timestamp) {
      if (!state.active) { _lastTime = null; return; }
      if (_lastTime == null) _lastTime = timestamp;
      let frameTime = timestamp - _lastTime;
      _lastTime = timestamp;
      if (frameTime > 100) frameTime = 100; // 防止卡顿后大跳
      _accumulator += frameTime;
      let steps = 0;
      while (_accumulator >= FIXED_DT && steps < 5) {
        stepGame();
        _accumulator -= FIXED_DT;
        steps++;
        if (!state.active) break;
      }
      drawScene();
      if (state.active) requestAnimationFrame(gameLoop);
    }

    function startLoop() {
      _lastTime = null;
      _accumulator = 0;
      requestAnimationFrame(gameLoop);
    }

    /* ============================ 事件 ============================ */
    window.addEventListener('keydown', event => {
      const code = event.code;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (code === 'Space' || code === 'KeyW') {
        if (state.active && !event.repeat) {
          player.jumpBuffer = player.jumpBufferMax;
          player.jumpHeld = true;
        }
        state.keys.Space = true;
        if (!state.active && state.messageMode !== 'end') {
          hideMessage();
          startLoop();
        } else if (!state.active && state.messageMode === 'end') {
          resetGame();
        }
        event.preventDefault();
      }
      if (code === 'KeyJ') {
        state.keys.KeyJ = true;
      }
      if (code in state.keys && code !== 'Space') {
        state.keys[code] = true;
      }
    });

    window.addEventListener('keyup', event => {
      const code = event.code;
      if (code === 'Space' || code === 'KeyW') {
        state.keys.Space = false;
        player.jumpHeld = false;
      }
      if (code === 'KeyJ') {
        if (state.stage === 2 && player.charging && player.shootCooldown <= 0 && state.active) {
          const charged = player.chargeReady;
          const damage = charged ? 3 : 1;
          firePlayerShot(damage, charged);
        }
        player.charging = false;
        player.chargeTime = 0;
        player.chargeReady = false;
        state.keys.KeyJ = false;
      }
      if (code in state.keys && code !== 'Space') {
        state.keys[code] = false;
      }
    });

    restartButton.addEventListener('click', () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (state.messageMode === 'end') {
        resetGame();
      } else {
        hideMessage();
        startLoop();
      }
    });

    initBackground();
    resetGame();
  </script>
</body>
</html>
