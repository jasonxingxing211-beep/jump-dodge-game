              addScore(20, state.boss.x + state.boss.width / 2, state.boss.y + 20, '#ff9bd0');
              for (let i = 0; i < 48; i++) {
                state.boss.particles.push({
                  x: state.boss.x + state.boss.width/2,
                  y: state.boss.y + state.boss.height/2,
                  vx: (Math.random() - 0.5) * 10,
                  vy: (Math.random() - 0.8) * 10,
                  life: 40 + Math.floor(Math.random() * 40),
                  color: ['#ff6d6d','#7cff9b','#8df4ff','#ffd86a'][Math.floor(Math.random()*4)]
                });
              }
              addShake(12, 24);
              winGame();
            }
          }
        }
      });
    }

    /* ============================ 绘制 ============================ */
    function drawBackground() {
      const TH = currentTheme();
      const horizon = canvasHeight - groundHeight;
      // 天空渐变
      const skyGradient = ctx.createLinearGradient(0, 0, 0, canvasHeight);
      skyGradient.addColorStop(0, TH.sky[0]);
      skyGradient.addColorStop(0.45, TH.sky[1]);
      skyGradient.addColorStop(1, TH.sky[2]);
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      // 星云斑块（多层径向光晕）
      const neb = [
        { x: canvasWidth * 0.72, y: 72, r: 250, c: 'rgba(120,90,220,0.30)' },
        { x: canvasWidth * 0.24, y: 120, r: 210, c: 'rgba(60,140,220,0.20)' },
        { x: canvasWidth * 0.5, y: 40, r: 170, c: 'rgba(200,90,160,0.14)' },
      ];
      for (const n of neb) {
        const g = ctx.createRadialGradient(n.x, n.y, 10, n.x, n.y, n.r);
        g.addColorStop(0, n.c);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
      }

      // 星星（亮星带十字光芒）
      for (const st of state.stars) {
        const a = 0.35 + 0.45 * Math.sin(st.twinkle);
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.beginPath();
        ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
        ctx.fill();
        if (st.bright) {
          ctx.strokeStyle = `rgba(200,230,255,${a * 0.55})`;
          ctx.lineWidth = 1;
          const g2 = st.r * 3.2;
          ctx.beginPath();
          ctx.moveTo(st.x - g2, st.y); ctx.lineTo(st.x + g2, st.y);
          ctx.moveTo(st.x, st.y - g2); ctx.lineTo(st.x, st.y + g2);
          ctx.stroke();
        }
      }

      // 流星（弱化为遥远背景星尘：细、淡、无刺眼发光，长拖尾显得很远）
      for (const me of state.meteors) {
        const al = Math.min(1, me.life / 30) * 0.45;
        ctx.strokeStyle = `rgba(200,210,255,${al})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(me.x, me.y);
        ctx.lineTo(me.x - me.vx * 6, me.y - me.vy * 6);
        ctx.stroke();
      }

      // 远景城市剪影（带发光窗）
      for (let pass = 0; pass < 2; pass++) {
        const ox = state.cityOffset + pass * (canvasWidth + 60);
        for (const b of state.city) {
          const bxp = b.x + ox;
          if (bxp > canvasWidth || bxp + b.w < -2) continue;
          ctx.fillStyle = '#0f1636';
          ctx.fillRect(bxp, horizon - b.h, b.w, b.h);
          ctx.fillStyle = 'rgba(120,200,255,0.32)';
          for (let wy = horizon - b.h + 7; wy < horizon - 6; wy += 12) {
            for (let wx = bxp + 5; wx < bxp + b.w - 4; wx += 11) {
              if ((Math.floor(wx / 11) + Math.floor(wy / 12) + b.win) % 3 !== 0) ctx.fillRect(wx, wy, 3, 5);
            }
          }
        }
      }

      // 视差山丘
      for (const h of state.hills) {
        ctx.fillStyle = h.color;
        ctx.beginPath();
        ctx.moveTo(-h.step, horizon);
        let up = true;
        for (let x = -h.step + h.offset; x <= canvasWidth + h.step; x += h.step) {
          ctx.quadraticCurveTo(x - h.step / 2, h.base - (up ? h.amp : h.amp * 0.35), x, h.base);
          up = !up;
        }
        ctx.lineTo(canvasWidth + h.step, horizon);
        ctx.closePath();
        ctx.fill();
      }

      // 漂浮光尘
      for (const m of state.motes) {
        const a = 0.2 + 0.25 * (0.5 + 0.5 * Math.sin(m.drift * 2));
        ctx.fillStyle = `rgba(${m.hue},${a})`;
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 地面
      const groundGrad = ctx.createLinearGradient(0, horizon, 0, canvasHeight);
      groundGrad.addColorStop(0, TH.ground[0]);
      groundGrad.addColorStop(0.5, TH.ground[1]);
      groundGrad.addColorStop(1, TH.ground[2]);
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, horizon, canvasWidth, groundHeight);
      // 地平线发光
      ctx.save();
      ctx.shadowBlur = 12; ctx.shadowColor = TH.accent;
      ctx.fillStyle = TH.accent;
      ctx.fillRect(0, horizon, canvasWidth, 3);
      ctx.restore();
      ctx.fillStyle = 'rgba(160,200,255,0.6)';
      ctx.fillRect(0, horizon, canvasWidth, 1);

      // 地面纵向斜纹网格（随速度滚动）
      ctx.strokeStyle = 'rgba(90,110,190,0.18)';
      ctx.lineWidth = 1;
      const gridOffset = ((state.groundScroll % 60) + 60) % 60;
      for (let x = gridOffset; x < canvasWidth + 60; x += 60) {
        ctx.beginPath();
        ctx.moveTo(x, horizon + 6);
        ctx.lineTo(x - 40, canvasHeight);
        ctx.stroke();
      }
      // 地面横向透视线
      ctx.strokeStyle = 'rgba(90,110,190,0.12)';
      for (let i = 1; i <= 3; i++) {
        const yy = horizon + i * i * 8;
        ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(canvasWidth, yy); ctx.stroke();
      }
    }

    function drawParticles() {
      for (const p of state.particles) {
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    // 落地冲击环绘制（椭圆扩散，贴地面）
    function drawLandRings() {
      if (!state.landRings || !state.landRings.length) return;
      ctx.save();
      for (const ring of state.landRings) {
        const a = ring.alpha * ring.life; // life 0→1，由亮淡出
        ctx.globalAlpha = Math.max(0, a);
        ctx.strokeStyle = '#d0ddff';
        ctx.lineWidth = 1.8 + (1 - ring.life) * 2;
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#8eb4ff';
        ctx.beginPath();
        ctx.ellipse(ring.x, ring.y, ring.r, ring.r * 0.32, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    function drawPlayer() {
      const SK = currentSkin();
      const groundY = canvasHeight - groundHeight;

      // 影子（随高度缩放）
      const heightAbove = groundY - (player.y + player.height);
      const shadowScale = Math.max(0.35, 1 - heightAbove / 320);
      ctx.save();
      ctx.fillStyle = `rgba(0,0,0,${0.4 * shadowScale})`;
      ctx.beginPath();
      ctx.ellipse(player.x + player.width / 2, groundY - 2, (player.width / 2 + 4) * shadowScale, 6 * shadowScale, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 高速/空中拖尾残影
      if (Math.abs(player.vx) > 2.6 || !player.onGround) {
        for (let i = 1; i < player.trail.length; i++) {
          const t = player.trail[i];
          ctx.save();
          ctx.globalAlpha = 0.12 * (1 - i / player.trail.length);
          ctx.fillStyle = SK.glow;
          ctx.fillRect(t.x + 10, t.y + 8, player.width - 20, player.height - 10);
          ctx.restore();
        }
      }

      const s = player.height / 64;
      const U = n => n * s;
      const cx = player.x + player.width / 2;
      const feetY = player.y + player.height;
      const face = player.direction === 'left' ? -1 : 1;
      const glow = 0.5 + 0.35 * Math.sin(Date.now() * 0.006);
      const legOff = (player.onGround && Math.abs(player.vx) > 0.6) ? Math.sin(player.runPhase) * 4 : 0;

      ctx.save();
      // squash & stretch 以脚底为锚点
      ctx.translate(cx, feetY);
      const crouchY = player.crouching ? 0.5 : 1;
      ctx.scale(player.squash * (player.crouching ? 1.2 : 1), player.stretch * crouchY);
      ctx.scale(face, 1);
      // 坐标系：原点脚底中心，向上为 -y，x 已按朝向翻转

      // —— 围巾（双层 + 高光，多段飘动）——
      const sw = Math.sin(Date.now() * 0.015) * 3 + Math.abs(player.vx) * 0.8 + player.dy * 0.28;
      ctx.fillStyle = SK.scarfDark; // 深色底
      ctx.beginPath();
      ctx.moveTo(U(-2), -U(43));
      ctx.quadraticCurveTo(U(-18), -U(46) - sw, U(-30), -U(30) - sw * 1.4);
      ctx.quadraticCurveTo(U(-20), -U(31), U(-4), -U(37));
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = SK.scarf; // 亮面
      ctx.beginPath();
      ctx.moveTo(U(-2), -U(43));
      ctx.quadraticCurveTo(U(-16), -U(45) - sw, U(-26), -U(31) - sw * 1.3);
      ctx.quadraticCurveTo(U(-16), -U(32), U(-4), -U(38));
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,190,205,0.7)'; // 高光条
      ctx.lineWidth = Math.max(1, U(1));
      ctx.beginPath();
      ctx.moveTo(U(-6), -U(41));
      ctx.quadraticCurveTo(U(-16), -U(42) - sw, U(-24), -U(31) - sw);
      ctx.stroke();

      // —— 腿（装甲分段 + 膝盖发光 + 渐变鞋）——
      ctx.fillStyle = '#1f2648';
      ctx.fillRect(U(-11) - legOff, -U(18), U(9), U(18)); // 后腿
      ctx.fillStyle = '#2a3360';
      ctx.fillRect(U(-11) - legOff, -U(18), U(9), U(4));
      ctx.fillStyle = '#2c356a';
      ctx.fillRect(U(2) + legOff, -U(18), U(9), U(18)); // 前腿
      ctx.fillStyle = '#3a4680';
      ctx.fillRect(U(2) + legOff, -U(18), U(9), U(4));
      ctx.fillStyle = 'rgba(120,240,255,0.85)'; // 膝盖发光
      ctx.fillRect(U(-10) - legOff, -U(10), U(3), U(2));
      ctx.fillRect(U(4) + legOff, -U(10), U(3), U(2));
      ctx.save();
      ctx.shadowBlur = 10 * glow; ctx.shadowColor = SK.glow;
      const shoeG = ctx.createLinearGradient(0, -U(4), 0, 0);
      shoeG.addColorStop(0, SK.core); shoeG.addColorStop(1, '#2aa8d8');
      ctx.fillStyle = shoeG;
      ctx.fillRect(U(-12) - legOff, -U(4), U(11), U(4));
      ctx.fillRect(U(1) + legOff, -U(4), U(11), U(4));
      ctx.restore();

      // —— 身体（分段机甲 + 肩甲 + 能量线）——
      const bodyG = ctx.createLinearGradient(U(-13), -U(40), U(13), -U(16));
      bodyG.addColorStop(0, '#2b3470');
      bodyG.addColorStop(1, '#1b2350');
      ctx.fillStyle = bodyG;
      ctx.fillRect(U(-13), -U(40), U(26), U(24));
      ctx.fillStyle = '#3a4a9e'; // 胸甲上段
      ctx.fillRect(U(-13), -U(40), U(26), U(7));
      ctx.strokeStyle = 'rgba(10,14,30,0.55)'; // 腹部分段线
      ctx.lineWidth = Math.max(1, U(1));
      ctx.beginPath(); ctx.moveTo(U(-13), -U(26)); ctx.lineTo(U(13), -U(26)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(U(-13), -U(21)); ctx.lineTo(U(13), -U(21)); ctx.stroke();
      ctx.fillStyle = '#454f9e'; // 肩甲
      ctx.fillRect(U(-15), -U(40), U(5), U(9));
      ctx.fillRect(U(10), -U(40), U(5), U(9));
      ctx.strokeStyle = `rgba(${SK.glowRgb},${glow})`; // 侧面能量线
      ctx.lineWidth = Math.max(1, U(1));
      ctx.beginPath(); ctx.moveTo(U(-11), -U(38)); ctx.lineTo(U(-11), -U(20)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(U(11), -U(38)); ctx.lineTo(U(11), -U(20)); ctx.stroke();

      // 能量核心（多层光晕 + 旋转环）
      const coreP = 0.7 + 0.3 * Math.sin(Date.now() * 0.01);
      ctx.save();
      ctx.shadowBlur = 18; ctx.shadowColor = SK.glow;
      const coreG = ctx.createRadialGradient(0, -U(28), 0, 0, -U(28), U(7));
      coreG.addColorStop(0, '#ffffff');
      coreG.addColorStop(0.5, `rgba(140,240,255,${coreP})`);
      coreG.addColorStop(1, `rgba(${SK.glowRgb},0)`);
      ctx.fillStyle = coreG;
      ctx.beginPath(); ctx.arc(0, -U(28), U(7), 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = `rgba(180,250,255,${0.6 * coreP})`;
      ctx.lineWidth = Math.max(1, U(1));
      ctx.beginPath(); ctx.ellipse(0, -U(28), U(6), U(2.4), Date.now() * 0.004, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = `rgba(${SK.glowRgb},${0.5 * glow})`; // 整体发光描边
      ctx.lineWidth = Math.max(1, U(1.2));
      ctx.strokeRect(U(-13), -U(40), U(26), U(24));

      // —— 前臂（能量手套 + 手环）——
      ctx.fillStyle = '#2c356a';
      ctx.fillRect(U(9), -U(38), U(6), U(16));
      ctx.fillStyle = '#3a4680';
      ctx.fillRect(U(9), -U(38), U(6), U(4));
      ctx.save();
      ctx.shadowBlur = 8 * glow; ctx.shadowColor = SK.glow;
      ctx.fillStyle = SK.glow;
      ctx.fillRect(U(9), -U(24), U(6), U(3)); // 手套发光
      ctx.fillRect(U(9), -U(31), U(6), U(1.5)); // 手环
      ctx.restore();

      // —— 头（脸渐变 + 头盔中脊 + 护目镜高光）——
      const faceG = ctx.createLinearGradient(0, -U(57), 0, -U(40));
      faceG.addColorStop(0, '#ffe6d2'); faceG.addColorStop(1, '#eec4aa');
      ctx.fillStyle = faceG;
      ctx.beginPath(); ctx.arc(0, -U(48), U(9), 0, Math.PI * 2); ctx.fill();
      const helmG = ctx.createLinearGradient(0, -U(58), 0, -U(46));
      helmG.addColorStop(0, '#3a4590'); helmG.addColorStop(1, '#232a52');
      ctx.fillStyle = helmG;
      ctx.beginPath(); ctx.arc(0, -U(49), U(9.5), Math.PI, 0); ctx.fill();
      ctx.fillRect(U(-9.5), -U(50), U(19), U(4));
      ctx.fillStyle = SK.glow; // 头盔中脊
      ctx.fillRect(U(-1), -U(58), U(2), U(9));
      ctx.strokeStyle = 'rgba(10,14,30,0.5)';
      ctx.lineWidth = Math.max(1, U(1));
      ctx.beginPath(); ctx.moveTo(U(-9), -U(49)); ctx.lineTo(U(9), -U(49)); ctx.stroke();
      // 天线 + 发光点
      ctx.strokeStyle = SK.glow;
      ctx.lineWidth = Math.max(1, U(1.2));
      ctx.beginPath(); ctx.moveTo(U(5), -U(56)); ctx.lineTo(U(9), -U(64)); ctx.stroke();
      ctx.save();
      ctx.shadowBlur = 12; ctx.shadowColor = SK.glow;
      ctx.fillStyle = SK.core;
      ctx.beginPath(); ctx.arc(U(9), -U(64), U(2.2), 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      // 护目镜（渐变 + 高光反光）
      ctx.save();
      ctx.shadowBlur = 12; ctx.shadowColor = SK.glow;
      ctx.fillStyle = '#0d1638';
      ctx.fillRect(U(-6.5), -U(51), U(14), U(6.5));
      const goG = ctx.createLinearGradient(U(-6), -U(50), U(7), -U(45));
      goG.addColorStop(0, '#bffcff'); goG.addColorStop(0.5, SK.glow); goG.addColorStop(1, '#1aa0d0');
      ctx.fillStyle = goG;
      ctx.fillRect(U(-5), -U(50), U(11), U(3.2));
      ctx.fillStyle = 'rgba(255,255,255,0.85)'; // 反光高光
      ctx.fillRect(U(-4), -U(50), U(3), U(1.2));
      ctx.restore();

      ctx.restore(); // 结束角色变换
    }

    function drawScene() {
      window.__drawCount = (window.__drawCount || 0) + 1;
      ctx.save();
      // 屏幕震动
      if (state.shakeTimer && state.shakeTimer > 0) {
        // 随时间衰减的抖动，位移加大，落地/命中更有冲击感
        const decay = state.shakeBase ? state.shakeTimer / state.shakeBase : 1;
        const st = (state.shakeStrength || 6) * decay;
        ctx.translate((Math.random() - 0.5) * st * 2, (Math.random() - 0.5) * st * 1.6);
        state.shakeTimer -= 1;
        if (state.shakeTimer <= 0) { state.shakeStrength = 0; state.shakeBase = 0; }
      }

      ctx.clearRect(0, 0, canvasWidth, canvasHeight);
      drawBackground();

      // 障碍物（多样化：柱子 / 高柱 / 尖刺 / 悬空）
      if (state.stage === 1) {
        state.obstacles.forEach(obs => {
          if (obs.type === 'spike') {
            const n = Math.max(2, Math.round(obs.width / 16));
            const sw = obs.width / n;
            ctx.save();
            ctx.shadowBlur = 8; ctx.shadowColor = '#ff5b5b';
            ctx.fillStyle = '#d34b4b';
            for (let i = 0; i < n; i++) {
              ctx.beginPath();
              ctx.moveTo(obs.x + i * sw, obs.y + obs.height);
              ctx.lineTo(obs.x + i * sw + sw / 2, obs.y);
              ctx.lineTo(obs.x + (i + 1) * sw, obs.y + obs.height);
              ctx.closePath(); ctx.fill();
            }
            ctx.restore();
            ctx.fillStyle = '#ffb0b0';
            for (let i = 0; i < n; i++) {
              ctx.fillRect(obs.x + i * sw + sw / 2 - 1, obs.y, 2, obs.height * 0.5);
            }
            ctx.fillStyle = '#7d2b2b';
            ctx.fillRect(obs.x, obs.y + obs.height - 5, obs.width, 5);
          } else if (obs.type === 'floating') {
            // 悬浮能量束
            ctx.strokeStyle = 'rgba(90,208,255,0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(obs.x + obs.width / 2, 0);
            ctx.lineTo(obs.x + obs.width / 2, obs.y);
            ctx.stroke();
            ctx.save();
            ctx.shadowBlur = 14; ctx.shadowColor = '#5ad0ff';
            const g = ctx.createLinearGradient(obs.x, obs.y, obs.x, obs.y + obs.height);
            g.addColorStop(0, '#5fc7f5');
            g.addColorStop(1, '#2d7fb8');
            ctx.fillStyle = g;
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            ctx.restore();
            ctx.fillStyle = '#cdeeff';
            ctx.fillRect(obs.x, obs.y, obs.width, 6);
            ctx.fillStyle = '#bfe9ff';
            ctx.fillRect(obs.x, obs.y + obs.height - 4, obs.width, 4);
          } else if (obs.type === 'tall') {
            const g = ctx.createLinearGradient(obs.x, obs.y, obs.x, obs.y + obs.height);
            g.addColorStop(0, '#b26bff');
            g.addColorStop(1, '#6a2fb0');
            ctx.fillStyle = g;
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            ctx.fillStyle = '#e0c0ff';
            ctx.fillRect(obs.x, obs.y, obs.width, 8);
            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.fillRect(obs.x + 4, obs.y + 12, 4, obs.height - 20);
            ctx.fillStyle = '#4a1d80';
            ctx.fillRect(obs.x, obs.y + obs.height - 6, obs.width, 6);
          } else { // block
            const g = ctx.createLinearGradient(obs.x, obs.y, obs.x, obs.y + obs.height);
            g.addColorStop(0, '#e8a05f');
            g.addColorStop(1, '#b8642f');
            ctx.fillStyle = g;
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            ctx.fillStyle = '#f2c48a';
            ctx.fillRect(obs.x, obs.y, obs.width, 8);
            ctx.fillStyle = '#8a4a22';
            ctx.fillRect(obs.x, obs.y + obs.height - 6, obs.width, 6);
          }
        });
      }
      // 天降坠落物（预警圈 + 陨石）
      if (state.stage === 1) drawFalling();
      drawItems();
      // 平台
      if (state.stage === 2) {
        state.platforms.forEach(platform => {
          ctx.fillStyle = '#6a7cff';
          ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
          ctx.fillStyle = '#d5e0ff';
          ctx.fillRect(platform.x, platform.y, platform.width, 4);
        });
      }

      // 玩家子弹
      state.playerShots.forEach(shot => {
        if (shot.charged) {
          const t = shot.spin || 0;
          ctx.save();
          ctx.shadowBlur = 30;
          ctx.shadowColor = '#8df4ff';
          // 外层放射光晕
          const grd = ctx.createRadialGradient(shot.x, shot.y, 0, shot.x, shot.y, shot.radius * 1.7);
          grd.addColorStop(0, 'rgba(255,255,255,0.98)');
          grd.addColorStop(0.4, 'rgba(122,255,255,0.8)');
          grd.addColorStop(1, 'rgba(80,200,255,0)');
          ctx.fillStyle = grd;
          ctx.beginPath();
          ctx.arc(shot.x, shot.y, shot.radius * 1.7, 0, Math.PI * 2);
          ctx.fill();
          // 旋转能量环（两道十字椭圆）
          ctx.strokeStyle = 'rgba(180,255,255,0.95)';
          ctx.lineWidth = 3;
          for (let k = 0; k < 2; k++) {
            ctx.beginPath();
            ctx.ellipse(shot.x, shot.y, shot.radius, shot.radius * 0.45, t + k * Math.PI / 2, 0, Math.PI * 2);
            ctx.stroke();
          }
          // 高亮核心
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(shot.x, shot.y, shot.radius * 0.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else {
          ctx.save();
          ctx.shadowBlur = 8;
          ctx.shadowColor = shot.color || '#7cff9b';
          ctx.fillStyle = shot.color || '#7cff9b';
          ctx.beginPath();
          ctx.arc(shot.x, shot.y, shot.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      });

      // 敌人子弹
      state.enemyShots.forEach(shot => {
        ctx.save();
        ctx.shadowBlur = 8;
        ctx.shadowColor = shot.color;
        ctx.fillStyle = shot.color;
        ctx.beginPath();
        ctx.arc(shot.x, shot.y, shot.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 敌人（炫酷造型 + 技能预警 + 拖尾）
      state.enemies.forEach(enemy => {
        const flash = enemy.blink > 0;
        const cx = enemy.x + enemy.width / 2;
        const cy = enemy.y + enemy.height / 2;

        // 拖尾残影（飞行/冲刺）
        if (enemy.trail && enemy.trail.length) {
          for (let i = 1; i < enemy.trail.length; i++) {
            const tp = enemy.trail[i];
            ctx.save();
            ctx.globalAlpha = 0.12 * (1 - i / enemy.trail.length);
            ctx.fillStyle = enemy.type === 'charger' ? '#ff9a3c' : '#c9a3ff';
            ctx.fillRect(tp.x + 6, tp.y + 6, enemy.width - 12, enemy.height - 12);
            ctx.restore();
          }
        }

        if (enemy.type === 'flyer') {
          // 浮游炮：发光圆身 + 拍翅 + 脉动单眼
          const wf = Math.sin(Date.now() * 0.03) * 6;
          ctx.save();
          ctx.shadowBlur = 14; ctx.shadowColor = '#a86cff';
          ctx.fillStyle = flash ? '#ffffff' : '#d8b0ff';
          ctx.beginPath();
          ctx.moveTo(cx, cy); ctx.lineTo(enemy.x - 8, enemy.y + wf); ctx.lineTo(enemy.x - 8, enemy.y + enemy.height - wf); ctx.closePath(); ctx.fill();
          ctx.beginPath();
          ctx.moveTo(cx, cy); ctx.lineTo(enemy.x + enemy.width + 8, enemy.y + wf); ctx.lineTo(enemy.x + enemy.width + 8, enemy.y + enemy.height - wf); ctx.closePath(); ctx.fill();
          ctx.fillStyle = flash ? '#ffffff' : '#a24cff';
          ctx.beginPath(); ctx.arc(cx, cy, enemy.width / 2, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
          const eye = 0.5 + 0.5 * Math.sin(enemy.pulse);
          ctx.fillStyle = `rgba(255,80,140,${0.6 + eye * 0.4})`;
          ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, Math.PI * 2); ctx.fill();
        } else if (enemy.type === 'charger') {
          // 冲锋怪：尖箭头，蓄力时红光闪烁 + 感叹号预警
          const windup = enemy.phase === 'windup';
          const dashing = enemy.phase === 'dash';
          ctx.save();
          ctx.shadowBlur = dashing ? 20 : (windup ? 14 : 8);
          ctx.shadowColor = windup ? '#ff3030' : '#ff9a3c';
          const col = flash ? '#fff' : windup ? (Math.sin(enemy.pulse * 4) > 0 ? '#ff3030' : '#ffb060') : '#ff9a3c';
          ctx.fillStyle = col;
          ctx.beginPath();
          ctx.moveTo(enemy.x, enemy.y);
          ctx.lineTo(enemy.x + enemy.width, cy);
          ctx.lineTo(enemy.x, enemy.y + enemy.height);
          ctx.closePath(); ctx.fill();
          ctx.restore();
          ctx.fillStyle = '#5a1500';
          ctx.fillRect(enemy.x + 8, cy - 4, 8, 4);
          if (windup) {
            ctx.fillStyle = '#ff3030';
            ctx.font = 'bold 20px Arial';
            ctx.fillText('!', cx - 4, enemy.y - 6);
          }
        } else if (enemy.type === 'green') {
          // 晶体怪：发光菱形 + 脉动内核
          ctx.save();
          ctx.shadowBlur = 14; ctx.shadowColor = '#4ff0a0';
          ctx.fillStyle = flash ? '#fff' : '#3fe08a';
          ctx.beginPath();
          ctx.moveTo(cx, enemy.y);
          ctx.lineTo(enemy.x + enemy.width, cy);
          ctx.lineTo(cx, enemy.y + enemy.height);
          ctx.lineTo(enemy.x, cy);
          ctx.closePath(); ctx.fill();
          ctx.restore();
          ctx.fillStyle = `rgba(200,255,230,${0.6 + 0.4 * Math.sin(enemy.pulse)})`;
          ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#0c2a1a';
          ctx.fillRect(cx - 6, cy - 2, 4, 4);
          ctx.fillRect(cx + 2, cy - 2, 4, 4);
        } else { // red 法师
          const aiming = enemy.phase === 'aim';
          ctx.save();
          ctx.shadowBlur = aiming ? 18 : 8;
          ctx.shadowColor = '#ff5e8a';
          const col = flash ? '#fff' : aiming ? (Math.sin(enemy.pulse * 5) > 0 ? '#ff3060' : '#ff8fae') : '#ff6c6c';
          ctx.fillStyle = col;
          ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
          ctx.restore();
          // 兜帽尖顶
          ctx.fillStyle = flash ? '#fff' : '#c0304f';
          ctx.beginPath();
          ctx.moveTo(enemy.x, enemy.y + 6);
          ctx.lineTo(cx, enemy.y - 12);
          ctx.lineTo(enemy.x + enemy.width, enemy.y + 6);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.fillRect(enemy.x + 12, enemy.y + 14, 8, 8);
          ctx.fillRect(enemy.x + enemy.width - 20, enemy.y + 14, 8, 8);
          // 蓄力法球预警
          if (aiming) {
            const gr = ctx.createRadialGradient(enemy.x, cy, 0, enemy.x, cy, 12);
            gr.addColorStop(0, '#ffffff');
            gr.addColorStop(0.5, '#ff5e8a');
            gr.addColorStop(1, 'rgba(255,94,138,0)');
            ctx.fillStyle = gr;
            ctx.beginPath(); ctx.arc(enemy.x, cy, 12, 0, Math.PI * 2); ctx.fill();
          }
        }
      });

      // 门
      if (state.door) {
        const glow = 0.5 + 0.5 * Math.sin(Date.now() * 0.012);
        ctx.save();
        ctx.shadowBlur = 24; ctx.shadowColor = '#5ae2ff';
        ctx.fillStyle = `rgba(82, 214, 255, ${0.18 + glow * 0.18})`;
        ctx.fillRect(state.door.x - 8, state.door.y - 8, state.door.width + 16, state.door.height + 16);
        ctx.fillStyle = '#5ae2ff';
        ctx.fillRect(state.door.x, state.door.y, state.door.width, state.door.height);
        ctx.restore();
        ctx.fillStyle = '#ffffff';
        ctx.font = '18px Arial';
        ctx.fillText('门', state.door.x + state.door.width / 2 - 10, state.door.y + state.door.height / 2 + 8);
      }

      // 提示条
      if (state.hintText) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(0, 0, canvasWidth, 46);
        ctx.fillStyle = '#b8f1ff';
        ctx.font = '18px Arial';
        ctx.fillText(state.hintText, 18, 30);
      }

      // Boss
      if (state.boss) {
        const boss = state.boss;
        const glow = 0.2 + 0.2 * Math.sin(Date.now() * 0.03);
        ctx.save();
        ctx.shadowBlur = 22;
        ctx.shadowColor = `rgba(140, 82, 255, ${0.28 + glow * 0.4})`;
        ctx.fillStyle = '#7c3cff';
        ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
        ctx.restore();
        ctx.fillStyle = '#431f8c';
        ctx.fillRect(boss.x + 12, boss.y + 18, boss.width - 24, 18);
        ctx.fillStyle = '#ffda5c';
        ctx.fillRect(boss.x + 26, boss.y + 10, boss.width - 52, 10);
        ctx.fillStyle = '#fff';
        ctx.fillRect(boss.x + 18, boss.y + 40, 12, 12);
        ctx.fillRect(boss.x + boss.width - 30, boss.y + 40, 12, 12);
        ctx.fillStyle = '#ff6d6d';
        ctx.beginPath();
        ctx.moveTo(boss.x + 20, boss.y + 8);
        ctx.lineTo(boss.x + 30, boss.y - 6);
        ctx.lineTo(boss.x + 40, boss.y + 8);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(boss.x + boss.width - 20, boss.y + 8);
        ctx.lineTo(boss.x + boss.width - 30, boss.y - 6);
        ctx.lineTo(boss.x + boss.width - 40, boss.y + 8);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#ffeb3b';
        ctx.fillRect(boss.x + 42, boss.y + 78, 36, 14);
        ctx.fillStyle = '#fff';
        ctx.font = '14px Arial';
        ctx.fillText('BOSS', boss.x + 36, boss.y + 18);
        // 血条（分段格子）
        const _bw = boss.width, _bx = boss.x, _by = boss.y - 16;
        const _segs = boss.maxHp; // 每格 1 HP
        const _segW = Math.floor(_bw / _segs);
        const _barH = 10;
        const _hpNow = Math.max(0, boss.hp);
        ctx.save();
        // 背景槽
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.beginPath();
        ctx.roundRect(_bx - 1, _by - 1, _bw + 2, _barH + 2, 3);
        ctx.fill();
        for (let _si = 0; _si < _segs; _si++) {
          const _sx = _bx + _si * _segW;
          const _filled = _si < _hpNow;
          // 每格颜色：HP > 50% 绿→橙，≤50% 橙→红
          const _ratio = _hpNow / boss.maxHp;
          let _fc;
          if (_ratio > 0.6)      _fc = '#6dff88';
          else if (_ratio > 0.3) _fc = '#ffb347';
          else                   _fc = '#ff4455';
          ctx.fillStyle = _filled ? _fc : 'rgba(255,255,255,0.08)';
          ctx.fillRect(_sx + 1, _by, _segW - 2, _barH);
          // 高光
          if (_filled) {
            ctx.fillStyle = 'rgba(255,255,255,0.22)';
            ctx.fillRect(_sx + 1, _by, _segW - 2, 3);
          }
        }
        // 外边框
        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(_bx - 1, _by - 1, _bw + 2, _barH + 2, 3);
        ctx.stroke();
        // Boss 名牌
        ctx.font = 'bold 11px Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillText('BOSS  ' + _hpNow + ' / ' + boss.maxHp, _bx + _bw / 2 + 1, _by - 3);
        ctx.fillStyle = '#ffccd5';
        ctx.fillText('BOSS  ' + _hpNow + ' / ' + boss.maxHp, _bx + _bw / 2, _by - 4);
        ctx.textAlign = 'left';
        ctx.restore();
        // 受击闪白
        if (boss.hitTimer && boss.hitTimer > 0) {
          ctx.fillStyle = `rgba(255,255,255,${0.18 + boss.hitTimer / 24})`;
          ctx.fillRect(boss.x - 6, boss.y - 6, boss.width + 12, boss.height + 12);
        }
        // Boss 粒子
        for (const p of boss.particles) {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 40));
          ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
          ctx.globalAlpha = 1;
        }
      }

      // 蓄力特效：聚能光环 + 核心光球（取代旧的进度条）
      if (player.charging && state.stage === 2) {
        const ratio = Math.min(1, player.chargeTime / 55);
        const dir = player.direction === 'left' ? -1 : 1;
        const ox = player.x + player.width / 2 + dir * (player.width / 2 + 6);
        const oy = player.y + 24;
        const t = Date.now() * 0.02;
        ctx.save();
        // 向内聚拢的旋转粒子
        for (let i = 0; i < 10; i++) {
          const ang = t + i * (Math.PI * 2 / 10);
          const rad = (1 - ratio) * 24 + 9 + Math.sin(t * 2 + i) * 2;
          const px = ox + Math.cos(ang) * rad;
          const py = oy + Math.sin(ang) * rad;
          ctx.globalAlpha = 0.4 + ratio * 0.5;
          ctx.fillStyle = ratio >= 1 ? '#ffe07a' : '#8df4ff';
          ctx.beginPath();
          ctx.arc(px, py, 2 + ratio * 1.6, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        // 核心光球
        const coreR = 4 + ratio * 13;
        ctx.shadowBlur = 20 + ratio * 24;
        ctx.shadowColor = ratio >= 1 ? '#ffd86a' : '#4fe3ff';
        const grd = ctx.createRadialGradient(ox, oy, 0, ox, oy, coreR);
        grd.addColorStop(0, '#ffffff');
        grd.addColorStop(0.5, ratio >= 1 ? '#ffe07a' : '#8df4ff');
        grd.addColorStop(1, 'rgba(80,200,255,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(ox, oy, coreR, 0, Math.PI * 2);
        ctx.fill();
        // 蓄满脉冲环
        if (ratio >= 1) {
          const pulse = (Math.sin(Date.now() * 0.02) + 1) / 2;
          ctx.strokeStyle = `rgba(255,224,122,${0.85 - pulse * 0.5})`;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(ox, oy, coreR + 6 + pulse * 12, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      // 通用粒子（尘土/命中/爆裂）
      drawLandRings();
      drawParticles();
      drawFloatTexts();

      // 玩家
      drawPlayer();

      // 护盾光环（拥有护盾或破盾后无敌期显示）
      if (player.shield || player.invuln > 0) {
        const pcx = player.x + player.width / 2;
        const pcy = player.y + player.height / 2;
        const rt = Date.now() * 0.005;
        ctx.save();
        ctx.globalAlpha = player.shield ? 0.55 : 0.28;
        ctx.strokeStyle = '#7ef0ff';
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 14; ctx.shadowColor = '#7ef0ff';
        ctx.beginPath();
        ctx.ellipse(pcx, pcy, player.width * 0.92, player.height * 0.62, 0, 0, Math.PI * 2);
        ctx.stroke();
        for (let i = 0; i < 3; i++) {
          const a = rt + i * (Math.PI * 2 / 3);
          ctx.fillStyle = 'rgba(180,250,255,0.85)';
          ctx.beginPath();
          ctx.arc(pcx + Math.cos(a) * player.width * 0.92, pcy + Math.sin(a) * player.height * 0.62, 2.6, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // 暗角（vignette）提升氛围与聚焦
      const vig = ctx.createRadialGradient(canvasWidth / 2, canvasHeight / 2, canvasHeight * 0.35, canvasWidth / 2, canvasHeight / 2, canvasHeight * 0.85);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(0,0,0,0.45)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      // 受伤红晕（边缘红色脉冲，hurt/shield-break 触发，30~55帧淡出）
      if (state.hurtTimer > 0) {
        const _ht = state.hurtTimer;
        const _maxT = 55;
        // 前几帧强闪，之后快速衰减
        const _a = Math.pow(_ht / _maxT, 0.6) * 0.72;
        const _rvig = ctx.createRadialGradient(
          canvasWidth / 2, canvasHeight / 2, canvasHeight * 0.28,
          canvasWidth / 2, canvasHeight / 2, canvasHeight * 0.9
        );
        _rvig.addColorStop(0, 'rgba(200,0,0,0)');
        _rvig.addColorStop(0.55, `rgba(180,0,0,${(_a * 0.3).toFixed(3)})`);
        _rvig.addColorStop(1, `rgba(220,0,0,${_a.toFixed(3)})`);
        ctx.fillStyle = _rvig;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
      }

      // 连击 HUD（Canvas 固定位置，弹簧放大动画，combo ≥ 3 才显示）
      if (state.combo >= 3 && state.comboTimer > 0) {
        const _cx = canvasWidth - 16;
        const _cy = 52;
        const _sc = Math.max(0.5, state.comboScale);
        const _fadeT = Math.min(1, state.comboTimer / 30); // 消失前30帧淡出
        ctx.save();
        ctx.globalAlpha = _fadeT;
        ctx.translate(_cx, _cy);
        ctx.scale(_sc, _sc);
        // 背景胶囊
        const _bgW = 74, _bgH = 34;
        ctx.fillStyle = 'rgba(10,8,24,0.72)';
        ctx.beginPath();
        ctx.roundRect(-_bgW, -_bgH / 2, _bgW, _bgH, 8);
        ctx.fill();
        ctx.strokeStyle = state.combo >= 20 ? '#ff9bd0' : (state.combo >= 10 ? '#ffd86a' : '#8df4ff');
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(-_bgW, -_bgH / 2, _bgW, _bgH, 8);
        ctx.stroke();
        // 文字
        ctx.textAlign = 'center';
        const _comboColor = state.combo >= 20 ? '#ff9bd0' : (state.combo >= 10 ? '#ffd86a' : '#8df4ff');
        ctx.font = `bold ${Math.round(18 + Math.min(state.combo, 30) * 0.25)}px Arial`;
        ctx.fillStyle = _comboColor;
        ctx.shadowBlur = 10;
        ctx.shadowColor = _comboColor;
        ctx.fillText('×' + state.combo + ' 连击', -_bgW / 2, 6);
        ctx.shadowBlur = 0;
        // 连击倍率标签
        const _mult = 1 + Math.floor((state.combo - 1) / 8);
        if (_mult >= 2) {
          ctx.font = 'bold 10px Arial';
          ctx.fillStyle = '#ffd86a';
          ctx.fillText(_mult + 'x 倍率', -_bgW / 2, -10);
        }
        ctx.restore();
      }

      // 开场动画特效（冲击波环 / GO! / 闪白）
      drawIntro();

      // 暂停/结束时压暗
      if (!state.active) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
      }
      ctx.restore();
    }

    /* ==================== 固定步长主循环 ==================== */
    function stepGame() {
      if (state.intro.active) { updateIntro(); return; } // 开场动画期间暂停正常逻辑
      handleInput();
      updatePlayer();
      if (state.stage === 1) updateObstacles();
      if (state.stage === 2) {
        updateEnemies();
        updateBoss();
      }
      updatePlayerShots();
      updateEnemyShots();
      updateParticles();
      updateFloatTexts();
      if (state.comboTimer > 0) { state.comboTimer -= 1; if (state.comboTimer === 0) state.combo = 0; }
      if (state.hurtTimer > 0) state.hurtTimer -= 1;
      // 连击计数器弹簧物理（spring k=0.22, damp=0.68）
      state.comboScaleVel += (1 - state.comboScale) * 0.22;
      state.comboScaleVel *= 0.68;
      state.comboScale += state.comboScaleVel;
      updateLandRings();
      updateBackground();
      updateItems();
      if (state.doubleTimer > 0) state.doubleTimer -= 1;
      if (!state.boss) {
        state.itemTimer -= 1;
        if (state.itemTimer <= 0) { spawnItem(); state.itemTimer = 420 + Math.random() * 240; }
      }
      handleCollisions();
      if (!state.active) return; // 碰撞可能已结束游戏

      if (state.stage === 1) {
        if (state.doorSequence) {
          state.doorFlashTimer -= 1;
          if (state.doorFlashTimer <= 0) {
            startStage2();
            state.doorSequence = false;
            state.hintText = '';
          }
        } else {
          if (state.spawnTimer <= 0) {
            spawnObstacle();
            state.spawnTimer = state.spawnInterval;
          }
          state.spawnTimer -= 1 + state.speed * 0.2;
          state.speed = Math.min(state.mode === 'endless' ? 6 : 3.2, state.speed + (state.mode === 'endless' ? 0.0018 : 0.0012));
          speedEl.textContent = state.speed.toFixed(1);
          // 天降坠落物：定期生成，需左右移动躲避
          state.fallTimer -= 1;
          if (state.fallTimer <= 0) {
            spawnFalling();
            state.fallTimer = 150 - Math.min(80, state.speed * 28);
          }
        }
        updateFalling();
      }

      if (state.stage === 2 && !state.boss) {
        if (state.spawnTimer <= 0) {
          spawnEnemy();
          // 中期开始偶尔成对来袭，提升压迫感（开局仍有缓冲）
          if (state.score > 15 && Math.random() < 0.32) spawnEnemy();
          state.spawnTimer = 120 - Math.min(58, state.speed * 15);
        }
        state.spawnTimer -= 1 + state.speed * 0.14;
      }
    }

    let _lastTime = null;
    let _accumulator = 0;
    const FIXED_DT = 1000 / 60;

    function gameLoop(timestamp) {
      if (!state.active) { _lastTime = null; return; }
      if (_lastTime == null) _lastTime = timestamp;
      let frameTime = timestamp - _lastTime;
      _lastTime = timestamp;
      if (frameTime > 100) frameTime = 100; // 防止卡顿后大跳
      _accumulator += frameTime;
      let steps = 0;
      while (_accumulator >= FIXED_DT && steps < 5) {
        stepGame();
        _accumulator -= FIXED_DT;
        steps++;
        if (!state.active) break;
      }
      drawScene();
      if (state.active) requestAnimationFrame(gameLoop);
    }

    function startLoop() {
      _lastTime = null;
      _accumulator = 0;
      requestAnimationFrame(gameLoop);
    }

    /* ===== 暂停 / 恢复 ===== */
    function pauseGame() {
      if (!state.active || state.intro.active) return;
      showMessage('⏸ 已暂停', '继续', 'paused');
    }
    function resumeGame() {
      if (state.messageMode === 'paused') { hideMessage(); startLoop(); }
    }
    // 切后台 / 失焦自动暂停，避免空跑
    window.addEventListener('blur', () => { if (state.active && !state.intro.active) pauseGame(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden && state.active && !state.intro.active) pauseGame(); });

    /* ============================ 事件 ============================ */
    window.addEventListener('keydown', event => {
      const code = event.code;
      // 片头期间任意键仅跳过片头，不直接开始游戏
      if (typeof splashActive !== 'undefined' && splashActive) { endSplash(); event.preventDefault(); return; }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      // 暂停 / 恢复
      if (code === 'Escape' || code === 'KeyP') {
        if (state.active && !state.intro.active) pauseGame();
        else if (!state.active && state.messageMode === 'paused') resumeGame();
        event.preventDefault();
        return;
      }
      if (code === 'Space' || code === 'KeyW') {
        if (state.active && !event.repeat) {
          player.jumpBuffer = player.jumpBufferMax;
          player.jumpHeld = true;
        }
        state.keys.Space = true;
        if (!state.active && state.messageMode !== 'end') {
          enterPlay();
        } else if (!state.active && state.messageMode === 'end') {
          resetGame();
        }
        event.preventDefault();
      }
      if (code === 'KeyJ') {
        state.keys.KeyJ = true;
      }
      if (code in state.keys && code !== 'Space') {
        state.keys[code] = true;
      }
    });

    window.addEventListener('keyup', event => {
      const code = event.code;
      if (code === 'Space' || code === 'KeyW') {
        state.keys.Space = false;
        player.jumpHeld = false;
      }
      if (code === 'KeyJ') {
        if (state.stage === 2 && player.charging && player.shootCooldown <= 0 && state.active) {
          const charged = player.chargeReady;
          const damage = charged ? 3 : 1;
          firePlayerShot(damage, charged);
        }
        player.charging = false;
        player.chargeTime = 0;
        player.chargeReady = false;
        state.keys.KeyJ = false;
      }
      if (code in state.keys && code !== 'Space') {
        state.keys[code] = false;
      }
    });

    restartButton.addEventListener('click', () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (state.messageMode === 'end') {
        resetGame();
      } else {
        enterPlay();
      }
    });

    // 暂停按钮（点击暂停 / 恢复）
    const pauseBtn = document.getElementById('pauseBtn');
    if (pauseBtn) {
      pauseBtn.addEventListener('click', () => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (state.active && !state.intro.active) pauseGame();
        else if (!state.active && state.messageMode === 'paused') resumeGame();
      });
    }

    // 设置面板
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsPanel = document.getElementById('settingsPanel');
    const volSlider = document.getElementById('volSlider');
    const shakeToggle = document.getElementById('shakeToggle');
    const flashToggle = document.getElementById('flashToggle');
    const closeSettings = document.getElementById('closeSettings');
    function syncSettingsUI() {
      if (volSlider) volSlider.value = settings.volume;
      if (shakeToggle) { shakeToggle.textContent = settings.shake ? '开' : '关'; shakeToggle.classList.toggle('off', !settings.shake); }
      if (flashToggle) { flashToggle.textContent = settings.flash ? '开' : '关'; flashToggle.classList.toggle('off', !settings.flash); }
      renderSkinPicker();
      const achEl = document.getElementById('achCount');
      if (achEl) achEl.textContent = getAchList().length + ' / ' + ACHIEVEMENTS.length;
    }
    if (settingsBtn) settingsBtn.addEventListener('click', () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (state.active && !state.intro.active) pauseGame(); // 打开设置时自动暂停
      syncSettingsUI();
      if (settingsPanel) settingsPanel.classList.add('show');
    });
    if (closeSettings) closeSettings.addEventListener('click', () => {
      settingsPanel.classList.remove('show');
      // 若打开设置时曾自动暂停，则关闭设置后自动恢复游戏，避免卡在“已暂停”界面
      if (state.messageMode === 'paused') resumeGame();
    });
    if (volSlider) volSlider.addEventListener('input', () => {
      settings.volume = Number(volSlider.value);
      localStorage.setItem('jd_volume', settings.volume);
      applySettings();
    });
    if (shakeToggle) shakeToggle.addEventListener('click', () => {
      settings.shake = !settings.shake;
      localStorage.setItem('jd_shake', settings.shake ? '1' : '0');
      syncSettingsUI();
    });
    if (flashToggle) flashToggle.addEventListener('click', () => {
      settings.flash = !settings.flash;
      localStorage.setItem('jd_flash', settings.flash ? '1' : '0');
      syncSettingsUI();
    });
    syncSettingsUI();

    /* ===================================================================
       触摸控制映射（手机）— 全面重写
       方案：
         左半屏  → 随落点浮动摇杆（X:左右移动，Y:上推跳/下推蹲）
         右半屏  → 三分区全屏触控（上区跳、中区射、下区蹲）
         多点并发：摇杆 + 右侧可同时按下，互不干扰
    =================================================================== */
    function pressKey(code) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (code === 'Space') {
        if (state.active) { player.jumpBuffer = player.jumpBufferMax; player.jumpHeld = true; }
        state.keys.Space = true;
        if (!state.active && state.messageMode !== 'end') { enterPlay(); }
        else if (!state.active && state.messageMode === 'end') { resetGame(); }
      } else if (code === 'KeyJ') {
        state.keys.KeyJ = true;
      } else if (code in state.keys) {
        state.keys[code] = true;
      }
    }
    function releaseKey(code) {
      if (code === 'Space') {
        state.keys.Space = false;
        player.jumpHeld = false;
      } else if (code === 'KeyJ') {
        if (state.stage === 2 && player.charging && player.shootCooldown <= 0 && state.active) {
          const charged = player.chargeReady;
          firePlayerShot(charged ? 3 : 1, charged);
        }
        player.charging = false; player.chargeTime = 0; player.chargeReady = false;
        state.keys.KeyJ = false;
      } else if (code in state.keys) {
        state.keys[code] = false;
      }
    }

    // ── DOM 元素引用 ──
    const joystick = document.getElementById('joystick');
    const jknob    = joystick ? joystick.querySelector('.jknob') : null;
    const touchOverlay   = document.getElementById('touchOverlay');
    const touchHintCvs   = document.getElementById('touchHintCanvas');
    const touchCtrlDiv   = document.getElementById('touchControls');

    // ── 摇杆参数 ──
    const JOY_RANGE  = 48;   // 最大偏移像素
    const JOY_DEAD_X = 10;   // X 轴死区
    const JOY_DEAD_Y = 14;   // Y 轴死区（需要更明显的意图才触发跳/蹲）
    const JOY_BASE_R = 65;   // 底座半径（px，CSS 130px/2）

    // ── 状态变量 ──
    let joyId   = null;     // 摇杆触点 identifier
    let joyOriX = 0;        // 摇杆底座中心 clientX（落点时确定）
    let joyOriY = 0;        // 摇杆底座中心 clientY
    let rightIds = new Map(); // rightId → zone ('jump'|'shoot'|'crouch')
    let activeRightCodes = new Set(); // 当前激活的右侧 action codes

    // ── 右侧三分区边界（运行时计算，避免硬编码像素） ──
    function getRightZones() {
      const rect = canvas.getBoundingClientRect();
      const h = rect.height, top = rect.top;
      return {
        top: top,
        jumpBottom:   top + h * 0.38,  // 上 38% → 跳
        shootBottom:  top + h * 0.66,  // 中 28% → 射
        crouchBottom: top + h,          // 下 34% → 蹲
      };
    }

    function getZoneCode(clientY) {
      const z = getRightZones();
      if (clientY < z.jumpBottom)   return 'Space';
      if (clientY < z.shootBottom)  return 'KeyJ';
      return 'KeyS';
    }

    // ── 摇杆 knob 视觉更新（不用 transition，直接设置避免延迟） ──
    function setKnob(dx, dy) {
      if (jknob) jknob.style.transform = `translate(${dx}px, ${dy}px)`;
    }

    // ── 摇杆位置（随落点移动底座） ──
    function moveJoystickBase(cx, cy) {
      if (!joystick) return;
      // cont：可交互区域（touchOverlay 或 canvas），用于限制摇杆范围
      const cont  = canvas.getBoundingClientRect();
      // parent：joystick 实际父元素 gameContainer，用于计算 absolute 定位
      const parentRect = (document.getElementById('gameContainer') || cont).getBoundingClientRect();
      const clamX = Math.max(cont.left + JOY_BASE_R + 4, Math.min(cx, cont.left + cont.width * 0.5 - 4));
      const clamY = Math.max(cont.top  + JOY_BASE_R + 4, Math.min(cy, cont.bottom - JOY_BASE_R - 4));
      // joystick 用 transform:translate(-50%,-50%) 以中心点定位，left/top 指向中心
      joystick.style.left = (clamX - parentRect.left) + 'px';
      joystick.style.top  = (clamY - parentRect.top)  + 'px';
      joyOriX = clamX;
      joyOriY = clamY;
    }

    // ── 绘制右侧分区提示（半透明线条，绘制一次即可） ──
    function drawTouchHint() {
      if (!touchHintCvs) return;
      // 以 canvas（实际游戏画面）为基准，保证提示线与触控分区完全一致
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      touchHintCvs.width  = Math.round(rect.width  * dpr);
      touchHintCvs.height = Math.round(rect.height * dpr);
      touchHintCvs.style.width  = rect.width  + 'px';
      touchHintCvs.style.height = rect.height + 'px';
      const c = touchHintCvs.getContext('2d');
      // 用 CSS 尺寸（逻辑像素）作为绘图坐标空间，DPR 由 scale 处理
      const w = rect.width, h = rect.height;
      c.setTransform(dpr, 0, 0, dpr, 0, 0);   // 等同于 c.scale(dpr, dpr)，但更安全
      c.clearRect(0, 0, w, h);
      const lx = w * 0.5;  // 左右分界线

      // 左右分界虚线
      c.setLineDash([6, 8]);
      c.strokeStyle = 'rgba(120,220,255,0.18)';
      c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(lx, 0); c.lineTo(lx, h); c.stroke();

      // 右侧分区横线
      const y1 = h * 0.38, y2 = h * 0.66;
      c.setLineDash([4, 10]);
      c.strokeStyle = 'rgba(120,220,255,0.14)';
      c.beginPath(); c.moveTo(lx, y1); c.lineTo(w, y1); c.stroke();
      c.beginPath(); c.moveTo(lx, y2); c.lineTo(w, y2); c.stroke();

      // 右侧区域标签文字
      c.setLineDash([]);
      c.font = 'bold 20px sans-serif';
      c.textAlign = 'right';
      c.fillStyle = 'rgba(160,240,255,0.28)';
      c.fillText('▲ 跳', w - 14, y1 * 0.52);
      c.fillText('✦ 射', w - 14, (y1 + y2) / 2 + 8);
      c.fillText('▼ 蹲', w - 14, (y2 + h) / 2 + 8);

      // 左侧摇杆提示圆圈（淡淡的）
      c.strokeStyle = 'rgba(120,220,255,0.12)';
      c.lineWidth = 1.5;
      c.setLineDash([]);
      c.beginPath();
      c.arc(lx * 0.5, h * 0.72, JOY_BASE_R, 0, Math.PI * 2);
      c.stroke();
      c.font = '13px sans-serif';
      c.textAlign = 'center';
      c.fillStyle = 'rgba(160,240,255,0.2)';
      c.fillText('移动', lx * 0.5, h * 0.72 + JOY_BASE_R + 18);
    }

    // ── 核心触控处理 ──
    // activeTouches : 当前屏上所有触点（e.touches，用于 move）
    // changedTouches: 本次事件变化的触点（e.changedTouches，touchend 时用来检测离开）
    // eventType     : 'start' | 'move' | 'end' | 'cancel'
    function processTouches(activeTouches, changedTouches, eventType) {
      const contRect = canvas.getBoundingClientRect();
      const midX = contRect.left + contRect.width * 0.5;

      // ── 1. 处理 touchend / touchcancel：先清理离开的触点 ──
      if (eventType === 'end' || eventType === 'cancel') {
        for (const t of changedTouches) {
          // 摇杆触点离开
          if (t.identifier === joyId) {
            joyId = null;
            state.keys.KeyA = false; state.keys.KeyD = false;
            state.keys.KeyS = false;
            state.keys.Space = false; player.jumpHeld = false;
            setKnob(0, 0);
            if (joystick) {
              joystick.style.opacity = '0';
              setTimeout(() => { if (joyId === null) joystick.style.display = 'none'; }, 150);
            }
          }
          // 右侧触点离开
          if (rightIds.has(t.identifier)) {
            const code = rightIds.get(t.identifier);
            rightIds.delete(t.identifier);
            // 只有没有其他触点持有同一 code 时才释放
            const stillHeld = [...rightIds.values()].some(v => v === code);
            if (!stillHeld) { releaseKey(code); activeRightCodes.delete(code); }
          }
        }
        return;  // end/cancel 不再处理移动逻辑
      }

      // ── 2. touchstart / touchmove：处理活跃触点 ──
      for (const t of activeTouches) {
        const isLeft  = t.clientX < midX;
        const isRight = !isLeft;

        // ── 摇杆触点（已绑定）─ 更新偏移 ──
        if (t.identifier === joyId) {
          let dx = t.clientX - joyOriX;
          let dy = t.clientY - joyOriY;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist > JOY_RANGE) { dx *= JOY_RANGE/dist; dy *= JOY_RANGE/dist; }
          setKnob(dx, dy);
          state.keys.KeyA = dx < -JOY_DEAD_X;
          state.keys.KeyD = dx >  JOY_DEAD_X;
          // Y 轴：上推跳，下推蹲（仅当垂直意图明显时，避免斜向误触）
          const absX = Math.abs(dx), absY = Math.abs(dy);
          if (absY > JOY_DEAD_Y && absY > absX * 0.7) {
            if (dy < 0) {
              // 上推 → 跳
              if (!state.keys.Space) { pressKey('Space'); }
              else { player.jumpHeld = true; }
            } else {
              // 下推 → 蹲，同时确保不在跳跃状态
              state.keys.KeyS = true;
              if (state.keys.Space) { state.keys.Space = false; player.jumpHeld = false; }
            }
          } else {
            // Y 在死区：释放摇杆产生的跳/蹲（仅释放由摇杆管理的；右侧触点的 Space 不影响）
            if (state.keys.Space && !activeRightCodes.has('Space')) {
              state.keys.Space = false; player.jumpHeld = false;
            }
            if (state.keys.KeyS && !activeRightCodes.has('KeyS')) {
              state.keys.KeyS = false;
            }
          }
          continue;
        }

        // ── 右侧已绑定触点 → 检测跨区滑动 ──
        if (isRight && rightIds.has(t.identifier)) {
          const oldCode = rightIds.get(t.identifier);
          const newCode = getZoneCode(t.clientY);
          if (newCode !== oldCode) {
            rightIds.set(t.identifier, newCode);
            // 释放旧 code（如无其他触点持有）
            const oldStillHeld = [...rightIds.values()].some(v => v === oldCode);
            if (!oldStillHeld) { releaseKey(oldCode); activeRightCodes.delete(oldCode); }
            // 激活新 code
            if (!activeRightCodes.has(newCode)) { pressKey(newCode); activeRightCodes.add(newCode); }
          }
          continue;
        }

        // ── 右侧新触点 → 绑定 zone ──
        if (isRight && !rightIds.has(t.identifier)) {
          const code = getZoneCode(t.clientY);
          rightIds.set(t.identifier, code);
          if (!activeRightCodes.has(code)) { pressKey(code); activeRightCodes.add(code); }
          continue;
        }

        // ── 左侧新触点 → 创建摇杆（如当前无摇杆触点） ──
        // 排除已绑定为右侧按键的触点：防止右侧手指滑到左半屏时被误建成摇杆
        if (isLeft && joyId === null && !rightIds.has(t.identifier)) {
          joyId = t.identifier;
          moveJoystickBase(t.clientX, t.clientY);
          if (joystick) { joystick.style.display = 'block'; joystick.style.opacity = '1'; }
          setKnob(0, 0);
          continue;
        }
      }

      // ── 3. jumpHeld 持续维护（只要 Space 处于激活状态就保持） ──
      if (activeRightCodes.has('Space') || (joyId !== null && state.keys.Space)) {
        player.jumpHeld = true;
      }
    }

    // ── 事件监听 ──
    function onTouch(e) {
      e.preventDefault();
      const isEnd = e.type === 'touchend' || e.type === 'touchcancel';
      const type  = isEnd ? (e.type === 'touchcancel' ? 'cancel' : 'end') : (e.type === 'touchstart' ? 'start' : 'move');
      // end/cancel 时用 changedTouches 检测离开的触点，其余情况用 e.touches
      processTouches(e.touches, e.changedTouches, type);
    }
    if (touchOverlay) {
      touchOverlay.addEventListener('touchstart',  onTouch, { passive: false });
      touchOverlay.addEventListener('touchmove',   onTouch, { passive: false });
      touchOverlay.addEventListener('touchend',    onTouch, { passive: false });
      touchOverlay.addEventListener('touchcancel', onTouch, { passive: false });
    }
    // 兜底：游戏画布上的触控也捕获（防止 overlay 未覆盖）
    canvas.addEventListener('touchstart',  onTouch, { passive: false });
    canvas.addEventListener('touchmove',   onTouch, { passive: false });
    canvas.addEventListener('touchend',    onTouch, { passive: false });
    canvas.addEventListener('touchcancel', onTouch, { passive: false });

    function isMobileLike() {
      return ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    }
    function checkOrientation() {
      const portrait = window.innerHeight > window.innerWidth;
      const hint = document.getElementById('rotateHint');
      if (hint) hint.style.display = (isMobileLike() && portrait) ? 'flex' : 'none';
    }
    window.addEventListener('resize', () => { checkOrientation(); if (isMobileLike()) drawTouchHint(); });
    window.addEventListener('orientationchange', () => { checkOrientation(); setTimeout(drawTouchHint, 300); });

    if (isMobileLike()) {
      // 精确对齐触控层至 canvas 的实际位置与尺寸（相对 gameContainer）
      // 不再用 left:0/right:0/bottom:0 全屏，避免横屏 flex 居中时与 canvas 错位
      function alignOverlay() {
        const cont = document.getElementById('gameContainer');
        if (!canvas || !cont) return;
        const c = canvas.getBoundingClientRect();
        const p = cont.getBoundingClientRect();
        const left = (c.left - p.left) + 'px';
        const top  = (c.top  - p.top)  + 'px';
        const w = c.width  + 'px';
        const h = c.height + 'px';
        [touchOverlay, touchHintCvs, touchCtrlDiv].forEach(el => {
          if (!el) return;
          el.style.left = left;
          el.style.top = top;
          el.style.width = w;
          el.style.height = h;
          el.style.right = 'auto';
          el.style.bottom = 'auto';
        });
      }
      // 显示触控层和提示
      if (touchOverlay)  touchOverlay.style.display  = 'block';
      if (touchHintCvs)  touchHintCvs.style.display  = 'block';
      if (touchCtrlDiv)  touchCtrlDiv.style.display   = 'block';
      // 摇杆初始隐藏，按下左半屏时才浮现
      if (joystick) { joystick.style.display = 'none'; joystick.style.opacity = '0'; }
      // 多次对齐，确保布局稳定后触控层精确覆盖 canvas（应对字体/转屏导致的迟到布局）
      const _realign = () => { alignOverlay(); drawTouchHint(); };
      _realign();
      setTimeout(_realign, 60);
      setTimeout(_realign, 300);
      setTimeout(_realign, 800);
      window.addEventListener('load', _realign);
      window.addEventListener('resize', _realign);
      window.addEventListener('orientationchange', () => { setTimeout(_realign, 350); });
    }
    checkOrientation();

    // ===== 开场片头「景星出品」→ 流畅浮现开始界面 =====
    let splashActive = true;
    const splash = document.getElementById('splash');
    function endSplash() {
      if (!splashActive) return;
      splashActive = false;
      if (splash) {
        splash.classList.add('done');
        setTimeout(() => { splash.style.display = 'none'; }, 500);
      }
      // 片头结束，开始界面渐渐浮现
      message.classList.add('show');
    }
    if (splash) {
      splash.addEventListener('click', endSplash);
      splash.addEventListener('touchstart', e => { e.preventDefault(); endSplash(); }, { passive: false });
      setTimeout(endSplash, 2300); // 片头播完自动进入开始界面
    }

    // 模式选择（剧情 / 无尽）
    const btnStory = document.getElementById('btnStory');
    const btnEndless = document.getElementById('btnEndless');
    function startMode(m) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      state.mode = m;
      state.obstaclesToPass = (m === 'endless') ? Infinity : 55;
      const pg = document.getElementById('progress'); if (pg) pg.style.display = (m === 'endless') ? 'none' : 'block';
      enterPlay();
    }
    if (btnStory) btnStory.addEventListener('click', () => startMode('story'));
    if (btnEndless) btnEndless.addEventListener('click', () => startMode('endless'));

    initBackground();
    resetGame();
    renderSkinPicker();

    // 【临时诊断面板】显示 canvas 实际尺寸/位置/状态，定位手机端黑屏问题（确认后移除）
    (function () {
      const p = document.createElement('div');
      p.id = '__diag';
      p.style.cssText = 'position:fixed;top:0;left:0;z-index:99998;background:rgba(0,20,0,0.82);color:#4f4;font:10px/1.35 monospace;padding:4px 6px;white-space:pre;pointer-events:none;border:1px solid #0a0;';
      document.body.appendChild(p);
      let frames = 0, lastDraw = 0;
      const _origDraw = typeof drawScene === 'function' ? drawScene : null;
      window.__drawCount = 0;
      setInterval(function () {
        try {
          const r = canvas.getBoundingClientRect();
          const cont = document.getElementById('gameContainer').getBoundingClientRect();
          const mob = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
          // 读取 canvas 中心像素，判定缓冲区是否真的画了内容
          let cpix = '?';
          try {
            const id = ctx.getImageData(canvas.width >> 1, canvas.height >> 1, 1, 1).data;
            cpix = id[0] + ',' + id[1] + ',' + id[2] + ',' + id[3];
          } catch (e) { cpix = 'ERR:' + (e.message || e.name); }
          // 读取 canvas 上层是否被遮挡：取 canvas 中心屏幕坐标处最顶层元素
          let topEl = '?';
          try {
            const el = document.elementFromPoint(Math.round(r.left + r.width / 2), Math.round(r.top + r.height / 2));
            topEl = el ? (el.id || el.tagName) : 'null';
          } catch (e) { topEl = 'ERR'; }
          p.textContent =
            'win ' + window.innerWidth + 'x' + window.innerHeight + ' dpr' + window.devicePixelRatio + '\n' +
            'cont ' + Math.round(cont.width) + 'x' + Math.round(cont.height) + '\n' +
            'cvsBuf ' + canvas.width + 'x' + canvas.height + '\n' +
            'cvsShow ' + Math.round(r.width) + 'x' + Math.round(r.height) + ' @' + Math.round(r.left) + ',' + Math.round(r.top) + '\n' +
            'active=' + state.active + ' intro=' + state.intro.active + ' stg' + state.stage + ' mode=' + state.messageMode + '\n' +
            'draws=' + window.__drawCount + ' mob=' + mob + ' px=' + Math.round(player.x) + ',' + Math.round(player.y) + '\n' +
            'cvsPix ' + cpix + '  top=' + topEl;
        } catch (e) { p.textContent = 'diag err: ' + e.message; }
      }, 400);
    })();
  </script>
</body>
</html>
