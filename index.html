<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>跳跃躲避障碍物</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at top, #2f2f5f, #09090f 68%);
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #gameContainer {
      position: relative;
      width: 900px;
      max-width: 100%;
      background: #12131b;
      border: 3px solid #4d5b7a;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 2 / 1; /* 固定显示比例，避免 HiDPI 设置时首帧高度跳动 */
      background: linear-gradient(180deg, #12131b, #050609);
      image-rendering: auto;
    }

    #hud {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 14px;
      gap: 8px;
      flex-wrap: wrap;
      background: linear-gradient(180deg, rgba(14,18,34,0.98), rgba(14,18,34,0.82));
      border-bottom: 1px solid rgba(126,240,255,0.18);
    }
    #hud .stat {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      font-size: 14px;
      white-space: nowrap;
      color: #c9d6f5;
      background: rgba(34,46,80,0.55);
      border: 1px solid rgba(126,240,255,0.22);
      border-radius: 20px;
      box-shadow: inset 0 0 10px rgba(80,160,255,0.08);
    }
    #hud .stat .ic { font-size: 15px; filter: drop-shadow(0 0 4px rgba(120,240,255,0.5)); }
    #hud .stat span {
      color: #7fe9ff;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(120,240,255,0.55);
    }
    #hud #shield.on { color: #6dffb0; text-shadow: 0 0 8px rgba(109,255,176,0.6); }
    #hud #shield.off { color: #7a869e; text-shadow: none; }

    /* 第一关进度条（满分 55） */
    #progress {
      position: relative;
      height: 16px;
      background: rgba(18,26,48,0.92);
      border-bottom: 1px solid rgba(126,240,255,0.15);
      overflow: hidden;
    }
    #progressFill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2478b8, #8df4ff);
      box-shadow: 0 0 12px rgba(120,240,255,0.6);
      transition: width 0.25s ease;
    }
    #progress span {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #eafaff;
      letter-spacing: 0.12em;
      text-shadow: 0 0 4px rgba(0,0,0,0.8);
    }

    /* 开场片头：景星出品（全屏固定，覆盖加载过程，避免抖动） */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #2f2f5f, #09090f 68%);
    }
    #splash .brand {
      color: #eafaff;
      font-size: 44px;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-indent: 0.3em; /* 补偿字距，视觉居中 */
      text-shadow: 0 0 20px rgba(120,240,255,0.7), 0 0 44px rgba(120,240,255,0.32);
      opacity: 0;
      transform: translateY(12px);
      animation: brandIn 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) 0.25s forwards;
    }
    #splash .line {
      width: 0;
      height: 2px;
      margin-top: 18px;
      background: linear-gradient(90deg, transparent, #8df4ff, transparent);
      opacity: 0;
      animation: lineIn 1.0s ease 0.55s forwards;
    }
    #splash.done { opacity: 0; visibility: hidden; transition: opacity 0.5s ease; }
    @keyframes brandIn {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes lineIn {
      to { opacity: 0.9; width: 230px; }
    }

    #message {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: rgba(6, 10, 22, 0.9);
      color: #fff;
      font-size: 24px;
      text-align: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      /* z-index 需高于 touchOverlay(14)/joystick(16)/touchControls(15)，
         否则手机端触控层会盖住开始/结算界面按钮，导致无法点击模式选择/继续。
         低于 settingsBtn(22) 与 settingsPanel(30)，保证设置始终可用。 */
      z-index: 20;
    }
    #message.show { opacity: 1; pointer-events: auto; }

    #message button {
      margin-top: 18px;
      padding: 12px 24px;
      border: none;
      background: linear-gradient(135deg, #2fa8ff, #1f6cff);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      border-radius: 10px;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 6px 18px rgba(31, 140, 255, 0.35);
    }

    #message button:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 10px 26px rgba(31, 140, 255, 0.5);
    }
    #modeSelect { display: none; }
    #modeSelect.show { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
    #modeSelect button { margin-top: 0; }

    #pauseBtn {
      position: absolute; top: 8px; right: 10px; z-index: 22;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(126,240,255,0.4);
      background: rgba(20,30,60,0.55);
      color: #cdefff; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    #pauseBtn:active { transform: scale(0.92); }

    #settingsBtn {
      position: absolute; top: 8px; right: 56px; z-index: 22;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(126,240,255,0.4);
      background: rgba(20,30,60,0.55); color: #cdefff;
      font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    #settingsBtn:active { transform: scale(0.92); }
    #settingsPanel {
      display: none;
      position: absolute; inset: 0; z-index: 30;
      background: rgba(2,4,12,0.92);
      flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; color: #eafaff; padding: 24px;
    }
    #settingsPanel.show { display: flex; }
    #settingsPanel .sTitle { font-size: 24px; font-weight: bold; margin-bottom: 6px; letter-spacing: 0.12em; }
    #settingsPanel .sRow { display: flex; align-items: center; justify-content: space-between; width: 240px; max-width: 82%; font-size: 16px; }
    #settingsPanel input[type=range] { width: 130px; }
    #settingsPanel .stog {
      min-width: 54px; padding: 6px 14px; border-radius: 16px; cursor: pointer;
      border: 1px solid rgba(126,240,255,0.5); background: rgba(30,60,45,0.5); color: #7dffb0; font-size: 14px;
    }
    #settingsPanel .stog.off { background: rgba(60,30,40,0.5); color: #ff9bae; border-color: rgba(255,120,150,0.4); }
    #settingsPanel #closeSettings {
      margin-top: 8px; padding: 10px 26px; border: none; border-radius: 10px;
      background: linear-gradient(135deg,#2fa8ff,#1f6cff); color:#fff; font-size:16px; cursor:pointer;
    }

    #instructions {
      margin-top: 16px;
      font-size: 14px;
      color: #b8c0e0;
      line-height: 1.6;
      max-width: 620px;
    }

    /* ===== 移动端触摸控制 ===== */
    html, body { overscroll-behavior: none; }
    canvas { touch-action: none; }

    /* ── 全屏透明触控层（仅覆盖 canvas 区域，不遮挡 HUD 按钮） ── */
    #touchOverlay {
      display: none;
      position: absolute;
      left: 0; right: 0; bottom: 0;
      /* top 由 JS 动态设置为 HUD 高度，CSS 兜底值 */
      top: 44px;
      z-index: 14;
      pointer-events: auto;
      touch-action: none;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 右侧三分区提示 canvas（与 touchOverlay 对齐） */
    #touchHintCanvas {
      display: none;
      position: absolute;
      left: 0; right: 0; bottom: 0;
      top: 44px;
      z-index: 13;
      pointer-events: none;
      opacity: 1;
    }

    /* 随落点摇杆 */
    #joystick {
      display: none;
      position: absolute;   /* 随手指落点定位，不再 fixed */
      width: 130px; height: 130px;
      z-index: 16;
      pointer-events: none;
      transform: translate(-50%, -50%);  /* 以中心定位 */
      transition: opacity 0.15s;
    }
    #joystick .jbase {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(126,240,255,0.5);
      background: rgba(20,30,60,0.38);
      box-shadow: 0 0 24px rgba(120,240,255,0.22) inset;
    }
    #joystick .jknob {
      position: absolute;
      left: 50%; top: 50%;
      width: 58px; height: 58px;
      margin: -29px 0 0 -29px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(160,240,255,0.9), rgba(60,180,255,0.6));
      box-shadow: 0 0 20px rgba(120,240,255,0.7), 0 2px 6px rgba(0,0,0,0.4);
      /* 不使用 CSS transition，由 JS 直接设置以避免延迟 */
    }

    /* 右侧区域标签（触控提示） */
    #touchControls {
      display: none;
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
    }
    /* 右侧区域三个标签文字 */
    .tzone-label {
      position: absolute;
      right: 18px;
      color: rgba(200,240,255,0.5);
      font-size: 13px;
      font-family: sans-serif;
      letter-spacing: 0.04em;
      pointer-events: none;
      user-select: none;
    }
    .tzone-label.jump-lbl  { bottom: 62%; }
    .tzone-label.shoot-lbl { bottom: 43%; }
    .tzone-label.crouch-lbl{ bottom: 24%; }

    /* 竖屏建议横屏 */
    #rotateHint {
      display: none;
      position: fixed; inset: 0;
      background: #0a0c16;
      color: #cdefff;
      z-index: 50;
      flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 30px;
      font-size: 18px; line-height: 1.9;
    }
    #rotateHint .icon { font-size: 64px; margin-bottom: 16px; animation: roticon 2s ease-in-out infinite; }
    @keyframes roticon { 0%,100% { transform: rotate(0); } 50% { transform: rotate(90deg); } }

    @media (max-width: 820px) {
      body { align-items: flex-start; }
      #gameContainer { border-width: 0; border-radius: 0; width: 100%; }
      #hud div { font-size: 13px; }
      #instructions { font-size: 12px; }
    }

    /* 横屏手机：整体适配视口，画面完整显示（等比 contain，不溢出） */
    @media (orientation: landscape) and (max-height: 520px) {
      html, body { height: 100%; overflow: hidden; }
      body { align-items: center; }
      #gameContainer {
        width: 100vw; height: 100vh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        border: 0; border-radius: 0;
      }
      #hud { width: 100%; flex: 0 0 auto; padding: 6px 12px; }
      #hud div { font-size: 12px; }
      canvas {
        flex: 0 1 auto;
        min-height: 0;
        width: auto; height: auto;
        max-width: 100vw;
        max-height: calc(100vh - 40px);
        aspect-ratio: 2 / 1;
      }
    }
  </style>
</head>
<body>
  <div id="splash"><div class="brand">景星出品</div><div class="line"></div></div>
  <div id="gameContainer">
    <div id="hud">
      <div class="stat"><span class="ic">🗺️</span>关卡 <span id="stage">1</span></div>
      <div class="stat"><span class="ic">⭐</span>得分 <span id="score">0</span></div>
      <div class="stat"><span class="ic">🏆</span>最高 <span id="bestScore">0</span></div>
      <div class="stat"><span class="ic">🛡️</span><span id="shield" class="on">有</span></div>
      <div class="stat"><span class="ic">⚡</span><span id="speed">1.0</span></div>
    </div>
    <div id="progress"><div id="progressFill"></div><span id="progressText">0 / 55</span></div>
    <canvas id="gameCanvas" width="900" height="450"></canvas>
    <button id="pauseBtn" aria-label="暂停">⏸</button>
    <button id="settingsBtn" aria-label="设置">⚙</button>
    <div id="settingsPanel">
      <div class="sTitle">设置</div>
      <label class="sRow"><span>音量</span><input id="volSlider" type="range" min="0" max="100" value="50"></label>
      <div class="sRow"><span>屏幕震动</span><button id="shakeToggle" class="stog">开</button></div>
      <div class="sRow"><span>画面闪光</span><button id="flashToggle" class="stog">开</button></div>
      <div class="sRow"><span>皮肤</span><div id="skinPicker" style="display:flex;flex-wrap:wrap;justify-content:flex-end;max-width:150px;"></div></div>
      <div class="sRow"><span>成就</span><span id="achCount" style="color:#ffd86a;font-weight:bold;">0 / 5</span></div>
      <button id="closeSettings">关闭</button>
    </div>
    <div id="message">
      <div id="messageText">按空格开始游戏</div>
      <button id="restartButton">继续</button>
      <div id="modeSelect">
        <button id="btnStory">🎮 剧情模式</button>
        <button id="btnEndless">♾️ 无尽模式</button>
      </div>
      <div id="instructions">
        电脑：A/D 移动，W/空格 跳跃，S 下蹲，J 蓄力射击（第二关）。<br>手机：使用屏幕左下移动、右下跳跃/下蹲/射击。
      </div>
    </div>
    <!-- 触控提示层（Canvas 绘制右侧分区轮廓） -->
    <canvas id="touchHintCanvas"></canvas>
    <!-- 全屏透明触控捕获层 -->
    <div id="touchOverlay"></div>
    <!-- 区域激活高亮（CSS class 切换） -->
    <div id="touchControls">
      <span class="tzone-label jump-lbl" id="lblJump">▲ 跳</span>
      <span class="tzone-label shoot-lbl" id="lblShoot">✦ 射</span>
      <span class="tzone-label crouch-lbl" id="lblCrouch">▼ 蹲</span>
    </div>
    <!-- 随落点浮动摇杆 -->
    <div id="joystick"><div class="jbase"></div><div class="jknob"></div></div>
  </div>

  <div id="rotateHint">
    <div class="icon">📱</div>
    <div>请将手机横屏<br>以获得最佳游戏体验</div>
  </div>

  <script>
    // 【临时诊断】把运行时错误显示到屏幕底部，便于在手机上定位问题（确认后可移除）
    window.addEventListener('error', function (e) {
      var d = document.getElementById('__errbar');
      if (!d) {
        d = document.createElement('div');
        d.id = '__errbar';
        d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:rgba(190,0,0,0.92);color:#fff;font:12px/1.4 monospace;padding:6px 8px;word-break:break-all;white-space:pre-wrap;';
        document.body.appendChild(d);
      }
      d.textContent = 'JS错误: ' + (e.message || '') + '\n@ ' + ((e.filename || '').split('/').pop()) + ':' + e.lineno + ':' + e.colno;
    });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const speedEl = document.getElementById('speed');
    const message = document.getElementById('message');
    const messageText = document.getElementById('messageText');
    const restartButton = document.getElementById('restartButton');

    const canvasWidth = canvas.width;
    const canvasHeight = canvas.height;
    const groundHeight = 90;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // HiDPI：按屏幕像素密度提升画布实际分辨率，避免高分屏下发虚发糊
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = canvasWidth * dpr;
    canvas.height = canvasHeight * dpr;
    ctx.scale(dpr, dpr);
    ctx.imageSmoothingEnabled = true;

    // 显式管理 canvas 显示尺寸（2:1 等比，contain 适配容器）
    // 不依赖 CSS aspect-ratio —— 部分手机浏览器不支持会导致画面塌缩/溢出变黑
    function fitCanvasDisplay() {
      const cont = document.getElementById('gameContainer');
      if (!cont) return;
      const availW = cont.clientWidth || window.innerWidth;
      const hud = document.getElementById('hud');
      const prog = document.getElementById('progress');
      const usedH = (hud ? hud.offsetHeight : 40) + (prog && prog.offsetHeight ? prog.offsetHeight : 0);
      const availH = Math.max(120, window.innerHeight - usedH - 4);
      // 目标 2:1，优先按宽度铺满；若高度超出可用区则按高度反算，保证完整可见（contain）
      let w = availW, h = w / 2;
      if (h > availH) { h = availH; w = h * 2; }
      canvas.style.width  = Math.round(w) + 'px';
      canvas.style.height = Math.round(h) + 'px';
      canvas.style.maxWidth = 'none';
      canvas.style.aspectRatio = 'auto';
    }
    fitCanvasDisplay();
    window.addEventListener('load', fitCanvasDisplay);
    window.addEventListener('resize', fitCanvasDisplay);
    window.addEventListener('orientationchange', () => setTimeout(fitCanvasDisplay, 150));

    // roundRect polyfill：旧移动浏览器（旧 Safari / WebView）不支持，缺失会导致 drawScene 抛错黑屏
    if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        let tl, tr, br, bl;
        if (typeof r === 'number') { tl = tr = br = bl = r; }
        else if (Array.isArray(r)) {
          if (r.length === 1) tl = tr = br = bl = r[0];
          else if (r.length === 2) { tl = br = r[0]; tr = bl = r[1]; }
          else { tl = r[0]; tr = r[1]; br = r[2]; bl = r[3]; }
        } else { tl = tr = br = bl = 0; }
        const m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        tl = Math.min(tl, m); tr = Math.min(tr, m); br = Math.min(br, m); bl = Math.min(bl, m);
        this.beginPath();
        this.moveTo(x + tl, y);
        this.lineTo(x + w - tr, y); this.arcTo(x + w, y, x + w, y + tr, tr);
        this.lineTo(x + w, y + h - br); this.arcTo(x + w, y + h, x + w - br, y + h, br);
        this.lineTo(x + bl, y + h); this.arcTo(x, y + h, x, y + h - bl, bl);
        this.lineTo(x, y + tl); this.arcTo(x, y, x + tl, y, tl);
        this.closePath();
        return this;
      };
    }

    const player = {
      x: 120,
      y: canvasHeight - groundHeight - 66,
      width: 44,
      height: 64,
      dy: 0,
      vx: 0,
      maxVx: 6.6,
      accel: 0.95,
      airAccel: 0.55,
      friction: 0.80,
      airFriction: 0.94,
      jumpPower: 16.5,
      gravity: 0.78,
      fallGravity: 1.15,
      lowJumpGravity: 1.7,
      jumpCount: 0,
      maxJumps: 1,
      crouching: false,
      shield: true,
      invuln: 0,
      direction: 'right',
      shootCooldown: 0,
      charging: false,
      chargeTime: 0,
      chargeReady: false,
      // 手感相关
      onGround: true,
      coyoteTimer: 0,
      coyoteMax: 8,
      jumpBuffer: 0,
      jumpBufferMax: 8,
      jumpHeld: false,
      // 表现相关
      squash: 1,
      stretch: 1,
      runPhase: 0,
      trail: [],
    };

    // Ensure initial y is aligned to player.height to avoid sinking into ground
    player.y = canvasHeight - groundHeight - player.height;

    const state = {
      score: 0,
      stage: 1,
      speed: 1,
      spawnTimer: 0,
      spawnInterval: 78,
      obstacles: [],
      platforms: [],
      enemies: [],
      playerShots: [],
      enemyShots: [],
      particles: [],
      stars: [],
      hills: [],
      groundScroll: 0,
      boss: null,
      obstaclesCreated: 0,
      passedObstacles: 0,
      obstaclesToPass: 55,
      door: null,
      doorSequence: false,
      doorFlashTimer: 0,
      hintText: '',
      bossMusic: null,
      stageMusic: null,
      stage2Music: null,
      active: false,
      bestScore: Number(localStorage.getItem('jumpDodgeBestScore') || 0),
      shakeTimer: 0,
      shakeStrength: 0,
      shakeBase: 0,
      floatTexts: [],
      items: [],
      itemTimer: 300,
      doubleTimer: 0,
      combo: 0,
      comboTimer: 0,
      hurtTimer: 0,
      comboScale: 1,
      comboScaleVel: 0,
      kills: 0,
      runStart: 0,
      intro: { active: false, t: 0, dur: 100, ring: 0, flash: 0, landed: false, goT: 0 },
      messageMode: 'start',
      mode: 'story',
      keys: {
        Space: false,
        KeyA: false,
        KeyD: false,
        KeyJ: false,
        KeyS: false,
      },
      fallingObjects: [],
      fallTimer: 120,
      skin: localStorage.getItem('jd_skin') || 'cyan',
      tookHit: false,
      itemKinds: {},
    };

    /* ============================ 音效 ============================ */

    function applySettings() {
      masterGain.gain.value = Math.max(0, Math.min(1, settings.volume / 100));
    }
    applySettings();

    /* ===== 皮肤 / 主题 / 成就 / 排行榜 系统 ===== */
    const SKINS = [

    function getAchList() { try { return JSON.parse(localStorage.getItem('jd_ach') || '[]'); } catch(e){ return []; } }

    // 成就 / 提示 浮层（顶部飘出）

    function tone(opts) {
      const {
        freq = 440, type = 'sine', dur = 0.15, vol = 0.15,
        attack = 0.008, cutoff = 2400, resonance = 0.6,
        slideTo = null, slideTime = null, delay = 0
      } = opts;
      const t0 = audioCtx.currentTime + delay;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filt = audioCtx.createBiquadFilter();
      filt.type = 'lowpass';
      filt.frequency.value = cutoff;
      filt.Q.value = resonance;
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + (slideTime || dur));
      osc.connect(filt); filt.connect(gain); gain.connect(opts.dest || masterGain);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(vol, t0 + attack);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    }
    function chord(freqs, opts = {}) { freqs.forEach(f => tone({ ...opts, freq: f })); }
    function arp(freqs, opts = {}) {
      const step = opts.step || 0.08;
      freqs.forEach((f, i) => tone({ ...opts, freq: f, delay: (opts.delay || 0) + i * step }));
    }
    // 兼容旧的直接调用
    function playTone(freq, type = 'sine', duration = 0.12) {
      tone({ freq, type, dur: duration, vol: 0.14, cutoff: 2200 });
    }

    function playJumpSound() {
      tone({ freq: 380, slideTo: 620, type: 'sine', dur: 0.18, vol: 0.16, cutoff: 1800 });
      tone({ freq: 570, slideTo: 930, type: 'sine', dur: 0.15, vol: 0.05, cutoff: 2200 });
    }
    function playDoubleJumpSound() {
      tone({ freq: 520, slideTo: 880, type: 'sine', dur: 0.18, vol: 0.16, cutoff: 2000 });
      tone({ freq: 780, slideTo: 1320, type: 'sine', dur: 0.14, vol: 0.045, cutoff: 2400 });
    }
    function playLandSound(impact = 0.5) {
      // 柔和低频"咚"
      tone({ freq: 180 + impact * 40, slideTo: 60, type: 'sine', dur: 0.2, vol: 0.14 + impact * 0.16, cutoff: 800 });
    }
    function playShootSound() {
      // 柔和 pew
      tone({ freq: 820, slideTo: 460, type: 'triangle', dur: 0.1, vol: 0.09, cutoff: 1500 });
    }
    function playChargeSound() {
      // 上行嗡鸣，缓入
      tone({ freq: 260, slideTo: 520, type: 'sine', dur: 0.35, vol: 0.12, cutoff: 1000, attack: 0.1 });
    }
    function playChargeReleaseSound() {
      // 释放：饱满下扫和声
      tone({ freq: 720, slideTo: 300, type: 'triangle', dur: 0.22, vol: 0.15, cutoff: 1800 });
      tone({ freq: 480, slideTo: 200, type: 'sine', dur: 0.24, vol: 0.09, cutoff: 1400 });
    }
    function playEnemyHitSound() {
      // 清脆"叮"
      tone({ freq: 880, type: 'sine', dur: 0.1, vol: 0.12, cutoff: 3200 });
      tone({ freq: 1320, type: 'sine', dur: 0.07, vol: 0.045, cutoff: 3600 });
    }
    function playBossHitSound() {
      tone({ freq: 300, slideTo: 200, type: 'triangle', dur: 0.12, vol: 0.14, cutoff: 1200 });
    }
    function playDoorMusic() {
      // 悦耳上行琶音（C 大三和弦）
      arp([523, 659, 784, 1047], { type: 'sine', dur: 0.3, vol: 0.13, cutoff: 2800, step: 0.09 });
    }
    function playFailSound() {
      // 低沉柔和下行，不刺耳
      tone({ freq: 300, slideTo: 150, type: 'sine', dur: 0.5, vol: 0.16, cutoff: 900 });
      tone({ freq: 360, slideTo: 180, type: 'sine', dur: 0.5, vol: 0.08, cutoff: 900, delay: 0.02 });
    }
    function playWinSound() {
      // 胜利上行琶音（大调）
      arp([523, 659, 784, 1047, 1319], { type: 'sine', dur: 0.35, vol: 0.15, cutoff: 3200, step: 0.1 });
    }
    function playIntroWhoosh() {
      tone({ freq: 200, slideTo: 760, type: 'sine', dur: 0.4, vol: 0.14, cutoff: 1600, attack: 0.05 });
    }
    function playIntroBurst() {
      chord([523, 784], { type: 'sine', dur: 0.25, vol: 0.14, cutoff: 2800 });
      tone({ freq: 1047, type: 'sine', dur: 0.3, vol: 0.07, cutoff: 3200, delay: 0.03 });
    }

    /* ===== 开场动画 ===== */
    function startIntro() {
      if (state.stage !== 1) return; // 仅第一关播放开场
      const io = state.intro;
      io.active = true; io.t = 0; io.ring = 0; io.flash = 0; io.landed = false; io.goT = 0;
      // 保持在起点，与开始界面无缝衔接（不做位置跳变）
      player.x = 120; player.vx = 0; player.dy = 0;
      player.onGround = true; player.trail = [];
      player.squash = 1; player.stretch = 1;
      player.direction = 'right';
      state.particles = [];
      state.floatTexts = [];
    }

    function updateIntro() {
      const io = state.intro;
      io.t++;
      const cx = player.x + player.width / 2;
      const cy = player.y + player.height / 2;

      if (io.t < 26) {
        // 蓄力：能量向角色汇聚 + 轻微下蹲压扁
        player.squash += (1.16 - player.squash) * 0.18;
        player.stretch += (0.84 - player.stretch) * 0.18;
        if (io.t % 2 === 0) {
          const ang = Math.random() * Math.PI * 2;
          const dist = 55 + Math.random() * 40;
          state.particles.push({
            x: cx + Math.cos(ang) * dist, y: cy + Math.sin(ang) * dist,
            vx: -Math.cos(ang) * (2.6 + Math.random() * 1.6), vy: -Math.sin(ang) * (2.6 + Math.random() * 1.6),
            life: 18, maxLife: 20, size: 2.4, color: Math.random() < 0.5 ? '#8df4ff' : '#ffffff', gravity: 0
          });
        }
      } else if (io.t === 26) {
        // 蓄力完成 → 向上跃起亮相
        player.dy = -16; player.onGround = false;
        player.squash = 0.68; player.stretch = 1.38;
        playIntroWhoosh();
        spawnParticles(cx, canvasHeight - groundHeight, 16, {
          color: ['#8df4ff', '#ffffff'], angle: -Math.PI / 2, spread: Math.PI * 0.8, speedMin: 1.5, speedMax: 4, gravity: 0.1, life: 20, size: 2.5
        });
      }

      // 空中物理 + 拖尾
      if (!player.onGround) {
        player.dy += 0.82;
        player.y += player.dy;
        player.trail.unshift({ x: player.x, y: player.y });
        if (player.trail.length > 8) player.trail.pop();
        const groundY = canvasHeight - groundHeight - player.height;
        if (player.dy > 0 && player.y >= groundY && !io.landed) {
          player.y = groundY; player.dy = 0; player.onGround = true; io.landed = true;
          // 落地：冲击波环 + 闪白 + 粒子爆发
          io.ring = 0.01; io.flash = 0.9;
          player.squash = 1.42; player.stretch = 0.58; // 落地压扁（变宽变矮）
          addShake(10, 12);
          spawnParticles(cx, canvasHeight - groundHeight, 46, {
            color: ['#8df4ff', '#ffffff', '#b6fff0'], angle: -Math.PI / 2, spread: Math.PI,
            speedMin: 2, speedMax: 7.5, gravity: 0.12, life: 32, size: 3
          });
          // 全向彩色碎光迸发
          spawnParticles(cx, player.y + player.height / 2, 34, {
            color: ['#8df4ff', '#ffffff', '#ff9bd0', '#ffe07a'], speedMin: 3, speedMax: 9.5, gravity: 0.04, life: 36, size: 3
          });
          playIntroBurst();
        }
      }

      // squash / stretch 回弹
      player.squash += (1 - player.squash) * 0.18;
      player.stretch += (1 - player.stretch) * 0.18;

      if (io.ring > 0) io.ring += 0.06;
      if (io.flash > 0) io.flash -= 0.06;
      if (io.landed) io.goT++;

      updateParticles();
      updateBackground();

      // 落地后 GO! 播完，结束开场
      if (io.landed && io.goT >= 48) {
        io.active = false;
        player.trail = []; player.squash = 1; player.stretch = 1;
      }
    }

    function drawIntro() {
      const io = state.intro;
      if (!io.active) return;
      const cx = player.x + player.width / 2;
      // 跃起拖尾残影
      if (!player.onGround || (io.landed && io.goT < 6)) {
        for (let i = 1; i < player.trail.length; i++) {
          const tp = player.trail[i];
          ctx.save();
          ctx.globalAlpha = 0.16 * (1 - i / player.trail.length);
          ctx.fillStyle = '#4fe3ff';
          ctx.fillRect(tp.x + 8, tp.y + 8, player.width - 16, player.height - 12);
          ctx.restore();
        }
      }
      // 落地冲击波环
      if (io.ring > 0 && io.ring < 4) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - io.ring / 4);
        ctx.strokeStyle = '#8df4ff';
        ctx.lineWidth = 4;
        ctx.shadowBlur = 20; ctx.shadowColor = '#8df4ff';
        ctx.beginPath(); ctx.arc(cx, canvasHeight - groundHeight, io.ring * 55, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
      // GO! 文字（霓虹斜体 + 速度线，弹入放大后淡出）
      if (io.landed) {
        const gt = io.goT;
        const bx = canvasWidth / 2, by = canvasHeight / 2 - 10;
        // 中心径向光爆
        if (gt < 16) {
          const ga = Math.max(0, 1 - gt / 16);
          const rr = gt * 22 + 10;
          const bg = ctx.createRadialGradient(bx, by, 0, bx, by, rr);
          bg.addColorStop(0, `rgba(190,250,255,${0.55 * ga})`);
          bg.addColorStop(0.55, `rgba(120,220,255,${0.22 * ga})`);
          bg.addColorStop(1, 'rgba(120,220,255,0)');
          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, canvasWidth, canvasHeight);
        }
        // 旋转放射光芒
        if (gt < 26) {
          const ga = Math.max(0, 1 - gt / 26);
          ctx.save();
          ctx.translate(bx, by);
          ctx.rotate(gt * 0.05);
          ctx.strokeStyle = `rgba(140,244,255,${0.4 * ga})`;
          ctx.lineWidth = 3;
          for (let i = 0; i < 10; i++) {
            const a = i * Math.PI / 5;
            const r1 = 44, r2 = 80 + gt * 3;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
            ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
            ctx.stroke();
          }
          ctx.restore();
        }
        const gp = Math.min(1, gt / 12);
        const pop = 1 - Math.pow(1 - gp, 3); // 弹入缓动
        const scale = 0.5 + pop * 0.7 + Math.max(0, gt - 30) * 0.02;
        const alpha = gt < 30 ? 1 : Math.max(0, 1 - (gt - 30) / 16);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(canvasWidth / 2, canvasHeight / 2 - 10);
        ctx.scale(scale, scale);
        ctx.transform(1, 0, -0.2, 1, 0, 0); // 斜切，营造速度感
        ctx.textAlign = 'center';
        ctx.font = 'italic 900 88px Arial';
        ctx.lineJoin = 'round';

        // 背后速度线
        ctx.strokeStyle = 'rgba(140,244,255,0.55)';
        for (let i = 0; i < 3; i++) {
          const ly = -20 + i * 18;
          ctx.lineWidth = 5 - i;
          ctx.beginPath();
          ctx.moveTo(-165 - i * 22, ly);
          ctx.lineTo(-72, ly);
          ctx.stroke();
        }

        // 深色粗描边（立体感）
        ctx.strokeStyle = '#0a1030';
        ctx.lineWidth = 13;
        ctx.strokeText('GO!', 0, 0);
        // 霓虹发光描边
        ctx.shadowBlur = 30; ctx.shadowColor = '#4fe3ff';
        ctx.strokeStyle = '#4fe3ff';
        ctx.lineWidth = 4;
        ctx.strokeText('GO!', 0, 0);
        // 渐变填充
        ctx.shadowBlur = 0;
        const grd = ctx.createLinearGradient(0, -56, 0, 32);
        grd.addColorStop(0, '#ffffff');
        grd.addColorStop(0.5, '#8df4ff');
        grd.addColorStop(1, '#57a8ff');
        ctx.fillStyle = grd;
        ctx.fillText('GO!', 0, 0);
        // 顶部高光
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.font = 'italic 900 88px Arial';

        ctx.restore();
        ctx.textAlign = 'left';
      }
      // 落地闪白
      if (io.flash > 0 && settings.flash) {
        ctx.fillStyle = `rgba(255,255,255,${io.flash})`;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
      }
    }

    function enterPlay() {
      const wasStart = state.messageMode === 'start';
      hideMessage();
      if (wasStart) { startIntro(); startStageMusic(); state.runStart = performance.now(); }
      startLoop();
    }

    /* ==================== 背景 & 粒子系统 ==================== */
    function initBackground() {
      state.stars = [];
      for (let i = 0; i < 110; i++) {
        state.stars.push({
          x: Math.random() * canvasWidth,
          y: Math.random() * (canvasHeight - groundHeight),
          r: Math.random() * 1.6 + 0.4,
          speed: Math.random() * 0.5 + 0.1,
          twinkle: Math.random() * Math.PI * 2,
          bright: Math.random() < 0.16, // 亮星带十字光芒
        });
      }
      // 漂浮光尘（氛围）
      state.motes = [];
      for (let i = 0; i < 24; i++) {
        state.motes.push({
          x: Math.random() * canvasWidth,
          y: Math.random() * (canvasHeight - groundHeight),
          r: Math.random() * 2 + 1,
          sp: Math.random() * 0.4 + 0.15,
          drift: Math.random() * Math.PI * 2,
          hue: Math.random() < 0.5 ? '140,240,255' : '180,150,255',
        });
      }
      // 流星
      state.meteors = [];
      state.meteorTimer = 100;
      // 远景城市剪影
      state.city = [];
      let bx = 0;
      while (bx < canvasWidth + 60) {
        const w = 24 + Math.random() * 40;
        const h = 26 + Math.random() * 88;
        state.city.push({ x: bx, w, h, win: Math.floor(Math.random() * 3) });
        bx += w + 6 + Math.random() * 22;
      }
      state.cityOffset = 0;
      const layers = [
        { color: '#171f45', speed: 0.35, amp: 40, base: canvasHeight - groundHeight + 14, step: 170 },
        { color: '#212a5c', speed: 0.7, amp: 30, base: canvasHeight - groundHeight + 8, step: 130 },
        { color: '#2c3878', speed: 1.15, amp: 22, base: canvasHeight - groundHeight + 4, step: 100 },
      ];
      state.hills = layers.map(l => ({ ...l, offset: 0 }));
    }

    function spawnParticles(x, y, count, opts = {}) {
      const MAX_PARTICLES = 600; // 上限，防止低端设备卡顿
      if (state.particles.length >= MAX_PARTICLES) return;
      count = Math.min(count, MAX_PARTICLES - state.particles.length);
      const colors = Array.isArray(opts.color) ? opts.color : [opts.color || '#8df4ff'];
      const spread = opts.spread != null ? opts.spread : Math.PI * 2;
      const baseAngle = opts.angle != null ? opts.angle : 0;
      const speedMin = opts.speedMin != null ? opts.speedMin : 1;
      const speedMax = opts.speedMax != null ? opts.speedMax : 3;
      const life = opts.life != null ? opts.life : 24;
      for (let i = 0; i < count; i++) {
        const ang = opts.angle != null ? baseAngle + (Math.random() - 0.5) * spread : Math.random() * Math.PI * 2;
        const sp = speedMin + Math.random() * (speedMax - speedMin);
        state.particles.push({
          x, y,
          vx: Math.cos(ang) * sp + (opts.vx || 0),
          vy: Math.sin(ang) * sp + (opts.vy || 0),
          life: life + Math.random() * (life * 0.4),
          maxLife: life * 1.4,
          size: (opts.size || 3) * (0.6 + Math.random() * 0.7),
          color: colors[Math.floor(Math.random() * colors.length)],
          gravity: opts.gravity != null ? opts.gravity : 0.15,
        });
      }
    }

    function updateParticles() {
      for (const p of state.particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= 0.98;
        p.life -= 1;
      }
      state.particles = state.particles.filter(p => p.life > 0);
    }
    // 落地冲击环更新
    function updateLandRings() {
      if (!state.landRings || !state.landRings.length) return;
      for (const ring of state.landRings) {
        const progress = 1 - ring.life;
        ring.r = 4 + (ring.maxR - 4) * progress;
        ring.life -= 0.07; // ~14 帧消散
      }
      state.landRings = state.landRings.filter(r => r.life > 0);
    }

    /* ===== 得分飘字 + 连击 ===== */
    function spawnFloatText(x, y, text, color) {
      state.floatTexts.push({ x, y, text, color: color || '#eafaff', life: 46, vy: -0.8 });
    }
    function updateFloatTexts() {
      for (const f of state.floatTexts) { f.y += f.vy; f.life -= 1; }
      state.floatTexts = state.floatTexts.filter(f => f.life > 0);
    }
    function drawFloatTexts() {
      ctx.textAlign = 'center';
      for (const f of state.floatTexts) {
        const a = Math.min(1, f.life / 18);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.font = 'bold 18px Arial';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(10,14,30,0.7)';
        ctx.strokeText(f.text, f.x, f.y);
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, f.x, f.y);
        ctx.restore();
      }
      ctx.textAlign = 'left';
    }
    // 连击加分：连续得分不断档则倍率递增
    function addScore(base, x, y, color) {
      state.combo += 1;
      state.comboTimer = 180;
      // 弹簧动画：每次得分触发冲量，连击越高冲量越大
      if (state.combo >= 3) {
        const impulse = Math.min(0.6, 0.18 + (state.combo - 3) * 0.018);
        state.comboScaleVel = impulse;
      }
      const mult = 1 + Math.floor((state.combo - 1) / 8);
      const dm = state.doubleTimer > 0 ? 2 : 1;
      const gain = base * mult * dm;
      state.score += gain;
      scoreEl.textContent = state.score;
      const txt = '+' + gain + (state.combo >= 3 ? ('  连击' + state.combo) : '');
      spawnFloatText(x, y, txt, (mult >= 2 || dm > 1) ? '#ffd86a' : (color || '#8df4ff'));
      // 成就：连击达 20
      if (state.combo >= 20) unlockAch('combo20');
    }

    /* ===== 道具系统（护盾 / 无敌星 / 双倍分） ===== */
    function spawnItem() {
      const types = ['shield', 'star', 'double'];
      const type = types[Math.floor(Math.random() * types.length)];
      const gy = canvasHeight - groundHeight;
      const y = gy - (40 + Math.random() * 70);
      state.items.push({
        x: canvasWidth + 40, y, baseY: y, bob: Math.random() * Math.PI * 2,
        vx: -(3 + state.speed * 1.2), type, r: 16, taken: false,
      });
    }
    function pickItem(type, x, y) {
      playTone(880, 'sine', 0.12);
      // 记录已拾取道具类型（用于成就）
      state.itemKinds[type] = true;
      if (state.itemKinds['shield'] && state.itemKinds['star'] && state.itemKinds['double']) unlockAch('items3');
      if (type === 'shield') {
        player.shield = true;
        const sh = document.getElementById('shield'); if (sh) { sh.textContent = '有'; sh.className = 'on'; }
        spawnFloatText(x, y, '🛡 护盾', '#6dffb0');
        spawnParticles(x, y, 16, { color: ['#6dffb0', '#ffffff'], speedMin: 1, speedMax: 4, gravity: 0.05, life: 24, size: 3 });
      } else if (type === 'star') {
        player.invuln = Math.max(player.invuln, 360);
        spawnFloatText(x, y, '⭐ 无敌', '#ffe07a');
        spawnParticles(x, y, 20, { color: ['#ffe07a', '#ffffff'], speedMin: 1, speedMax: 5, gravity: 0.05, life: 26, size: 3 });
      } else {
        state.doubleTimer = 420;
        spawnFloatText(x, y, '✨ 双倍分', '#8df4ff');
        spawnParticles(x, y, 18, { color: ['#8df4ff', '#ffffff'], speedMin: 1, speedMax: 4, gravity: 0.05, life: 24, size: 3 });
      }
    }
    function updateItems() {
      const pb = { x: player.x + 6, y: player.y + 8, width: player.width - 12, height: player.height - 10 };
      for (const it of state.items) {
        it.x += it.vx;
        it.bob += 0.08;
        it.y = it.baseY + Math.sin(it.bob) * 6;
        if (!it.taken && rectOverlap(pb, { x: it.x - it.r, y: it.y - it.r, width: it.r * 2, height: it.r * 2 })) {
          it.taken = true;
          pickItem(it.type, it.x, it.y);
        }
      }
      state.items = state.items.filter(it => !it.taken && it.x > -40);
    }
    function drawItems() {
      for (const it of state.items) {
        const col = it.type === 'shield' ? '#6dffb0' : it.type === 'star' ? '#ffe07a' : '#8df4ff';
        ctx.save();
        ctx.shadowBlur = 16; ctx.shadowColor = col;
        const g = ctx.createRadialGradient(it.x, it.y, 0, it.x, it.y, it.r);
        g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, col); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        ctx.font = '16px Arial'; ctx.textAlign = 'center';
        ctx.fillText(it.type === 'shield' ? '🛡' : it.type === 'star' ? '⭐' : '✨', it.x, it.y + 5);
        ctx.textAlign = 'left';
      }
    }

    function updateBackground() {
      const spd = 1 + state.speed;
      for (const s of state.stars) {
        s.x -= s.speed * spd * 0.35;
        if (s.x < -2) { s.x = canvasWidth + 2; s.y = Math.random() * (canvasHeight - groundHeight); }
        s.twinkle += 0.05;
      }
      for (const m of state.motes) {
        m.x -= m.sp * spd * 0.5;
        m.drift += 0.02;
        m.y += Math.sin(m.drift) * 0.3;
        if (m.x < -4) { m.x = canvasWidth + 4; m.y = Math.random() * (canvasHeight - groundHeight); }
      }
      // 城市视差滚动
      const totalCity = canvasWidth + 60;
      state.cityOffset -= 0.5 * spd;
      if (state.cityOffset <= -totalCity) state.cityOffset += totalCity;
      // 流星
      state.meteorTimer -= 1;
      if (state.meteorTimer <= 0) {
        state.meteorTimer = 160 + Math.random() * 260;
        // 只在高空掠过：起点在天顶附近，近乎水平、缓慢，像遥远星尘
        state.meteors.push({
          x: canvasWidth * (0.35 + Math.random() * 0.6), y: 8 + Math.random() * 26,
          vx: -(3 + Math.random() * 2), vy: 0.5 + Math.random() * 0.7, life: 55,
        });
      }
      for (const me of state.meteors) { me.x += me.vx; me.y += me.vy; me.life -= 1; }
      // 限制在上部天空区域，绝不进入玩家活动区，避免误认为攻击
      state.meteors = state.meteors.filter(me => me.life > 0 && me.y < canvasHeight * 0.32);
      for (const h of state.hills) {
        h.offset -= h.speed * spd;
        if (h.offset <= -h.step) h.offset += h.step;
      }
      state.groundScroll -= (3 + state.speed * 2);
    }

    function updateBestScore() {
      if (state.score > state.bestScore) {
        state.bestScore = state.score;
        localStorage.setItem('jumpDodgeBestScore', state.bestScore);
      }

    function createBossMusic() {
      if (state.bossMusic) return;
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();
      // 柔和低沉铺底 + 五度和声（sine 波，无尖啸）
      osc1.type = 'sine';
      osc2.type = 'sine';
      osc1.frequency.value = 65;    // 低沉根音
      osc2.frequency.value = 97.5;  // 纯五度和声
      filter.type = 'lowpass';
      filter.frequency.value = 380;
      filter.Q.value = 1.2;         // 低 Q，避免共振尖啸
      // 缓慢起伏，轻微调制截止频率
      lfo.type = 'sine';
      lfo.frequency.value = 0.18;
      lfoGain.gain.value = 70;
      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);
      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.8); // 更低音量、缓入
      osc1.start();
      osc2.start();
      lfo.start();
      state.bossMusic = {osc1, osc2, lfo, filter, gain};
    }

    function stopBossMusic() {
      if (!state.bossMusic) return;
      const {osc1, osc2, lfo, gain} = state.bossMusic;
      gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
      osc1.stop(audioCtx.currentTime + 0.5);
      osc2.stop(audioCtx.currentTime + 0.5);
      lfo.stop(audioCtx.currentTime + 0.5);
      state.bossMusic = null;
    }

    // ===== 第一关背景音乐（轻快循环：旋律 + 低音 + 轻节拍） =====
    function startStageMusic() {
      if (state.stageMusic) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const track = audioCtx.createGain();
      track.gain.value = 0.0001;
      track.connect(masterGain);
      track.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.6); // 淡入
      const bpm = 122;
      const eighth = (60 / bpm) / 2; // 八分音符时长（秒）
      // 4 小节循环（C 大调，轻快）
      const melody = [523,659,784,659, 587,784,988,784, 659,784,1047,784, 587,659,880,784];
      const bass   = [131,131,196,196, 147,147,196,196, 165,165,196,196, 147,147,196,196];
      let step = 0;
      const timer = setInterval(() => {
        if (!state.stageMusic) return;
        const i = step % melody.length;
        const m = melody[i], b = bass[i];
        if (m) tone({ freq: m, type: 'triangle', dur: eighth * 0.95, vol: 0.055, cutoff: 2200, dest: track });
        if (b) tone({ freq: b, type: 'sine', dur: eighth * 1.2, vol: 0.05, cutoff: 500, dest: track });
        if (step % 2 === 0) tone({ freq: 2100, type: 'sine', dur: 0.03, vol: 0.02, cutoff: 4000, dest: track }); // 轻节拍
        step++;
      }, eighth * 1000);
      state.stageMusic = { timer, track };
    }
    function stopStageMusic() {
      if (!state.stageMusic) return;
      const { timer, track } = state.stageMusic;
      const now = audioCtx.currentTime;
      track.gain.cancelScheduledValues(now);
      track.gain.setValueAtTime(track.gain.value, now);
      track.gain.linearRampToValueAtTime(0.0001, now + 0.5); // 淡出
      setTimeout(() => { clearInterval(timer); try { track.disconnect(); } catch (e) {} }, 560);
      state.stageMusic = null;
    }

    // ===== 第二关战斗背景音乐（A 小调，更快更紧张，低音驱动） =====
    function startStage2Music() {
      if (state.stage2Music) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const track = audioCtx.createGain();
      track.gain.value = 0.0001;
      track.connect(masterGain);
      track.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.6); // 淡入
      const bpm = 142;
      const eighth = (60 / bpm) / 2;
      const melody = [440,523,659,523, 440,523,587,523, 415,494,622,494, 440,659,587,880];
      const bass   = [110,110,110,110, 98,98,98,98, 104,104,104,104, 110,110,98,110];
      let step = 0;
      const timer = setInterval(() => {
        if (!state.stage2Music) return;
        const i = step % melody.length;
        const m = melody[i], b = bass[i];
        if (m) tone({ freq: m, type: 'triangle', dur: eighth * 0.8, vol: 0.05, cutoff: 2000, dest: track });
        if (b) tone({ freq: b, type: 'sine', dur: eighth * 0.95, vol: 0.075, cutoff: 460, dest: track }); // 低音强驱动
        if (step % 2 === 0) tone({ freq: 1900, type: 'sine', dur: 0.025, vol: 0.022, cutoff: 5000, dest: track }); // 急促节拍
        step++;
      }, eighth * 1000);
      state.stage2Music = { timer, track };
    }
    function stopStage2Music() {
      if (!state.stage2Music) return;
      const { timer, track } = state.stage2Music;
      const now = audioCtx.currentTime;
      track.gain.cancelScheduledValues(now);
      track.gain.setValueAtTime(track.gain.value, now);
      track.gain.linearRampToValueAtTime(0.0001, now + 0.5); // 淡出
      setTimeout(() => { clearInterval(timer); try { track.disconnect(); } catch (e) {} }, 560);
      state.stage2Music = null;
    }

    function addShake(strength, time) {
      if (!settings.shake) return; // 设置里可关闭屏幕震动
      state.shakeStrength = Math.max(state.shakeStrength, strength);
      state.shakeTimer = Math.max(state.shakeTimer, time);
      state.shakeBase = Math.max(state.shakeBase, time);
    }

    function endGame(text) {
      stopBossMusic();
      stopStageMusic();
      stopStage2Music();
      state.active = false;
      const _t = state.runStart ? Math.round((performance.now() - state.runStart) / 1000) : 0;
      const _rec = state.score > state.bestScore;
      updateBestScore();
      document.getElementById('bestScore').textContent = state.bestScore;
      // 无尽模式：记录排行榜 + 成就
      let lbHtml = '';
      if (state.mode === 'endless') {
        addLeaderboard(state.score);
        if (state.score >= 50) unlockAch('endless50');
        const lb = getLeaderboard();
        if (lb.length) {
          lbHtml = '<br><span style="color:#ffd86a;font-size:13px">🏆 无尽排行</span><br>' +
            lb.map((s, i) => `<span style="font-size:12px">${i+1}. ${s}</span>`).join('<br>');
        }
      }
      { const inst = document.getElementById('instructions'); if (inst) inst.innerHTML = '本局得分 <b>' + state.score + '</b> · 用时 ' + _t + 's · 击杀 ' + state.kills + (_rec ? ' · <b style="color:#ffd86a">🏆 新纪录</b>' : '') + lbHtml; }
      // 死亡爆裂粒子
      spawnParticles(player.x + player.width / 2, player.y + player.height / 2, 30, {
        color: ['#ff6d6d', '#ffd86a', '#ffffff'], speedMin: 2, speedMax: 6, gravity: 0.2, life: 34, size: 4
      });
      addShake(10, 16);
      drawScene();
      showMessage(text, '重新开始', 'end');
      playFailSound();
    }

    function playShieldBreakSound() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(680, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.25);
      osc.connect(gain); gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.22, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    // 受到致命伤害：有护盾则抵挡一次（破盾 + 短暂无敌），否则结束游戏
    function takeDamage(reason) {
      if (player.invuln > 0) return;
      if (player.shield) {
        player.shield = false;
        player.invuln = 70;
        { const sh = document.getElementById('shield'); sh.textContent = '无'; sh.className = 'off'; }
        playShieldBreakSound();
        addShake(6, 10);
        spawnParticles(player.x + player.width / 2, player.y + player.height / 2, 26, {
          color: ['#7ef0ff', '#ffffff', '#b6fff0'], speedMin: 2, speedMax: 5.5, gravity: 0.05, life: 28, size: 3
        });
        // 护盾抵挡也算受伤，标记未无伤通过第一关
        state.tookHit = true;
        state.hurtTimer = 38; // 护盾破碎也触发红晕（稍短）
        return;
      }
      state.tookHit = true;
      state.hurtTimer = 55; // 受致命伤时红晕更强更久
      endGame(reason);
    }

    function winGame() {
      stopBossMusic();
      stopStageMusic();
      stopStage2Music();
      unlockAch('clear'); // 成就：首次通关
      const _t = state.runStart ? Math.round((performance.now() - state.runStart) / 1000) : 0;
      const _rec = state.score > state.bestScore;
      updateBestScore();
      document.getElementById('bestScore').textContent = state.bestScore;
      { const inst = document.getElementById('instructions'); if (inst) inst.innerHTML = '🎉 得分 <b>' + state.score + '</b> · 用时 ' + _t + 's · 击杀 ' + state.kills + (_rec ? ' · <b style="color:#ffd86a">🏆 新纪录</b>' : ''); }
      playWinSound();
      drawScene();
      showMessage('🎉 恭喜通关！击败 Boss，游戏结束', '重新开始', 'end');
    }

    function startStage2() {
      // 成就：无伤通过第一关
      if (!state.tookHit) unlockAch('noHit1');
      stopStageMusic(); // 结束第一关背景音乐
      startStage2Music(); // 开启第二关战斗音乐
      state.stage = 2;
      state.score = 0;
      state.speed = 1.1;
      state.spawnTimer = 90; // 开局缓冲，避免一进关就被围
      state.spawnInterval = 90;
      state.obstacles = [];
      state.platforms = [
        { x: 250, y: canvasHeight - groundHeight - 96, width: 150, height: 14 },
        { x: 540, y: canvasHeight - groundHeight - 168, width: 140, height: 14 },
      ];
      state.enemies = [];
      state.playerShots = [];
      state.enemyShots = [];
      state.boss = null;
      state.obstaclesCreated = 0;
      state.passedObstacles = 0;
      state.door = null;
      state.doorSequence = false;
      state.doorFlashTimer = 0;
      state.hintText = '';
      player.x = 28;
      player.y = canvasHeight - groundHeight - player.height;
      player.jumpCount = 0;
      player.maxJumps = 2;
      resetPlayerFeel();
      document.getElementById('stage').textContent = state.stage;
      scoreEl.textContent = state.score;
      speedEl.textContent = state.speed.toFixed(1);
      { const bs = document.getElementById('lblShoot'); if (bs) bs.style.display = ''; } // 第二关显示射击提示
      // 保留第一关未破的护盾，并同步 HUD 显示（不重置 player.shield）
      { const sh = document.getElementById('shield'); if (sh) { sh.textContent = player.shield ? '有' : '无'; sh.className = player.shield ? 'on' : 'off'; } }
      { const pg = document.getElementById('progress'); if (pg) pg.style.display = 'none'; } // 第二关隐藏进度条
      showMessage('第二关开启！可二段跳，按 J 蓄力射击。按空格继续', '进入第二关', 'stage2');
    }

    /* ============================ 生成 ============================ */
    function spawnObstacle() {
      if (state.stage !== 1) return;
      if (state.obstaclesCreated >= state.obstaclesToPass) return;
      const r = Math.random();
      let type, width, height, y;
      if (r < 0.4) {
        type = 'block';
        width = 34 + Math.random() * 24;
        height = 40 + Math.random() * 30;
        y = canvasHeight - groundHeight - height;
      } else if (r < 0.62) {
        type = 'tall';
        width = 30 + Math.random() * 16;
        height = 74 + Math.random() * 34;
        y = canvasHeight - groundHeight - height;
      } else if (r < 0.82) {
        type = 'spike';
        width = 40 + Math.random() * 30;
        height = 30 + Math.random() * 22;
        y = canvasHeight - groundHeight - height;
      } else {
        type = 'floating';
        height = 36 + Math.random() * 26;
        width = 62 + Math.random() * 40;
        const gap = 30 + Math.random() * 10; // 低压顶障碍：站着/跳起会撞，必须下蹲通过
        y = canvasHeight - groundHeight - gap - height;
      }
      state.obstacles.push({ x: canvasWidth + 40, y, width, height, type, passed: false });
      state.obstaclesCreated += 1;
    }

    function spawnEnemy() {
      if (state.stage !== 2 || state.boss) return;
      const r = Math.random();
      let type;
      if (r < 0.38) type = 'green';
      else if (r < 0.62) type = 'red';
      else if (r < 0.83) type = 'flyer';
      else type = 'charger';
      const enemy = {
        x: canvasWidth + 60,
        width: 46,
        height: 52,
        dy: 0,
        gravity: 0.85,
        jumpTimer: 0,
        canJump: true,
        type,
        hp: 2,
        alive: true,
        blink: 0,
        phase: 'move',
        skillTimer: 0,
        pulse: Math.random() * Math.PI * 2,
        trail: [],
      };
      if (type === 'green') {
        enemy.width = 44; enemy.height = 48;
        enemy.y = canvasHeight - groundHeight - enemy.height;
        enemy.vx = -(2 + state.speed * 0.25);
        enemy.hp = 2;
      } else if (type === 'red') {
        enemy.height = 52;
        enemy.y = canvasHeight - groundHeight - enemy.height;
        enemy.vx = -(1.8 + state.speed * 0.2);
        enemy.hp = 2;
        enemy.skillTimer = 120 + Math.random() * 60;
      } else if (type === 'flyer') {
        enemy.width = 44; enemy.height = 40;
        enemy.baseY = 80 + Math.random() * 120;
        enemy.y = enemy.baseY;
        enemy.vx = -(2.6 + state.speed * 0.35);
        enemy.gravity = 0;
        enemy.floatPhase = Math.random() * Math.PI * 2;
        enemy.floatAmp = 18 + Math.random() * 30;
        enemy.hp = 1;
        enemy.skillTimer = 90 + Math.random() * 60;
      } else { // charger
        enemy.width = 46; enemy.height = 44;
        enemy.y = canvasHeight - groundHeight - enemy.height;
        enemy.vx = -(3 + state.speed * 0.3);
        enemy.hp = 3;
        enemy.phase = 'run';
        enemy.skillTimer = 70 + Math.random() * 40;
      }
      state.enemies.push(enemy);
    }

    function spawnBoss() {
      state.boss = {
        x: canvasWidth + 80,
        y: 70,
        width: 120,
        height: 120,
        hp: 26,
        maxHp: 26,
        phaseTimer: 120,
        shootTimer: 60,
        dashTimer: 180,
        dashSpeed: 11,
        inDash: false,
        dir: -1,        // 巡逻方向
        dashDir: -1,    // 冲刺方向
        patrolSpeed: 2.4,
        entering: true,
        entryTimer: 80,
        minX: 70,
        maxX: canvasWidth - 170, // 更大的左右活动范围
        hitTimer: 0,
        particles: [],
      };
      stopStage2Music(); // 停止普通战斗音乐
      createBossMusic();
      showMessage('警告：Boss来袭！按空格继续战斗', '挑战 Boss', 'boss');
    }

    function firePlayerShot(damage, charged = false) {
      if (player.shootCooldown > 0) return;
      const dir = player.direction === 'left' ? -1 : 1;
      const muzzleX = player.x + player.width / 2 + dir * (player.width / 2 + 4);
      const shot = {
        x: muzzleX,
        y: player.y + 24,
        vx: (charged ? 16 : 11) * dir,
        vy: 0,
        radius: charged ? 20 : 6,
        damage,
        color: charged ? '#7effff' : '#7cff9b',
        charged,
        spin: 0,
      };
      state.playerShots.push(shot);
      player.shootCooldown = charged ? 26 : 14;
      // 枪口粒子（朝射击方向喷发）
      spawnParticles(muzzleX, shot.y, charged ? 20 : 5, {
        color: charged ? ['#7effff', '#ffffff', '#b6fff0'] : ['#7cff9b', '#ffffff'],
        angle: dir > 0 ? 0 : Math.PI, spread: charged ? 1.1 : 0.6,
        speedMin: 1, speedMax: charged ? 5 : 3, gravity: 0, life: charged ? 18 : 12, size: charged ? 3.5 : 2
      });
      if (charged) { playChargeReleaseSound(); addShake(7, 10); }
      else playShootSound();
    }

    function fireEnemyShot(enemy, vx, vy = 0, color = '#fc5e5e', homing = 0) {
      state.enemyShots.push({
        x: enemy.x,
        y: enemy.y + enemy.height / 2,
        vx,
        vy,
        radius: 6,
        color,
        homing,
      });
    }

    /* ============================ 输入 ============================ */
    function handleInput() {
      if (!state.active) return;

      // 跳跃：缓冲 + 土狼时间 + 二段跳
      if (player.jumpBuffer > 0) {
        const canGroundJump = player.onGround || player.coyoteTimer > 0;
        if (canGroundJump) {
          player.dy = -player.jumpPower;
          player.jumpCount = 1;
          player.onGround = false;
          player.coyoteTimer = 0;
          player.jumpBuffer = 0;
          player.squash = 0.7; player.stretch = 1.35;
          playJumpSound();
          spawnParticles(player.x + player.width / 2, player.y + player.height, 10, {
            color: ['#8df4ff', '#ffffff'], angle: Math.PI / 2, spread: Math.PI * 0.7,
            speedMin: 1, speedMax: 3, gravity: 0.12, life: 18, size: 2.5
          });
        } else if (player.jumpCount < player.maxJumps) {
          player.dy = -player.jumpPower * 0.92;
          player.jumpCount += 1;
          player.jumpBuffer = 0;
          player.squash = 0.72; player.stretch = 1.3;
          playDoubleJumpSound();
          // 二段跳空中环形气浪
          spawnParticles(player.x + player.width / 2, player.y + player.height / 2, 14, {
            color: ['#8df4ff', '#7cff9b', '#ffffff'], angle: Math.PI / 2, spread: Math.PI,
            speedMin: 1.5, speedMax: 3.5, gravity: 0.04, life: 22, size: 2.5
          });
        }
      }

      // 下蹲：仅地面有效，下蹲时仍可左右移动（略减速，保留沉稳感）
      player.crouching = state.keys.KeyS && player.onGround;

      const accel = (player.onGround ? player.accel : player.airAccel) * (player.crouching ? 0.85 : 1);
      if (state.keys.KeyA) {
        player.vx -= accel;
        player.direction = 'left';
      }
      if (state.keys.KeyD) {
        player.vx += accel;
        player.direction = 'right';
      }

      player.vx = Math.max(-player.maxVx, Math.min(player.maxVx, player.vx));

      if (state.stage === 2 && state.keys.KeyJ) {
        if (!player.charging) {
          player.charging = true;
          player.chargeTime = 0;
          player.chargeReady = false;
        } else {
          player.chargeTime += 1;
          if (player.chargeTime === 55) {
            player.chargeReady = true;
            playChargeSound();
          }
        }
      } else if (state.stage !== 2) {
        player.charging = false;
        player.chargeTime = 0;
        player.chargeReady = false;
      }
    }

    /* ============================ 更新 ============================ */
    function updatePlayer() {
      if (player.jumpBuffer > 0) player.jumpBuffer -= 1;
      if (player.invuln > 0) player.invuln -= 1;
      if (player.coyoteTimer > 0) player.coyoteTimer -= 1;

      // 可变重力：上升松手减速快（短跳），下落更干脆（更好的平台手感）
      let g = player.gravity;
      if (player.dy > 0) g = player.fallGravity;
      else if (player.dy < 0 && !player.jumpHeld) g = player.lowJumpGravity;
      // Apex hang：跳跃顶点附近速度极小时短暂减重力，营造悬浮感
      if (!player.onGround && Math.abs(player.dy) < 2.2) g *= 0.55;
      player.dy += g;
      if (player.dy > 20) player.dy = 20;

      const prevY = player.y;
      const fallSpeed = player.dy; // 落地前的下落速度，用于计算冲击强度
      player.y += player.dy;
      const wasOnGround = player.onGround;
      player.onGround = false;

      if (state.stage === 2) {
        for (const platform of state.platforms) {
          if (player.dy >= 0 && prevY + player.height <= platform.y && player.y + player.height >= platform.y && player.x + player.width > platform.x + 8 && player.x < platform.x + platform.width - 8) {
            player.y = platform.y - player.height;
            player.dy = 0;
            player.jumpCount = 0;
            player.onGround = true;
          }
        }
      }
      if (player.y >= canvasHeight - groundHeight - player.height) {
        player.y = canvasHeight - groundHeight - player.height;
        player.dy = 0;
        player.jumpCount = 0;
        player.onGround = true;
      }

      if (player.onGround) {
        player.coyoteTimer = player.coyoteMax;
        if (!wasOnGround) {
          // 冲击强度：下落越快，震动/压扁/尘土越强（0~1）
          const impact = Math.min(1, Math.max(0, fallSpeed / 15));
          player.squash = 1.3 + impact * 0.3;   // 落地压扁：变宽
          player.stretch = 0.76 - impact * 0.2;  // 落地压扁：变矮
          // 向上扬起的尘土
          const dust = Math.round(10 + impact * 18);
          spawnParticles(player.x + player.width / 2, player.y + player.height, dust, {
            color: ['#c9d4ff', '#ffffff'], angle: -Math.PI / 2, spread: Math.PI * 0.95,
            speedMin: 1, speedMax: 2.5 + impact * 4.5, gravity: 0.24, life: 20 + impact * 14, size: 2.6
          });
          // 向左右扩散的冲击波尘土（冲击越大越明显）
          const wave = Math.round(impact * 12);
          spawnParticles(player.x + player.width / 2, player.y + player.height, wave, {
            color: ['#aeb8e0', '#ffffff'], angle: 0, spread: 0.35, speedMin: 3 + impact * 3, speedMax: 6 + impact * 5, gravity: 0.22, life: 18, size: 2.2
          });
          spawnParticles(player.x + player.width / 2, player.y + player.height, wave, {
            color: ['#aeb8e0', '#ffffff'], angle: Math.PI, spread: 0.35, speedMin: 3 + impact * 3, speedMax: 6 + impact * 5, gravity: 0.22, life: 18, size: 2.2
          });
          // 大冲击：地面冲击环（画布 2D 环形扩散 ring）
          if (impact > 0.35) {
            state.landRings = state.landRings || [];
            state.landRings.push({
              x: player.x + player.width / 2,
              y: player.y + player.height,
              r: 4, maxR: 14 + impact * 28,
              life: 1, alpha: 0.55 + impact * 0.35,
            });
          }
          playLandSound(impact);
        }
      }

      player.x += player.vx;
      player.vx *= player.onGround ? player.friction : player.airFriction;
      if (Math.abs(player.vx) < 0.08) player.vx = 0;
      player.x = Math.max(10, Math.min(canvasWidth - player.width - 10, player.x));

      // 跑步相位 + 跑动尘土
      if (player.onGround && Math.abs(player.vx) > 0.6) {
        player.runPhase += Math.abs(player.vx) * 0.05;
        if (Math.random() < 0.22) {
          spawnParticles(player.x + player.width / 2 - player.vx * 2, player.y + player.height - 2, 1, {
            color: ['#9fb0e0', '#c9d4ff'], angle: Math.PI, spread: 0.8,
            vx: -player.vx * 0.25, speedMin: 0.3, speedMax: 1, gravity: 0.05, life: 16, size: 2
          });
        }
      } else {
        player.runPhase *= 0.8;
      }

      // squash & stretch 回弹
      player.squash += (1 - player.squash) * 0.2;
      player.stretch += (1 - player.stretch) * 0.2;

      // 拖尾记录
      player.trail.unshift({ x: player.x, y: player.y });
      if (player.trail.length > 6) player.trail.pop();

      if (player.shootCooldown > 0) player.shootCooldown -= 1;
    }

    function updateObstacles() {
      state.obstacles.forEach(obs => {
        obs.x -= 5.5 + state.speed * 1.6;
        if (!obs.passed && obs.x + obs.width < 0) {
          obs.passed = true;
          state.passedObstacles += 1;
          addScore(1, player.x + player.width / 2, player.y - 12, '#8df4ff');
          // 更新第一关进度条
          { const pf = document.getElementById('progressFill'); if (pf) pf.style.width = (state.passedObstacles / state.obstaclesToPass * 100) + '%'; }
          { const pt = document.getElementById('progressText'); if (pt) pt.textContent = state.passedObstacles + ' / ' + state.obstaclesToPass; }
          if (state.passedObstacles === state.obstaclesToPass) {
            state.door = {
              x: canvasWidth - 120,
              y: canvasHeight - groundHeight - 160,
              width: 80,
              height: 140,
              flash: 0,
            };
            state.hintText = '前往闪光大门进入第二关';
          }
        }
      });
      state.obstacles = state.obstacles.filter(obs => obs.x + obs.width > -40);
    }

    /* ==================== 天降坠落物（需左右躲避） ==================== */
    function spawnFalling() {
      const targetX = Math.max(20, Math.min(canvasWidth - 60, player.x + player.vx * 6 + (Math.random() - 0.5) * 70));
      state.fallingObjects.push({
        x: targetX, y: -44, width: 36, height: 36,
        phase: 'warn', timer: 42, vy: 0,
      });
    }

    function updateFalling() {
      state.fallingObjects.forEach(o => {
        if (o.phase === 'warn') {
          o.timer -= 1;
          if (o.timer <= 0) { o.phase = 'fall'; o.vy = 3.5; o.y = -44; }
        } else if (o.phase === 'fall') {
          o.vy += 0.4;
          o.y += o.vy;
          if (o.y + o.height >= canvasHeight - groundHeight) {
            o.phase = 'done';
            spawnParticles(o.x + o.width / 2, canvasHeight - groundHeight, 18, {
              color: ['#ffb060', '#ff5b5b', '#ffffff'], angle: -Math.PI / 2, spread: Math.PI,
              speedMin: 2, speedMax: 5.5, gravity: 0.3, life: 22, size: 3
            });
          }
        }
      });
      state.fallingObjects = state.fallingObjects.filter(o => o.phase !== 'done');
    }

    function drawFalling() {
      const gy = canvasHeight - groundHeight;
      state.fallingObjects.forEach(o => {
        const cxo = o.x + o.width / 2;
        if (o.phase === 'warn') {
          const blink = 0.35 + 0.45 * Math.sin(Date.now() * 0.02);
          ctx.save();
          ctx.strokeStyle = `rgba(255,80,80,${blink})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(cxo, gy - 3, o.width * 0.7, 8, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = `rgba(255,80,80,${blink * 0.32})`;
          ctx.beginPath();
          ctx.ellipse(cxo, gy - 3, o.width * 0.7, 8, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          // 顶部下落警示三角
          ctx.fillStyle = `rgba(255,90,90,${blink})`;
          ctx.beginPath();
          ctx.moveTo(cxo - 8, 8);
          ctx.lineTo(cxo + 8, 8);
          ctx.lineTo(cxo, 22);
          ctx.closePath(); ctx.fill();
        } else if (o.phase === 'fall') {
          ctx.save();
          ctx.shadowBlur = 16; ctx.shadowColor = '#ff7b30';
          // 火焰尾
          ctx.fillStyle = '#ffce6a';
          ctx.beginPath();
          ctx.moveTo(o.x + 4, o.y);
          ctx.lineTo(cxo, o.y - 22);
          ctx.lineTo(o.x + o.width - 4, o.y);
          ctx.closePath(); ctx.fill();
          // 陨石本体
          ctx.fillStyle = '#6a4a3a';
          ctx.beginPath();
          ctx.arc(cxo, o.y + o.height / 2, o.width / 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#8a6a55';
          ctx.beginPath();
          ctx.arc(cxo - 5, o.y + o.height / 2 - 4, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      });
    }

    function updateEnemies() {
      state.enemies.forEach(enemy => {
        if (enemy.blink > 0) enemy.blink -= 1;
        enemy.pulse += 0.15;

        // 拖尾记录（飞行/冲刺怪）
        if (enemy.type === 'flyer' || enemy.type === 'charger') {
          enemy.trail.unshift({ x: enemy.x, y: enemy.y });
          if (enemy.trail.length > 8) enemy.trail.pop();
        }

        // 浮游炮：空中浮动，技能=朝玩家三连散射
        if (enemy.type === 'flyer') {
          enemy.x += enemy.vx;
          enemy.floatPhase += 0.06;
          enemy.y = enemy.baseY + Math.sin(enemy.floatPhase) * enemy.floatAmp;
          enemy.skillTimer -= 1;
          if (enemy.skillTimer <= 0) {
            enemy.skillTimer = 130 + Math.random() * 60;
            const dx = (player.x + player.width / 2) - enemy.x;
            const dy = (player.y + 20) - (enemy.y + enemy.height / 2);
            const base = Math.atan2(dy, dx);
            for (let a = -1; a <= 1; a++) {
              const ang = base + a * 0.28;
              fireEnemyShot(enemy, Math.cos(ang) * 5, Math.sin(ang) * 5, '#c9a3ff');
            }
            spawnParticles(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, 8, { color: ['#c9a3ff', '#ffffff'], speedMin: 1, speedMax: 3, gravity: 0, life: 14, size: 2 });
          }
          return;
        }

        const prevY = enemy.y;
        enemy.x += enemy.vx;
        enemy.y += enemy.dy;
        enemy.dy += enemy.gravity;

        for (const platform of state.platforms) {
          if (enemy.dy >= 0 && prevY + enemy.height <= platform.y && enemy.y + enemy.height >= platform.y && enemy.x + enemy.width > platform.x + 6 && enemy.x < platform.x + platform.width - 6) {
            enemy.y = platform.y - enemy.height;
            enemy.dy = 0;
            enemy.canJump = true;
          }
        }

        if (enemy.y >= canvasHeight - groundHeight - enemy.height) {
          enemy.y = canvasHeight - groundHeight - enemy.height;
          enemy.dy = 0;
          enemy.canJump = true;
        }

        if (enemy.type === 'green') {
          // 弹跳晶体：定期跳跃
          enemy.jumpTimer -= 1;
          if (enemy.jumpTimer <= 0 && enemy.canJump) {
            enemy.jumpTimer = 80 + Math.random() * 60;
            enemy.dy = -12 - Math.random() * 5;
            enemy.canJump = false;
          }
        } else if (enemy.type === 'red') {
          // 法师：蓄力预警 → 发射追踪弹
          enemy.skillTimer -= 1;
          if (enemy.phase === 'move' && enemy.skillTimer <= 30) enemy.phase = 'aim';
          if (enemy.skillTimer <= 0) {
            enemy.phase = 'move';
            enemy.skillTimer = 150 + Math.random() * 80;
            const dx = (player.x + player.width / 2) - enemy.x;
            const dy = (player.y + 20) - (enemy.y + enemy.height / 2);
            const len = Math.hypot(dx, dy) || 1;
            fireEnemyShot(enemy, (dx / len) * 4.5, (dy / len) * 4.5, '#ff5e8a', 70);
            spawnParticles(enemy.x, enemy.y + enemy.height / 2, 12, { color: ['#ff5e8a', '#ffffff'], speedMin: 1, speedMax: 3.5, gravity: 0, life: 16, size: 2 });
          }
        } else if (enemy.type === 'charger') {
          // 冲锋怪：奔跑 → 蓄力预警 → 高速冲刺（留残影）
          enemy.skillTimer -= 1;
          if (enemy.phase === 'run') {
            if (enemy.skillTimer <= 0) {
              enemy.phase = 'windup';
              enemy.skillTimer = 36;
              enemy.vx = -0.3;
            }
          } else if (enemy.phase === 'windup') {
            enemy.vx = -0.3 + Math.sin(enemy.pulse * 3) * 0.6;
            if (enemy.skillTimer <= 0) {
              enemy.phase = 'dash';
              enemy.skillTimer = 60;
              enemy.vx = -(11 + state.speed);
              spawnParticles(enemy.x + enemy.width, enemy.y + enemy.height / 2, 14, { color: ['#ff9a3c', '#ffffff'], angle: 0, spread: 1.2, speedMin: 2, speedMax: 5, gravity: 0.1, life: 18, size: 2.5 });
            }
          } else if (enemy.phase === 'dash') {
            if (Math.random() < 0.6) spawnParticles(enemy.x + enemy.width, enemy.y + enemy.height / 2, 2, { color: ['#ff9a3c', '#ffd86a'], speedMin: 0.5, speedMax: 2, gravity: 0.05, life: 12, size: 2 });
            if (enemy.skillTimer <= 0) {
              enemy.phase = 'run';
              enemy.skillTimer = 90 + Math.random() * 50;
              enemy.vx = -(3 + state.speed * 0.3);
            }
          }
        }
      });
      state.enemies = state.enemies.filter(enemy => enemy.x + enemy.width > -80 && enemy.alive);
    }

    function updateBoss() {
      if (!state.boss) return;
      const boss = state.boss;
      if (boss.entering) {
        boss.entryTimer -= 1;
        boss.x -= 3.4;
        if (boss.entryTimer <= 0 || boss.x <= boss.maxX) {
          boss.entering = false;
          boss.x = boss.maxX;
          boss.dir = -1;
          addShake(8, 18);
        }
      } else if (!boss.inDash) {
        // 持续左右巡逻移动
        boss.x += boss.dir * boss.patrolSpeed;
        if (boss.x <= boss.minX) { boss.x = boss.minX; boss.dir = 1; }
        if (boss.x >= boss.maxX) { boss.x = boss.maxX; boss.dir = -1; }
      } else {
        // 冲刺：朝玩家所在方向突进，撞到边界则反弹
        boss.x += boss.dashDir * boss.dashSpeed;
        if (boss.x <= boss.minX) { boss.x = boss.minX; boss.dashDir = 1; }
        if (boss.x >= boss.maxX) { boss.x = boss.maxX; boss.dashDir = -1; }
      }

      boss.phaseTimer -= 1;
      if (boss.phaseTimer <= 0) {
        boss.phaseTimer = 120;
        boss.inDash = !boss.inDash;
        if (boss.inDash) boss.dashDir = (player.x + player.width / 2 < boss.x + boss.width / 2) ? -1 : 1;
      }

      boss.shootTimer -= 1;
      if (boss.shootTimer <= 0) {
        boss.shootTimer = 36;
        [{vx: -6, vy: 0}, {vx: -5, vy: -2}, {vx: -5, vy: 2}, {vx: -4, vy: -3.5}, {vx: -4, vy: 3.5}].forEach(s => fireEnemyShot(boss, s.vx, s.vy));
      }

      boss.dashTimer -= 1;
      if (boss.dashTimer <= 0) {
        boss.dashTimer = 200;
        boss.inDash = true;
        boss.dashSpeed = 12 + Math.random() * 4;
        boss.dashDir = (player.x + player.width / 2 < boss.x + boss.width / 2) ? -1 : 1;
      }

      if (boss.hitTimer && boss.hitTimer > 0) boss.hitTimer -= 1;
      for (const p of boss.particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life -= 1;
      }
      boss.particles = boss.particles.filter(p => p.life > 0);
    }

    function updatePlayerShots() {
      state.playerShots.forEach(shot => {
        shot.x += shot.vx;
        if (shot.charged) {
          shot.spin = (shot.spin || 0) + 0.3;
          // 沿途发光拖尾
          if (Math.random() < 0.9) {
            spawnParticles(shot.x, shot.y, 2, {
              color: ['#8df4ff', '#ffffff', '#b6fff0'], speedMin: 0.2, speedMax: 1.2,
              gravity: 0, life: 14, size: 3
            });
          }
        }
      });
      state.playerShots = state.playerShots.filter(shot => shot.x > -40 && shot.x < canvasWidth + 40);
    }

    function updateEnemyShots() {
      state.enemyShots.forEach(shot => {
        // 追踪弹：一段时间内朝玩家微调方向
        if (shot.homing && shot.homing > 0) {
          const dx = (player.x + player.width / 2) - shot.x;
          const dy = (player.y + 20) - shot.y;
          const len = Math.hypot(dx, dy) || 1;
          const sp = Math.hypot(shot.vx, shot.vy) || 4.5;
          shot.vx += ((dx / len) * sp - shot.vx) * 0.05;
          shot.vy += ((dy / len) * sp - shot.vy) * 0.05;
          shot.homing -= 1;
        }
        shot.x += shot.vx;
        shot.y += shot.vy;
      });
      state.enemyShots = state.enemyShots.filter(shot => shot.x > -20 && shot.x < canvasWidth + 20 && shot.y > 0 && shot.y < canvasHeight - groundHeight);
    }

    /* ============================ 碰撞 ============================ */
    function rectOverlap(a, b) {
      return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
    }

    function pointCircleCollide(px, py, circle) {
      const dx = px - circle.x;
      const dy = py - circle.y;
      return dx * dx + dy * dy <= circle.radius * circle.radius;
    }

    function handleCollisions() {
      // 下蹲时碰撞盒变矮（顶部降低），可从低压顶障碍下方钻过
      const ph = player.crouching ? player.height * 0.5 : player.height;
      const playerBox = {x: player.x + 6, y: player.y + (player.height - ph) + 8, width: player.width - 12, height: ph - 12};

      // 无敌期（破盾后短暂）忽略一切致命碰撞
      const canDie = player.invuln <= 0;

      if (state.stage === 1) {
        if (canDie) {
          for (const obs of state.obstacles) {
            if (rectOverlap(playerBox, obs)) {
              takeDamage('游戏失败！被障碍物撞到了');
              return;
            }
          }
          for (const o of state.fallingObjects) {
            if (o.phase === 'fall') {
              const box = {x: o.x, y: o.y, width: o.width, height: o.height};
              if (rectOverlap(playerBox, box)) {
                takeDamage('游戏失败！被坠落物砸中');
                return;
              }
            }
          }
        }
        if (state.door) {
          const doorBox = {x: state.door.x, y: state.door.y, width: state.door.width, height: state.door.height};
          if (rectOverlap(playerBox, doorBox)) {
            state.doorSequence = true;
            state.doorFlashTimer = 120;
            state.door = null;
            state.hintText = '传送门闪烁中...';
            spawnParticles(playerBox.x + playerBox.width / 2, playerBox.y + playerBox.height / 2, 30, {
              color: ['#5ae2ff', '#ffffff', '#7cff9b'], speedMin: 1, speedMax: 5, gravity: 0.02, life: 40, size: 3
            });
            playDoorMusic();
          }
        }
      }

      if (state.stage === 2 && canDie) {
        for (const enemy of state.enemies) {
          if (rectOverlap(playerBox, enemy)) {
            takeDamage('游戏失败！被小怪碰到');
            return;
          }
        }
        if (state.boss && rectOverlap(playerBox, state.boss)) {
          takeDamage('游戏失败！被 Boss 撞到了');
          return;
        }
      }

      if (canDie) {
        for (const shot of state.enemyShots) {
          if (pointCircleCollide(player.x + player.width/2, player.y + 20, shot)) {
            takeDamage('游戏失败！被敌人攻击命中');
            return;
          }
        }
      }

      state.playerShots.forEach(shot => {
        state.enemies.forEach(enemy => {
          if (!enemy.alive) return;
          const ecx = enemy.x + enemy.width / 2, ecy = enemy.y + enemy.height / 2;
          const rr = Math.max(enemy.width, enemy.height) / 2 + (shot.radius || 4);
          if ((shot.x - ecx) ** 2 + (shot.y - ecy) ** 2 <= rr * rr) {
            enemy.hp -= shot.damage;
            enemy.blink = 6;
            playEnemyHitSound();
            spawnParticles(shot.x, shot.y, shot.charged ? 12 : 6, { color: ['#ffd86a', '#ffffff'], speedMin: 1, speedMax: shot.charged ? 5 : 3, gravity: 0.1, life: 16, size: 2 });
            if (!shot.charged) shot.x = canvasWidth + 200; // 普通弹命中即消失；蓄力弹穿透杂兵
            if (enemy.hp <= 0) {
              enemy.alive = false;
              state.kills += 1;
              addScore(5, ecx, ecy - 10, '#ffd86a');
              state.speed = Math.min(2.4, state.speed + 0.08);
              speedEl.textContent = state.speed.toFixed(1);
              const col = enemy.type === 'green' ? ['#5edc5e', '#ffffff']
                : enemy.type === 'red' ? ['#ff6c6c', '#ffffff']
                : enemy.type === 'flyer' ? ['#c17cff', '#ffffff']
                : ['#ff9a3c', '#ffffff'];
              spawnParticles(ecx, ecy, 18, { color: col, speedMin: 1.5, speedMax: 4.5, gravity: 0.18, life: 26, size: 3 });
              if (state.kills >= 11 && !state.boss) spawnBoss();
            }
          }
        });
        if (state.boss) {
          const bossBox = {x: state.boss.x, y: state.boss.y, width: state.boss.width, height: state.boss.height};
          if (pointCircleCollide(shot.x, shot.y, {x: bossBox.x + bossBox.width/2, y: bossBox.y + bossBox.height/2, radius: bossBox.width/2 + (shot.radius || 4)})) {
            state.boss.hp -= shot.damage;
            state.boss.hitTimer = 12;
            for (let i = 0; i < 14; i++) {
              state.boss.particles.push({
                x: shot.x, y: shot.y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 1.5) * 6,
                life: 30 + Math.floor(Math.random() * 20),
                color: Math.random() < 0.5 ? '#ff9bca' : '#ffd86a'
              });
            }
            shot.x = canvasWidth + 100;
            playBossHitSound();
            addShake(3, 4);
            if (state.boss.hp <= 0) {
