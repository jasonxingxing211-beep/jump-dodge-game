<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跳跃躲避障碍物</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at top, #2f2f5f, #09090f 68%);
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #gameContainer {
      position: relative;
      width: 900px;
      max-width: 100%;
      background: #12131b;
      border: 3px solid #4d5b7a;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }

    canvas {
      display: block;
      width: 100%;
      background: linear-gradient(180deg, #12131b, #050609);
    }

    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      gap: 12px;
      flex-wrap: wrap;
      background: rgba(12, 16, 30, 0.96);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    #hud div {
      font-size: 16px;
      white-space: nowrap;
    }

    #watermark {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.45);
      font-size: 22px;
      letter-spacing: 0.25em;
      pointer-events: none;
      z-index: 20;
      text-shadow: 0 0 14px rgba(255,255,255,0.16);
    }

    #message {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: rgba(2, 4, 12, 0.85);
      color: #fff;
      font-size: 24px;
      text-align: center;
      padding: 24px;
      visibility: hidden;
      z-index: 9;
    }

    #message button {
      margin-top: 18px;
      padding: 12px 20px;
      border: none;
      background: #1f8cff;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(31, 140, 255, 0.25);
    }

    #instructions {
      margin-top: 16px;
      font-size: 14px;
      color: #b8c0e0;
      line-height: 1.6;
      max-width: 620px;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <div id="hud">
      <div>玩家: 55</div>
      <div>关卡: <span id="stage">1</span></div>
      <div>得分: <span id="score">0</span></div>
      <div>最高分: <span id="bestScore">0</span></div>
      <div>速度: <span id="speed">1.0</span></div>
    </div>
    <div id="watermark">sjx制作</div>
    <canvas id="gameCanvas" width="900" height="450"></canvas>
    <div id="message">
      <div id="messageText">按空格开始游戏</div>
      <button id="restartButton">继续</button>
      <div id="instructions">
        控制：A/D 左右移动，空格跳跃。躲避障碍物，前往闪光大门。
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const speedEl = document.getElementById('speed');
    const message = document.getElementById('message');
    const messageText = document.getElementById('messageText');
    const restartButton = document.getElementById('restartButton');

    const canvasWidth = canvas.width;
    const canvasHeight = canvas.height;
    const groundHeight = 90;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const player = {
      x: 120,
      y: canvasHeight - groundHeight - 66,
      width: 44,
      height: 64,
      dy: 0,
      vx: 0,
      maxVx: 6,
      accel: 0.45,
      friction: 0.84,
      jumpPower: 16,
      gravity: 0.85,
      jumpCount: 0,
      maxJumps: 1,
      direction: 'right',
      shootCooldown: 0,
      charging: false,
      chargeTime: 0,
      chargeReady: false,
    };

    // Ensure initial y is aligned to player.height to avoid sinking into ground
    player.y = canvasHeight - groundHeight - player.height;

    const state = {
      score: 0,
      stage: 1,
      speed: 1,
      spawnTimer: 0,
      spawnInterval: 78,
      obstacles: [],
      platforms: [],
      enemies: [],
      playerShots: [],
      enemyShots: [],
      boss: null,
      obstaclesCreated: 0,
      passedObstacles: 0,
      obstaclesToPass: 55,
      door: null,
      doorSequence: false,
      doorFlashTimer: 0,
      hintText: '',
      bossMusic: null,
      active: false,
      bestScore: Number(localStorage.getItem('jumpDodgeBestScore') || 0),
      messageMode: 'start',
      keys: {
        Space: false,
        KeyA: false,
        KeyD: false,
        KeyJ: false,
      },
    };

    function playTone(freq, type = 'sine', duration = 0.1) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.02);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration + 0.02);
    }

    function playJumpSound() { playTone(520, 'triangle', 0.12); }
    function playShootSound() { playTone(760, 'square', 0.06); }
    function playChargeSound() { playTone(340, 'sawtooth', 0.2); }
    function playEnemyHitSound() { playTone(260, 'triangle', 0.08); }
    function playBossHitSound() { playTone(180, 'square', 0.1); }
    function playDoorMusic() {
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc1.type = 'triangle';
      osc2.type = 'sine';
      osc1.frequency.value = 520;
      osc2.frequency.value = 660;
      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.02);
      osc1.start();
      osc2.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
      osc1.stop(audioCtx.currentTime + 0.7);
      osc2.stop(audioCtx.currentTime + 0.7);
    }
    function playFailSound() { playTone(140, 'sawtooth', 0.22); }
    function playWinSound() { playTone(880, 'triangle', 0.18); }

    function showMessage(text, buttonText = '继续', mode = 'info') {
      messageText.textContent = text;
      restartButton.textContent = buttonText;
      message.style.visibility = 'visible';
      state.active = false;
      state.messageMode = mode;
    }

    function hideMessage() {
      message.style.visibility = 'hidden';
      state.active = true;
      if (state.stage === 2 && state.messageMode === 'stage2') {
        state.messageMode = 'playing';
      }
    }

    function resetGame() {
      state.stage = 1;
      state.score = 0;
      state.speed = 1;
      state.spawnTimer = 0;
      state.spawnInterval = 90;
      state.obstacles = [];
      state.enemies = [];
      state.playerShots = [];
      state.enemyShots = [];
      state.boss = null;
      state.obstaclesCreated = 0;
      state.passedObstacles = 0;
      state.door = null;
      state.doorSequence = false;
      state.doorFlashTimer = 0;
      state.hintText = '';
      state.platforms = [];
      stopBossMusic();
      player.x = 120;
      player.y = canvasHeight - groundHeight - player.height;
      player.dy = 0;
      player.vx = 0;
      player.jumpCount = 0;
      player.maxJumps = 1;
      player.direction = 'right';
      player.shootCooldown = 0;
      player.charging = false;
      player.chargeTime = 0;
      scoreEl.textContent = state.score;
      speedEl.textContent = state.speed.toFixed(1);
      document.getElementById('stage').textContent = state.stage;
      document.getElementById('bestScore').textContent = state.bestScore;
      showMessage('按空格开始游戏', '开始', 'start');
      drawScene();
    }

    function updateBestScore() {
      if (state.score > state.bestScore) {
        state.bestScore = state.score;
        localStorage.setItem('jumpDodgeBestScore', state.bestScore);
      }
    }

    function createBossMusic() {
      if (state.bossMusic) return;
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc1.type = 'sawtooth';
      osc2.type = 'square';
      osc1.frequency.value = 110;
      osc2.frequency.value = 132;
      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.5);
      osc1.start();
      osc2.start();
      state.bossMusic = {osc1, osc2, gain};
    }

    function stopBossMusic() {
      if (!state.bossMusic) return;
      const {osc1, osc2, gain} = state.bossMusic;
      gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
      osc1.stop(audioCtx.currentTime + 0.5);
      osc2.stop(audioCtx.currentTime + 0.5);
      state.bossMusic = null;
    }

    function endGame(text) {
      stopBossMusic();
      state.active = false;
      updateBestScore();
      document.getElementById('bestScore').textContent = state.bestScore;
      showMessage(text, '重新开始', 'end');
      playFailSound();
    }

    function winGame() {
      stopBossMusic();
      state.active = false;
      updateBestScore();
      document.getElementById('bestScore').textContent = state.bestScore;
      showMessage('恭喜！玩家55 击败 Boss，游戏结束', '重新开始', 'end');
      playWinSound();
    }

    function startStage2() {
      state.stage = 2;
      state.score = 0;
      state.speed = 1.1;
      state.spawnTimer = 0;
      state.spawnInterval = 90;
      state.obstacles = [];
      // 第二关不使用空中跳台（改为二段跳）
      state.platforms = [];
      state.enemies = [];
      state.playerShots = [];
      state.enemyShots = [];
      state.boss = null;
      state.obstaclesCreated = 0;
      state.passedObstacles = 0;
      state.door = null;
      state.doorSequence = false;
      state.doorFlashTimer = 0;
      state.hintText = '';
      player.x = 28;
      player.y = canvasHeight - groundHeight - player.height;
      player.jumpCount = 0;
      player.maxJumps = 2;
      document.getElementById('stage').textContent = state.stage;
      scoreEl.textContent = state.score;
      speedEl.textContent = state.speed.toFixed(1);
      showMessage('第二关开启！准备迎战小怪，按空格继续', '进入第二关', 'stage2');
    }

    function spawnObstacle() {
      if (state.stage !== 1) return;
      if (state.obstaclesCreated >= state.obstaclesToPass) return;
      const width = 32 + Math.random() * 30;
      const height = 40 + Math.random() * 48;
      state.obstacles.push({
        x: canvasWidth + 40,
        y: canvasHeight - groundHeight - height,
        width,
        height,
        passed: false,
      });
      state.obstaclesCreated += 1;
    }

    function spawnEnemy() {
      if (state.stage !== 2 || state.boss) return;
      const type = Math.random() < 0.6 ? 'green' : 'red';
      const enemy = {
        x: canvasWidth + 60,
        y: canvasHeight - groundHeight - 48,
        width: 46,
        height: 52,
        dy: 0,
        vx: -(2 + state.speed * 0.25),
        gravity: 0.85,
        jumpTimer: 0,
        canJump: true,
        type,
        hp: 2,
        shootTimer: type === 'red' ? 110 : 0,
        alive: true,
      };
      // 若无平台则敌人站在地面；平台已移除时不在空中生成
      state.enemies.push(enemy);
    }

    function spawnBoss() {
      state.boss = {
        x: canvasWidth + 160,
        y: 80,
        width: 120,
        height: 120,
        hp: 20,
        dx: -2,
        phaseTimer: 120,
        shootTimer: 60,
        dashTimer: 180,
        dashSpeed: 8,
        inDash: false,
      };
      createBossMusic();
      showMessage('警告：Boss来袭！按空格继续战斗', '挑战 Boss', 'boss');
    }

    function firePlayerShot(damage, charged = false) {
      if (player.shootCooldown > 0) return;
      const shot = {
        x: player.x + player.width / 2,
        y: player.y + 24,
        vx: charged ? 14 : 10,
        vy: 0,
        radius: charged ? 10 : 6,
        damage,
        color: charged ? '#b8f7ff' : '#7cff9b',
      };
      state.playerShots.push(shot);
      player.shootCooldown = charged ? 24 : 16;
      if (charged) playTone(980, 'triangle', 0.18);
      else playShootSound();
    }

    function fireEnemyShot(enemy, vx, vy = 0) {
      const shot = {
        x: enemy.x,
        y: enemy.y + enemy.height / 2,
        vx,
        vy,
        radius: 6,
        color: '#fc5e5e',
      };
      state.enemyShots.push(shot);
    }

    function handleInput() {
      if (!state.active) return;

      if (state.keys.Space && player.jumpCount < player.maxJumps) {
        // 让二段跳更灵敏：在第二次跳跃时稍微减少重力时延
        player.dy = -player.jumpPower * (player.jumpCount === 0 ? 1 : 0.95);
        player.jumpCount += 1;
        playJumpSound();
      }

      if (state.keys.KeyA) {
        player.vx -= player.accel * 0.95;
        player.direction = 'left';
      }
      if (state.keys.KeyD) {
        player.vx += player.accel * 0.95;
        player.direction = 'right';
      }

      player.vx = Math.max(-player.maxVx, Math.min(player.maxVx, player.vx));

      if (state.stage === 2 && state.keys.KeyJ) {
        if (!player.charging) {
          player.charging = true;
          player.chargeTime = 0;
          player.chargeReady = false;
        } else {
          player.chargeTime += 1;
          if (player.chargeTime === 60) {
            player.chargeReady = true;
            playChargeSound();
          }
        }
      } else if (state.stage !== 2) {
        player.charging = false;
        player.chargeTime = 0;
        player.chargeReady = false;
      }
    }

    function updatePlayer() {
      player.dy += player.gravity;
      const prevY = player.y;
      player.y += player.dy;
      if (state.stage === 2) {
        for (const platform of state.platforms) {
          if (player.dy >= 0 && prevY + player.height <= platform.y && player.y + player.height >= platform.y && player.x + player.width > platform.x + 8 && player.x < platform.x + platform.width - 8) {
            player.y = platform.y - player.height;
            player.dy = 0;
            player.jumpCount = 0;
          }
        }
      }
      if (player.y >= canvasHeight - groundHeight - player.height) {
        player.y = canvasHeight - groundHeight - player.height;
        player.dy = 0;
        player.jumpCount = 0;
      }

      player.x += player.vx;
      player.vx *= player.friction;
      if (Math.abs(player.vx) < 0.08) player.vx = 0;
      player.x = Math.max(10, Math.min(canvasWidth - player.width - 10, player.x));

      if (player.shootCooldown > 0) player.shootCooldown -= 1;
    }

    function updateObstacles() {
      state.obstacles.forEach(obs => {
        obs.x -= 3.5 + state.speed * 1.15;
        if (!obs.passed && obs.x + obs.width < 0) {
          obs.passed = true;
          state.passedObstacles += 1;
          state.score = state.passedObstacles;
          scoreEl.textContent = state.score;
          if (state.passedObstacles === state.obstaclesToPass) {
            state.door = {
              x: canvasWidth - 120,
              y: canvasHeight - groundHeight - 160,
              width: 80,
              height: 140,
              flash: 0,
            };
            state.hintText = '前往闪光大门进入第二关';
          }
        }
      });
      state.obstacles = state.obstacles.filter(obs => obs.x + obs.width > -40);
    }

    function updateEnemies() {
      state.enemies.forEach(enemy => {
        const prevY = enemy.y;
        enemy.x += enemy.vx;
        enemy.y += enemy.dy;
        enemy.dy += enemy.gravity;

        for (const platform of state.platforms) {
          if (enemy.dy >= 0 && prevY + enemy.height <= platform.y && enemy.y + enemy.height >= platform.y && enemy.x + enemy.width > platform.x + 6 && enemy.x < platform.x + platform.width - 6) {
            enemy.y = platform.y - enemy.height;
            enemy.dy = 0;
            enemy.canJump = true;
          }
        }

        if (enemy.y >= canvasHeight - groundHeight - enemy.height) {
          enemy.y = canvasHeight - groundHeight - enemy.height;
          enemy.dy = 0;
          enemy.canJump = true;
        }

        enemy.jumpTimer -= 1;
        if (enemy.jumpTimer <= 0 && enemy.canJump) {
          enemy.jumpTimer = 90 + Math.random() * 60;
          enemy.dy = -12 - Math.random() * 6;
          enemy.canJump = false;
        }

        if (enemy.type === 'red') {
          enemy.shootTimer -= 1;
          if (enemy.shootTimer <= 0) {
            enemy.shootTimer = 120 + Math.random() * 80;
            fireEnemyShot(enemy, -5, Math.random() * 2 - 1);
          }
        }
      });
      state.enemies = state.enemies.filter(enemy => enemy.x + enemy.width > -80 && enemy.alive);
    }

    function updateBoss() {
      if (!state.boss) return;
      const boss = state.boss;
      if (!boss.inDash) {
        boss.x += boss.dx;
        if (boss.x < canvasWidth - boss.width - 80) boss.dx = 0;
      } else {
        boss.x -= boss.dashSpeed;
      }

      boss.phaseTimer -= 1;
      if (boss.phaseTimer <= 0) {
        boss.phaseTimer = 140;
        boss.inDash = !boss.inDash;
      }

      boss.shootTimer -= 1;
      if (boss.shootTimer <= 0) {
        boss.shootTimer = 40;
        const shots = [
          {vx: -6, vy: 0},
          {vx: -5, vy: -2},
          {vx: -5, vy: 2},
        ];
        shots.forEach(s => fireEnemyShot(boss, s.vx, s.vy));
      }

      boss.dashTimer -= 1;
      if (boss.dashTimer <= 0) {
        boss.dashTimer = 220;
        boss.inDash = true;
        boss.dashSpeed = 10 + Math.random() * 4;
      }
    }

    function updatePlayerShots() {
      state.playerShots.forEach(shot => {
        shot.x += shot.vx;
      });
      state.playerShots = state.playerShots.filter(shot => shot.x < canvasWidth + 20);
    }

    function updateEnemyShots() {
      state.enemyShots.forEach(shot => {
        shot.x += shot.vx;
        shot.y += shot.vy;
      });
      state.enemyShots = state.enemyShots.filter(shot => shot.x > -20 && shot.x < canvasWidth + 20 && shot.y > 0 && shot.y < canvasHeight - groundHeight);
    }

    function rectOverlap(a, b) {
      return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
    }

    function pointCircleCollide(px, py, circle) {
      const dx = px - circle.x;
      const dy = py - circle.y;
      return dx * dx + dy * dy <= circle.radius * circle.radius;
    }

    function handleCollisions() {
      const playerBox = {x: player.x + 6, y: player.y + 8, width: player.width - 12, height: player.height - 10};

      if (state.stage === 1) {
        for (const obs of state.obstacles) {
          if (rectOverlap(playerBox, obs)) {
            endGame('游戏失败！被障碍物撞到了');
            return;
          }
        }
        if (state.door) {
          const doorBox = {x: state.door.x, y: state.door.y, width: state.door.width, height: state.door.height};
          if (rectOverlap(playerBox, doorBox)) {
            state.doorSequence = true;
            state.doorFlashTimer = 120;
            state.door = null;
            state.hintText = '传送门闪烁中...';
            playDoorMusic();
          }
        }
      }

      if (state.stage === 2) {
        for (const enemy of state.enemies) {
          if (rectOverlap(playerBox, enemy)) {
            endGame('游戏失败！被小怪碰到');
            return;
          }
        }
        if (state.boss && rectOverlap(playerBox, state.boss)) {
          endGame('游戏失败！被 Boss 撞到了');
          return;
        }
      }

      for (const shot of state.enemyShots) {
        if (pointCircleCollide(player.x + player.width/2, player.y + 20, shot)) {
          endGame('游戏失败！被敌人攻击命中');
          return;
        }
      }

      state.playerShots.forEach(shot => {
        state.enemies.forEach(enemy => {
          if (!enemy.alive) return;
          const enemyBox = {x: enemy.x, y: enemy.y, width: enemy.width, height: enemy.height};
          if (pointCircleCollide(shot.x, shot.y, {x: enemyBox.x + enemyBox.width/2, y: enemyBox.y + enemyBox.height/2, radius: enemy.width/2})) {
            enemy.hp -= shot.damage;
            shot.x = canvasWidth + 100;
            playEnemyHitSound();
            if (enemy.hp <= 0) {
              enemy.alive = false;
              state.score += 5;
              scoreEl.textContent = state.score;
              state.speed = Math.min(2.4, state.speed + 0.08);
              speedEl.textContent = state.speed.toFixed(1);
              if (state.score >= 55 && !state.boss) spawnBoss();
            }
          }
        });
        if (state.boss) {
          const bossBox = {x: state.boss.x, y: state.boss.y, width: state.boss.width, height: state.boss.height};
          if (pointCircleCollide(shot.x, shot.y, {x: bossBox.x + bossBox.width/2, y: bossBox.y + bossBox.height/2, radius: bossBox.width/2})) {
            state.boss.hp -= shot.damage;
            shot.x = canvasWidth + 100;
            playBossHitSound();
            if (state.boss.hp <= 0) {
              state.score += 20;
              scoreEl.textContent = state.score;
              winGame();
            }
          }
        }
      });
    }

    function drawScene() {
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);

      const skyGradient = ctx.createLinearGradient(0, 0, 0, canvasHeight);
      skyGradient.addColorStop(0, '#131b3a');
      skyGradient.addColorStop(1, '#05060c');
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      ctx.fillStyle = '#212740';
      ctx.fillRect(0, canvasHeight - groundHeight, canvasWidth, groundHeight);
      ctx.fillStyle = '#3a4767';
      ctx.fillRect(0, canvasHeight - groundHeight, canvasWidth, 8);

      if (state.stage === 1) {
        state.obstacles.forEach(obs => {
          ctx.fillStyle = '#d8753a';
          ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
          ctx.fillStyle = '#9d4b26';
          ctx.fillRect(obs.x, obs.y, obs.width, 8);
        });
      }
      if (state.stage === 2) {
        state.platforms.forEach(platform => {
          ctx.fillStyle = '#6a7cff';
          ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
          ctx.fillStyle = '#d5e0ff';
          ctx.fillRect(platform.x, platform.y, platform.width, 4);
        });
      }

      state.playerShots.forEach(shot => {
        ctx.fillStyle = shot.color || '#7cff9b';
        ctx.beginPath();
        ctx.arc(shot.x, shot.y, shot.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      state.enemyShots.forEach(shot => {
        ctx.fillStyle = shot.color;
        ctx.beginPath();
        ctx.arc(shot.x, shot.y, shot.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      state.enemies.forEach(enemy => {
        ctx.fillStyle = enemy.type === 'green' ? '#5edc5e' : '#ff6c6c';
        ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
        ctx.fillStyle = '#242424';
        ctx.fillRect(enemy.x + 10, enemy.y + 14, enemy.width - 20, 10);
        ctx.fillStyle = '#fff';
        ctx.fillRect(enemy.x + 12, enemy.y + 10, 8, 8);
        ctx.fillRect(enemy.x + enemy.width - 20, enemy.y + 10, 8, 8);
        if (enemy.type === 'red') {
          ctx.fillStyle = '#ffb1b1';
          ctx.fillRect(enemy.x + 14, enemy.y + enemy.height - 18, 18, 8);
        }
      });

      if (state.door) {
        const glow = 0.5 + 0.5 * Math.sin(Date.now() * 0.012);
        ctx.fillStyle = `rgba(82, 214, 255, ${0.18 + glow * 0.18})`;
        ctx.fillRect(state.door.x - 8, state.door.y - 8, state.door.width + 16, state.door.height + 16);
        ctx.fillStyle = '#5ae2ff';
        ctx.fillRect(state.door.x, state.door.y, state.door.width, state.door.height);
        ctx.fillStyle = '#ffffff';
        ctx.font = '18px Arial';
        ctx.fillText('门', state.door.x + state.door.width / 2 - 10, state.door.y + state.door.height / 2 + 8);
      }
      if (state.hintText) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(0, 0, canvasWidth, 46);
        ctx.fillStyle = '#b8f1ff';
        ctx.font = '18px Arial';
        ctx.fillText(state.hintText, 18, 30);
      }
      if (player.charging && state.stage === 2) {
        const chargeWidth = Math.min(1, player.chargeTime / 60) * 120;
        ctx.fillStyle = 'rgba(80, 220, 255, 0.6)';
        ctx.fillRect(player.x - 10, player.y - 18, chargeWidth, 8);
        ctx.strokeStyle = '#8df4ff';
        ctx.strokeRect(player.x - 10, player.y - 18, 120, 8);
        if (player.chargeReady) {
          ctx.fillStyle = '#ffd86a';
          ctx.fillText('蓄力完成', player.x - 10, player.y - 22);
        }
      }
      if (state.doorSequence) {
        const flashAmount = 0.15 + 0.25 * Math.sin(Date.now() * 0.04);
        ctx.fillStyle = `rgba(255,255,255,${flashAmount})`;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
      }
      if (state.boss) {
        ctx.fillStyle = '#a060ff';
        ctx.fillRect(state.boss.x, state.boss.y, state.boss.width, state.boss.height);
        ctx.fillStyle = '#581d95';
        ctx.fillRect(state.boss.x + 12, state.boss.y + 20, state.boss.width - 24, 16);
        ctx.fillStyle = '#fff';
        ctx.fillRect(state.boss.x + 18, state.boss.y + 40, 12, 12);
        ctx.fillRect(state.boss.x + state.boss.width - 30, state.boss.y + 40, 12, 12);
        ctx.fillStyle = '#ffeb3b';
        ctx.fillRect(state.boss.x + 42, state.boss.y + 78, 36, 14);
        ctx.fillStyle = '#fff';
        ctx.font = '14px Arial';
        ctx.fillText('BOSS', state.boss.x + 36, state.boss.y + 18);
        ctx.fillStyle = '#f77';
        ctx.fillRect(state.boss.x, state.boss.y - 12, state.boss.width * (state.boss.hp / 20), 8);
      }

      // Draw character scaled to player.height to avoid feet clipping
      const baseH = 86; // original design baseline
      const s = player.height / baseH;
      const headX = player.x + player.width / 2;
      const headY = player.y + Math.round(14 * s);
      const headR = Math.max(6, Math.round(12 * s));

      ctx.fillStyle = '#f9d9d1';
      ctx.beginPath();
      ctx.arc(headX, headY, headR, 0, Math.PI * 2);
      ctx.fill();

      // Hair (cute)
      ctx.fillStyle = '#ff8fbf';
      ctx.beginPath();
      ctx.arc(headX, player.y + Math.round(10 * s), Math.round(14 * s), Math.PI, 0, true);
      ctx.fill();
      ctx.fillStyle = '#ffd0e8';
      ctx.fillRect(player.x + Math.round(8 * s), player.y + Math.round(6 * s), Math.round(32 * s), Math.round(10 * s));
      ctx.fillStyle = '#fed8ea';
      ctx.fillRect(player.x + Math.round(18 * s), player.y + Math.round(4 * s), Math.round(8 * s), Math.round(8 * s));

      // Body
      ctx.fillStyle = '#ff8fbf';
      ctx.fillRect(player.x + Math.round(10 * s), player.y + Math.round(24 * s), Math.round(28 * s), Math.round(24 * s));
      ctx.fillStyle = '#ffe3f1';
      ctx.fillRect(player.x + Math.round(10 * s), player.y + Math.round(46 * s), Math.round(28 * s), Math.round(18 * s));
      ctx.fillStyle = '#fff6fb';
      ctx.fillRect(player.x + Math.round(14 * s), player.y + Math.round(30 * s), Math.round(20 * s), Math.round(10 * s));
      ctx.fillStyle = '#ffb9dc';
      ctx.fillRect(player.x + Math.round(8 * s), player.y + Math.round(48 * s), Math.round(6 * s), Math.round(6 * s));
      ctx.fillRect(player.x + Math.round(30 * s), player.y + Math.round(48 * s), Math.round(6 * s), Math.round(6 * s));

      // Legs and shoes (positioned relative to player.height)
      ctx.fillStyle = '#ff9bca';
      ctx.fillRect(player.x + Math.round(12 * s), player.y + Math.round(64 * s), Math.round(10 * s), Math.round(16 * s));
      ctx.fillRect(player.x + Math.round(26 * s), player.y + Math.round(64 * s), Math.round(10 * s), Math.round(16 * s));
      ctx.fillStyle = '#f15e9a';
      ctx.fillRect(player.x + Math.round(10 * s), player.y + Math.round(78 * s), Math.round(10 * s), Math.max(2, Math.round(6 * s)));
      ctx.fillRect(player.x + Math.round(28 * s), player.y + Math.round(78 * s), Math.round(10 * s), Math.max(2, Math.round(6 * s)));

      // Eyes and smile
      const eyeX = player.direction === 'left' ? headX - Math.round(5 * s) : headX + Math.round(1 * s);
      ctx.fillStyle = '#0c1430';
      ctx.fillRect(eyeX - Math.round(4 * s), headY - Math.round(4 * s), Math.max(2, Math.round(3 * s)), Math.max(2, Math.round(4 * s)));
      ctx.fillRect(eyeX + Math.round(2 * s), headY - Math.round(4 * s), Math.max(2, Math.round(3 * s)), Math.max(2, Math.round(4 * s)));
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(eyeX - Math.round(3 * s), headY - Math.round(3 * s), Math.max(1, Math.round(1 * s)), Math.max(1, Math.round(1 * s)));
      ctx.fillRect(eyeX + Math.round(3 * s), headY - Math.round(3 * s), Math.max(1, Math.round(1 * s)), Math.max(1, Math.round(1 * s)));
      ctx.strokeStyle = '#0c1430';
      ctx.lineWidth = Math.max(1, Math.round(2 * s));
      ctx.beginPath();
      ctx.moveTo(headX - Math.round(5 * s), headY + Math.round(5 * s));
      ctx.quadraticCurveTo(headX, headY + Math.round(8 * s), headX + Math.round(5 * s), headY + Math.round(5 * s));
      ctx.stroke();

      if (!state.active) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
      }
    }

    function gameLoop() {
      if (!state.active) return;
      handleInput();
      updatePlayer();
      if (state.stage === 1) updateObstacles();
      if (state.stage === 2) {
        updateEnemies();
        updateBoss();
      }
      updatePlayerShots();
      updateEnemyShots();
      handleCollisions();

      if (state.stage === 1) {
        if (state.doorSequence) {
          state.doorFlashTimer -= 1;
          if (state.doorFlashTimer <= 0) {
            startStage2();
            state.doorSequence = false;
            state.hintText = '';
          }
        } else {
          if (state.spawnTimer <= 0) {
            spawnObstacle();
            state.spawnTimer = state.spawnInterval;
          }
          state.spawnTimer -= 1 + state.speed * 0.2;
          state.speed = Math.min(2.4, state.speed + 0.0005);
          speedEl.textContent = state.speed.toFixed(1);
        }
      }

      if (state.stage === 2 && !state.boss) {
        if (state.spawnTimer <= 0) {
          spawnEnemy();
          state.spawnTimer = 140 - Math.min(40, state.speed * 12);
        }
        state.spawnTimer -= 1 + state.speed * 0.15;
      }

      drawScene();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', event => {
      const code = event.code;
      if (code === 'Space') {
        state.keys.Space = true;
        if (!state.active && state.messageMode !== 'end') {
          hideMessage();
          requestAnimationFrame(gameLoop);
        }
        if (!state.active && state.messageMode === 'end') {
          resetGame();
        }
      }
      if (code === 'KeyJ') {
        state.keys.KeyJ = true;
      }
      if (code in state.keys && code !== 'Space') {
        state.keys[code] = true;
      }
    });

    window.addEventListener('keyup', event => {
      const code = event.code;
      if (code === 'Space') state.keys.Space = false;
      if (code === 'KeyJ') {
        if (state.stage === 2 && player.charging && player.shootCooldown <= 0 && state.active) {
          const damage = player.chargeTime >= 18 ? 2 : 1;
          firePlayerShot(damage);
        }
        player.charging = false;
        player.chargeTime = 0;
        state.keys.KeyJ = false;
      }
      if (code in state.keys && code !== 'Space') {
        state.keys[code] = false;
      }
    });

    restartButton.addEventListener('click', () => {
      if (state.messageMode === 'end') {
        resetGame();
      } else {
        hideMessage();
        requestAnimationFrame(gameLoop);
      }
    });

    resetGame();
  </script>
</body>
</html>
