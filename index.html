<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>跳跃躲避障碍物</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at top, #2f2f5f, #09090f 68%);
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #gameContainer {
      position: relative;
      width: 900px;
      max-width: 100%;
      background: #12131b;
      border: 3px solid #4d5b7a;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 2 / 1; /* 固定显示比例，避免 HiDPI 设置时首帧高度跳动 */
      background: linear-gradient(180deg, #12131b, #050609);
      image-rendering: auto;
    }

    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      gap: 12px;
      flex-wrap: wrap;
      background: rgba(12, 16, 30, 0.96);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    #hud div {
      font-size: 16px;
      white-space: nowrap;
    }

    #hud span {
      color: #7fe9ff;
      font-weight: bold;
    }

    /* 开场片头：景星出品（全屏固定，覆盖加载过程，避免抖动） */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #2f2f5f, #09090f 68%);
    }
    #splash .brand {
      color: #eafaff;
      font-size: 44px;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-indent: 0.3em; /* 补偿字距，视觉居中 */
      text-shadow: 0 0 20px rgba(120,240,255,0.7), 0 0 44px rgba(120,240,255,0.32);
      opacity: 0;
      transform: translateY(12px);
      animation: brandIn 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) 0.25s forwards;
    }
    #splash .line {
      width: 0;
      height: 2px;
      margin-top: 18px;
      background: linear-gradient(90deg, transparent, #8df4ff, transparent);
      opacity: 0;
      animation: lineIn 1.0s ease 0.55s forwards;
    }
    #splash.done { opacity: 0; visibility: hidden; transition: opacity 0.5s ease; }
    @keyframes brandIn {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes lineIn {
      to { opacity: 0.9; width: 230px; }
    }

    #message {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: rgba(6, 10, 22, 0.9);
      color: #fff;
      font-size: 24px;
      text-align: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 9;
    }
    #message.show { opacity: 1; pointer-events: auto; }

    #message button {
      margin-top: 18px;
      padding: 12px 24px;
      border: none;
      background: linear-gradient(135deg, #2fa8ff, #1f6cff);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      border-radius: 10px;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 6px 18px rgba(31, 140, 255, 0.35);
    }

    #message button:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 10px 26px rgba(31, 140, 255, 0.5);
    }

    #instructions {
      margin-top: 16px;
      font-size: 14px;
      color: #b8c0e0;
      line-height: 1.6;
      max-width: 620px;
    }

    /* ===== 移动端触摸控制 ===== */
    html, body { overscroll-behavior: none; }
    canvas { touch-action: none; }

    #touchControls {
      display: none;
      position: absolute;
      left: 0; right: 0; bottom: 0;
      justify-content: space-between;
      align-items: flex-end;
      padding: 12px 16px 30px;
      box-sizing: border-box;
      pointer-events: none;
      z-index: 15;
    }
    #touchControls .pad { display: flex; align-items: flex-end; }
    #touchControls .pad.left { gap: 6px; }   /* 方向键紧邻，滑动即可切换，无空档 */
    #touchControls .pad.right { gap: 16px; }
    #touchControls .btn {
      pointer-events: auto;
      width: 86px; height: 86px;
      border-radius: 50%;
      border: 2px solid rgba(126,240,255,0.72);
      background: rgba(24,34,66,0.62);
      color: #eafaff;
      font-size: 34px;
      display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #touchControls .btn.active { background: rgba(90,210,255,0.85); transform: scale(0.9); }
    #touchControls .btn.jump { width: 108px; height: 108px; font-size: 44px; border-color: rgba(140,255,180,0.9); background: rgba(30,64,48,0.65); }
    #touchControls .btn.shoot { border-color: rgba(255,224,122,0.9); color: #ffe89a; }

    /* 横屏手机高度较小时，缩小按钮避免遮挡画面 */
    @media (max-height: 460px) {
      #touchControls { padding: 8px 14px 14px; }
      #touchControls .btn { width: 64px; height: 64px; font-size: 26px; }
      #touchControls .btn.jump { width: 82px; height: 82px; font-size: 34px; }
    }

    /* 竖屏建议横屏 */
    #rotateHint {
      display: none;
      position: fixed; inset: 0;
      background: #0a0c16;
      color: #cdefff;
      z-index: 50;
      flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 30px;
      font-size: 18px; line-height: 1.9;
    }
    #rotateHint .icon { font-size: 64px; margin-bottom: 16px; animation: roticon 2s ease-in-out infinite; }
    @keyframes roticon { 0%,100% { transform: rotate(0); } 50% { transform: rotate(90deg); } }

    @media (max-width: 820px) {
      body { align-items: flex-start; }
      #gameContainer { border-width: 0; border-radius: 0; width: 100%; }
      #hud div { font-size: 13px; }
      #instructions { font-size: 12px; }
    }

    /* 横屏手机：整体适配视口，画面完整显示（等比 contain，不溢出） */
    @media (orientation: landscape) and (max-height: 520px) {
      html, body { height: 100%; overflow: hidden; }
      body { align-items: center; }
      #gameContainer {
        width: 100vw; height: 100vh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        border: 0; border-radius: 0;
      }
      #hud { width: 100%; flex: 0 0 auto; padding: 6px 12px; }
      #hud div { font-size: 12px; }
      canvas {
        flex: 0 1 auto;
        min-height: 0;
        width: auto; height: auto;
        max-width: 100vw;
        max-height: calc(100vh - 40px);
        aspect-ratio: 2 / 1;
      }
    }
  </style>
</head>
<body>
  <div id="splash"><div class="brand">景星出品</div><div class="line"></div></div>
  <div id="gameContainer">
    <div id="hud">
      <div>玩家: 55</div>
      <div>关卡: <span id="stage">1</span></div>
      <div>得分: <span id="score">0</span></div>
      <div>最高分: <span id="bestScore">0</span></div>
      <div>护盾: <span id="shield">有</span></div>
      <div>速度: <span id="speed">1.0</span></div>
    </div>
    <canvas id="gameCanvas" width="900" height="450"></canvas>
    <div id="message">
      <div id="messageText">按空格开始游戏</div>
      <button id="restartButton">继续</button>
      <div id="instructions">
        电脑：A/D 移动，W/空格 跳跃，S 下蹲，J 蓄力射击（第二关）。<br>手机：使用屏幕左下移动、右下跳跃/下蹲/射击。
      </div>
    </div>
    <div id="touchControls">
      <div class="pad left">
        <button class="btn" id="btnLeft">◀</button>
        <button class="btn" id="btnRight">▶</button>
      </div>
      <div class="pad right">
        <button class="btn shoot" id="btnShoot">✦</button>
        <button class="btn" id="btnCrouch">▼</button>
        <button class="btn jump" id="btnJump">▲</button>
      </div>
    </div>
  </div>

  <div id="rotateHint">
    <div class="icon">📱</div>
    <div>请将手机横屏<br>以获得最佳游戏体验</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const speedEl = document.getElementById('speed');
    const message = document.getElementById('message');
    const messageText = document.getElementById('messageText');
    const restartButton = document.getElementById('restartButton');

    const canvasWidth = canvas.width;
    const canvasHeight = canvas.height;
    const groundHeight = 90;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // HiDPI：按屏幕像素密度提升画布实际分辨率，避免高分屏下发虚发糊
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = canvasWidth * dpr;
    canvas.height = canvasHeight * dpr;
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
    ctx.scale(dpr, dpr);
    ctx.imageSmoothingEnabled = true;

    const player = {
      x: 120,
      y: canvasHeight - groundHeight - 66,
      width: 44,
      height: 64,
      dy: 0,
      vx: 0,
      maxVx: 6.6,
      accel: 0.95,
      airAccel: 0.55,
      friction: 0.80,
      airFriction: 0.94,
      jumpPower: 16.5,
      gravity: 0.78,
      fallGravity: 1.15,
      lowJumpGravity: 1.7,
      jumpCount: 0,
      maxJumps: 1,
      crouching: false,
      shield: true,
      invuln: 0,
      direction: 'right',
      shootCooldown: 0,
      charging: false,
      chargeTime: 0,
      chargeReady: false,
      // 手感相关
      onGround: true,
      coyoteTimer: 0,
      coyoteMax: 8,
      jumpBuffer: 0,
      jumpBufferMax: 8,
      jumpHeld: false,
      // 表现相关
      squash: 1,
      stretch: 1,
      runPhase: 0,
      trail: [],
    };

    // Ensure initial y is aligned to player.height to avoid sinking into ground
    player.y = canvasHeight - groundHeight - player.height;

    const state = {
      score: 0,
      stage: 1,
      speed: 1,
      spawnTimer: 0,
      spawnInterval: 78,
      obstacles: [],
      platforms: [],
      enemies: [],
      playerShots: [],
      enemyShots: [],
      particles: [],
      stars: [],
      hills: [],
      groundScroll: 0,
      boss: null,
      obstaclesCreated: 0,
      passedObstacles: 0,
      obstaclesToPass: 55,
      door: null,
      doorSequence: false,
      doorFlashTimer: 0,
      hintText: '',
      bossMusic: null,
      active: false,
      bestScore: Number(localStorage.getItem('jumpDodgeBestScore') || 0),
      shakeTimer: 0,
      shakeStrength: 0,
      shakeBase: 0,
      intro: { active: false, t: 0, dur: 100, ring: 0, flash: 0, landed: false, goT: 0 },
      messageMode: 'start',
      keys: {
        Space: false,
        KeyA: false,
        KeyD: false,
        KeyJ: false,
        KeyS: false,
      },
      fallingObjects: [],
      fallTimer: 120,
    };

    /* ============================ 音效 ============================ */
    function playTone(freq, type = 'sine', duration = 0.1) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.02);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration + 0.02);
    }

    function playJumpSound() { playTone(520, 'triangle', 0.12); }
    function playDoubleJumpSound() { playTone(680, 'triangle', 0.12); }
    function playLandSound(impact = 0.5) {
      // 厚重的落地"咚"：低频下滑 + 冲击越大越响越低
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      const f = 190 + impact * 40;
      osc.frequency.setValueAtTime(f, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(55, audioCtx.currentTime + 0.13);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const vol = 0.12 + impact * 0.22;
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(vol, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.22);
      // 冲击较大时叠一层短促噪声"啪"，增加打击感
      if (impact > 0.45) playTone(90, 'triangle', 0.05);
    }
    function playShootSound() { playTone(760, 'square', 0.06); }
    function playChargeSound() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      osc.type = 'triangle';
      osc.frequency.value = 320;
      filter.type = 'lowpass';
      filter.frequency.value = 660;
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.16, audioCtx.currentTime + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.32);
    }
    function playChargeReleaseSound() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.22, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.24);
    }
    function playEnemyHitSound() { playTone(260, 'triangle', 0.08); }
    function playBossHitSound() { playTone(180, 'square', 0.1); }
    function playDoorMusic() {
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc1.type = 'triangle';
      osc2.type = 'sine';
      osc1.frequency.value = 520;
      osc2.frequency.value = 660;
      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.02);
      osc1.start();
      osc2.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
      osc1.stop(audioCtx.currentTime + 0.7);
      osc2.stop(audioCtx.currentTime + 0.7);
    }
    function playFailSound() { playTone(140, 'sawtooth', 0.22); }
    function playWinSound() { playTone(880, 'triangle', 0.18); }
    function playIntroWhoosh() {
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.4);
      osc.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.16, audioCtx.currentTime + 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
      osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    }
    function playIntroBurst() { playTone(660, 'triangle', 0.16); playTone(990, 'sine', 0.22); }

    /* ===== 开场动画 ===== */
    function startIntro() {
      if (state.stage !== 1) return; // 仅第一关播放开场
      const io = state.intro;
      io.active = true; io.t = 0; io.ring = 0; io.flash = 0; io.landed = false; io.goT = 0;
      // 保持在起点，与开始界面无缝衔接（不做位置跳变）
      player.x = 120; player.vx = 0; player.dy = 0;
      player.onGround = true; player.trail = [];
      player.squash = 1; player.stretch = 1;
      player.direction = 'right';
      state.particles = [];
    }

    function updateIntro() {
      const io = state.intro;
      io.t++;
      const cx = player.x + player.width / 2;
      const cy = player.y + player.height / 2;

      if (io.t < 26) {
        // 蓄力：能量向角色汇聚 + 轻微下蹲压扁
        player.squash += (1.16 - player.squash) * 0.18;
        player.stretch += (0.84 - player.stretch) * 0.18;
        if (io.t % 2 === 0) {
          const ang = Math.random() * Math.PI * 2;
          const dist = 55 + Math.random() * 40;
          state.particles.push({
            x: cx + Math.cos(ang) * dist, y: cy + Math.sin(ang) * dist,
            vx: -Math.cos(ang) * (2.6 + Math.random() * 1.6), vy: -Math.sin(ang) * (2.6 + Math.random() * 1.6),
            life: 18, maxLife: 20, size: 2.4, color: Math.random() < 0.5 ? '#8df4ff' : '#ffffff', gravity: 0
          });
        }
      } else if (io.t === 26) {
        // 蓄力完成 → 向上跃起亮相
        player.dy = -16; player.onGround = false;
        player.squash = 0.68; player.stretch = 1.38;
        playIntroWhoosh();
        spawnParticles(cx, canvasHeight - groundHeight, 16, {
          color: ['#8df4ff', '#ffffff'], angle: -Math.PI / 2, spread: Math.PI * 0.8, speedMin: 1.5, speedMax: 4, gravity: 0.1, life: 20, size: 2.5
        });
      }

      // 空中物理 + 拖尾
      if (!player.onGround) {
        player.dy += 0.82;
        player.y += player.dy;
        player.trail.unshift({ x: player.x, y: player.y });
        if (player.trail.length > 8) player.trail.pop();
        const groundY = canvasHeight - groundHeight - player.height;
        if (player.dy > 0 && player.y >= groundY && !io.landed) {
          player.y = groundY; player.dy = 0; player.onGround = true; io.landed = true;
          // 落地：冲击波环 + 闪白 + 粒子爆发
          io.ring = 0.01; io.flash = 0.9;
          player.squash = 1.42; player.stretch = 0.58; // 落地压扁（变宽变矮）
          addShake(10, 12);
          spawnParticles(cx, canvasHeight - groundHeight, 46, {
            color: ['#8df4ff', '#ffffff', '#b6fff0'], angle: -Math.PI / 2, spread: Math.PI,
            speedMin: 2, speedMax: 7.5, gravity: 0.12, life: 32, size: 3
          });
          // 全向彩色碎光迸发
          spawnParticles(cx, player.y + player.height / 2, 34, {
            color: ['#8df4ff', '#ffffff', '#ff9bd0', '#ffe07a'], speedMin: 3, speedMax: 9.5, gravity: 0.04, life: 36, size: 3
          });
          playIntroBurst();
        }
      }

      // squash / stretch 回弹
      player.squash += (1 - player.squash) * 0.18;
      player.stretch += (1 - player.stretch) * 0.18;

      if (io.ring > 0) io.ring += 0.06;
      if (io.flash > 0) io.flash -= 0.06;
      if (io.landed) io.goT++;

      updateParticles();
      updateBackground();

      // 落地后 GO! 播完，结束开场
      if (io.landed && io.goT >= 48) {
        io.active = false;
        player.trail = []; player.squash = 1; player.stretch = 1;
      }
    }

    function drawIntro() {
      const io = state.intro;
      if (!io.active) return;
      const cx = player.x + player.width / 2;
      // 跃起拖尾残影
      if (!player.onGround || (io.landed && io.goT < 6)) {
        for (let i = 1; i < player.trail.length; i++) {
          const tp = player.trail[i];
          ctx.save();
          ctx.globalAlpha = 0.16 * (1 - i / player.trail.length);
          ctx.fillStyle = '#4fe3ff';
          ctx.fillRect(tp.x + 8, tp.y + 8, player.width - 16, player.height - 12);
          ctx.restore();
        }
      }
      // 落地冲击波环
      if (io.ring > 0 && io.ring < 4) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - io.ring / 4);
        ctx.strokeStyle = '#8df4ff';
        ctx.lineWidth = 4;
        ctx.shadowBlur = 20; ctx.shadowColor = '#8df4ff';
        ctx.beginPath(); ctx.arc(cx, canvasHeight - groundHeight, io.ring * 55, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
      // GO! 文字（霓虹斜体 + 速度线，弹入放大后淡出）
      if (io.landed) {
        const gt = io.goT;
        const bx = canvasWidth / 2, by = canvasHeight / 2 - 10;
        // 中心径向光爆
        if (gt < 16) {
          const ga = Math.max(0, 1 - gt / 16);
          const rr = gt * 22 + 10;
          const bg = ctx.createRadialGradient(bx, by, 0, bx, by, rr);
          bg.addColorStop(0, `rgba(190,250,255,${0.55 * ga})`);
          bg.addColorStop(0.55, `rgba(120,220,255,${0.22 * ga})`);
          bg.addColorStop(1, 'rgba(120,220,255,0)');
          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, canvasWidth, canvasHeight);
        }
        // 旋转放射光芒
        if (gt < 26) {
          const ga = Math.max(0, 1 - gt / 26);
          ctx.save();
          ctx.translate(bx, by);
          ctx.rotate(gt * 0.05);
          ctx.strokeStyle = `rgba(140,244,255,${0.4 * ga})`;
          ctx.lineWidth = 3;
          for (let i = 0; i < 10; i++) {
            const a = i * Math.PI / 5;
            const r1 = 44, r2 = 80 + gt * 3;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
            ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
            ctx.stroke();
          }
          ctx.restore();
        }
        const gp = Math.min(1, gt / 12);
        const pop = 1 - Math.pow(1 - gp, 3); // 弹入缓动
        const scale = 0.5 + pop * 0.7 + Math.max(0, gt - 30) * 0.02;
        const alpha = gt < 30 ? 1 : Math.max(0, 1 - (gt - 30) / 16);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(canvasWidth / 2, canvasHeight / 2 - 10);
        ctx.scale(scale, scale);
        ctx.transform(1, 0, -0.2, 1, 0, 0); // 斜切，营造速度感
        ctx.textAlign = 'center';
        ctx.font = 'italic 900 88px Arial';
        ctx.lineJoin = 'round';

        // 背后速度线
        ctx.strokeStyle = 'rgba(140,244,255,0.55)';
        for (let i = 0; i < 3; i++) {
          const ly = -20 + i * 18;
          ctx.lineWidth = 5 - i;
          ctx.beginPath();
          ctx.moveTo(-165 - i * 22, ly);
          ctx.lineTo(-72, ly);
          ctx.stroke();
        }

        // 深色粗描边（立体感）
        ctx.strokeStyle = '#0a1030';
        ctx.lineWidth = 13;
        ctx.strokeText('GO!', 0, 0);
        // 霓虹发光描边
        ctx.shadowBlur = 30; ctx.shadowColor = '#4fe3ff';
        ctx.strokeStyle = '#4fe3ff';
        ctx.lineWidth = 4;
        ctx.strokeText('GO!', 0, 0);
        // 渐变填充
        ctx.shadowBlur = 0;
        const grd = ctx.createLinearGradient(0, -56, 0, 32);
        grd.addColorStop(0, '#ffffff');
        grd.addColorStop(0.5, '#8df4ff');
        grd.addColorStop(1, '#57a8ff');
        ctx.fillStyle = grd;
        ctx.fillText('GO!', 0, 0);
        // 顶部高光
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.font = 'italic 900 88px Arial';

        ctx.restore();
        ctx.textAlign = 'left';
      }
      // 落地闪白
      if (io.flash > 0) {
        ctx.fillStyle = `rgba(255,255,255,${io.flash})`;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
      }
    }

    function enterPlay() {
      const wasStart = state.messageMode === 'start';
      hideMessage();
      if (wasStart) startIntro();
      startLoop();
    }

    /* ==================== 背景 & 粒子系统 ==================== */
    function initBackground() {
      state.stars = [];
      for (let i = 0; i < 110; i++) {
        state.stars.push({
          x: Math.random() * canvasWidth,
          y: Math.random() * (canvasHeight - groundHeight),
          r: Math.random() * 1.6 + 0.4,
          speed: Math.random() * 0.5 + 0.1,
          twinkle: Math.random() * Math.PI * 2,
          bright: Math.random() < 0.16, // 亮星带十字光芒
        });
      }
      // 漂浮光尘（氛围）
      state.motes = [];
      for (let i = 0; i < 24; i++) {
        state.motes.push({
          x: Math.random() * canvasWidth,
          y: Math.random() * (canvasHeight - groundHeight),
          r: Math.random() * 2 + 1,
          sp: Math.random() * 0.4 + 0.15,
          drift: Math.random() * Math.PI * 2,
          hue: Math.random() < 0.5 ? '140,240,255' : '180,150,255',
        });
      }
      // 流星
      state.meteors = [];
      state.meteorTimer = 100;
      // 远景城市剪影
      state.city = [];
      let bx = 0;
      while (bx < canvasWidth + 60) {
        const w = 24 + Math.random() * 40;
        const h = 26 + Math.random() * 88;
        state.city.push({ x: bx, w, h, win: Math.floor(Math.random() * 3) });
        bx += w + 6 + Math.random() * 22;
      }
      state.cityOffset = 0;
      const layers = [
        { color: '#171f45', speed: 0.35, amp: 40, base: canvasHeight - groundHeight + 14, step: 170 },
        { color: '#212a5c', speed: 0.7, amp: 30, base: canvasHeight - groundHeight + 8, step: 130 },
        { color: '#2c3878', speed: 1.15, amp: 22, base: canvasHeight - groundHeight + 4, step: 100 },
      ];
      state.hills = layers.map(l => ({ ...l, offset: 0 }));
    }

    function spawnParticles(x, y, count, opts = {}) {
      const colors = Array.isArray(opts.color) ? opts.color : [opts.color || '#8df4ff'];
      const spread = opts.spread != null ? opts.spread : Math.PI * 2;
      const baseAngle = opts.angle != null ? opts.angle : 0;
      const speedMin = opts.speedMin != null ? opts.speedMin : 1;
      const speedMax = opts.speedMax != null ? opts.speedMax : 3;
      const life = opts.life != null ? opts.life : 24;
      for (let i = 0; i < count; i++) {
        const ang = opts.angle != null ? baseAngle + (Math.random() - 0.5) * spread : Math.random() * Math.PI * 2;
        const sp = speedMin + Math.random() * (speedMax - speedMin);
        state.particles.push({
          x, y,
          vx: Math.cos(ang) * sp + (opts.vx || 0),
          vy: Math.sin(ang) * sp + (opts.vy || 0),
          life: life + Math.random() * (life * 0.4),
          maxLife: life * 1.4,
          size: (opts.size || 3) * (0.6 + Math.random() * 0.7),
          color: colors[Math.floor(Math.random() * colors.length)],
          gravity: opts.gravity != null ? opts.gravity : 0.15,
        });
      }
    }

    function updateParticles() {
      for (const p of state.particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= 0.98;
        p.life -= 1;
      }
      state.particles = state.particles.filter(p => p.life > 0);
    }

    function updateBackground() {
      const spd = 1 + state.speed;
      for (const s of state.stars) {
        s.x -= s.speed * spd * 0.35;
        if (s.x < -2) { s.x = canvasWidth + 2; s.y = Math.random() * (canvasHeight - groundHeight); }
        s.twinkle += 0.05;
      }
      for (const m of state.motes) {
        m.x -= m.sp * spd * 0.5;
        m.drift += 0.02;
        m.y += Math.sin(m.drift) * 0.3;
        if (m.x < -4) { m.x = canvasWidth + 4; m.y = Math.random() * (canvasHeight - groundHeight); }
      }
      // 城市视差滚动
      const totalCity = canvasWidth + 60;
      state.cityOffset -= 0.5 * spd;
      if (state.cityOffset <= -totalCity) state.cityOffset += totalCity;
      // 流星
      state.meteorTimer -= 1;
      if (state.meteorTimer <= 0) {
        state.meteorTimer = 160 + Math.random() * 260;
        // 只在高空掠过：起点在天顶附近，近乎水平、缓慢，像遥远星尘
        state.meteors.push({
          x: canvasWidth * (0.35 + Math.random() * 0.6), y: 8 + Math.random() * 26,
          vx: -(3 + Math.random() * 2), vy: 0.5 + Math.random() * 0.7, life: 55,
        });
      }
      for (const me of state.meteors) { me.x += me.vx; me.y += me.vy; me.life -= 1; }
      // 限制在上部天空区域，绝不进入玩家活动区，避免误认为攻击
      state.meteors = state.meteors.filter(me => me.life > 0 && me.y < canvasHeight * 0.32);
      for (const h of state.hills) {
        h.offset -= h.speed * spd;
        if (h.offset <= -h.step) h.offset += h.step;
      }
      state.groundScroll -= (3 + state.speed * 2);
    }

    /* ============================ 界面 ============================ */
    function showMessage(text, buttonText = '继续', mode = 'info') {
      messageText.textContent = text;
      restartButton.textContent = buttonText;
      // 片头进行中时先不显示，交给片头结束后浮现，实现“渐渐浮现”
      if (!(typeof splashActive !== 'undefined' && splashActive)) {
        message.classList.add('show');
      }
      state.active = false;
      state.messageMode = mode;
    }

    function hideMessage() {
      message.classList.remove('show'); // 平滑淡出，衔接开场动画
      state.active = true;
      if (state.stage === 2 && state.messageMode === 'stage2') {
        state.messageMode = 'playing';
      }
    }

    function resetPlayerFeel() {
      player.onGround = true;
      player.coyoteTimer = 0;
      player.jumpBuffer = 0;
      player.jumpHeld = false;
      player.squash = 1;
      player.stretch = 1;
      player.runPhase = 0;
      player.trail = [];
      player.crouching = false;
    }

    function resetGame() {
      if (!state.stars.length) initBackground();
      state.stage = 1;
      state.score = 0;
      state.speed = 1;
      state.spawnTimer = 0;
      state.spawnInterval = 90;
      state.obstacles = [];
      state.enemies = [];
      state.playerShots = [];
      state.enemyShots = [];
      state.particles = [];
      state.fallingObjects = [];
      state.fallTimer = 120;
      state.boss = null;
      state.obstaclesCreated = 0;
      state.passedObstacles = 0;
      state.door = null;
      state.doorSequence = false;
      state.doorFlashTimer = 0;
      state.hintText = '';
      state.platforms = [];
      state.shakeTimer = 0;
      stopBossMusic();
      player.x = 120;
      player.y = canvasHeight - groundHeight - player.height;
      player.dy = 0;
      player.vx = 0;
      player.jumpCount = 0;
      player.maxJumps = 1;
      player.direction = 'right';
      player.shootCooldown = 0;
      player.charging = false;
      player.chargeTime = 0;
      player.shield = true;
      player.invuln = 0;
      document.getElementById('shield').textContent = '有';
      resetPlayerFeel();
      scoreEl.textContent = state.score;
      speedEl.textContent = state.speed.toFixed(1);
      document.getElementById('stage').textContent = state.stage;
      document.getElementById('bestScore').textContent = state.bestScore;
      { const bs = document.getElementById('btnShoot'); if (bs) bs.style.display = 'none'; } // 第一关不需要射击
      showMessage('按空格开始游戏', '开始', 'start');
      drawScene();
    }

    function updateBestScore() {
      if (state.score > state.bestScore) {
        state.bestScore = state.score;
        localStorage.setItem('jumpDodgeBestScore', state.bestScore);
      }
    }

    function createBossMusic() {
      if (state.bossMusic) return;
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const lfo = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();
      osc1.type = 'triangle';
      osc2.type = 'sawtooth';
      osc1.frequency.value = 100;
      osc2.frequency.value = 140;
      filter.type = 'lowpass';
      filter.frequency.value = 520;
      filter.Q.value = 12;
      lfo.type = 'sine';
      lfo.frequency.value = 0.45;
      lfo.connect(filter.frequency);
      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.5);
      osc1.start();
      osc2.start();
      lfo.start();
      state.bossMusic = {osc1, osc2, lfo, filter, gain};
    }

    function stopBossMusic() {
      if (!state.bossMusic) return;
      const {osc1, osc2, lfo, gain} = state.bossMusic;
      gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
      osc1.stop(audioCtx.currentTime + 0.5);
      osc2.stop(audioCtx.currentTime + 0.5);
      lfo.stop(audioCtx.currentTime + 0.5);
      state.bossMusic = null;
    }

    function addShake(strength, time) {
      state.shakeStrength = Math.max(state.shakeStrength, strength);
      state.shakeTimer = Math.max(state.shakeTimer, time);
      state.shakeBase = Math.max(state.shakeBase, time);
    }

    function endGame(text) {
      stopBossMusic();
      state.active = false;
      updateBestScore();
      document.getElementById('bestScore').textContent = state.bestScore;
      // 死亡爆裂粒子
      spawnParticles(player.x + player.width / 2, player.y + player.height / 2, 30, {
        color: ['#ff6d6d', '#ffd86a', '#ffffff'], speedMin: 2, speedMax: 6, gravity: 0.2, life: 34, size: 4
      });
      addShake(10, 16);
      drawScene();
      showMessage(text, '重新开始', 'end');
      playFailSound();
    }

    function playShieldBreakSound() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(680, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.25);
      osc.connect(gain); gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.22, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    // 受到致命伤害：有护盾则抵挡一次（破盾 + 短暂无敌），否则结束游戏
    function takeDamage(reason) {
      if (player.invuln > 0) return;
      if (player.shield) {
        player.shield = false;
        player.invuln = 70;
        document.getElementById('shield').textContent = '无';
        playShieldBreakSound();
        addShake(6, 10);
        spawnParticles(player.x + player.width / 2, player.y + player.height / 2, 26, {
          color: ['#7ef0ff', '#ffffff', '#b6fff0'], speedMin: 2, speedMax: 5.5, gravity: 0.05, life: 28, size: 3
        });
        return;
      }
      endGame(reason);
    }

    function winGame() {
      stopBossMusic();
      updateBestScore();
      document.getElementById('bestScore').textContent = state.bestScore;
      playWinSound();
      drawScene();
      showMessage('恭喜！玩家55 击败 Boss，游戏结束', '重新开始', 'end');
    }

    function startStage2() {
      state.stage = 2;
      state.score = 0;
      state.speed = 1.1;
      state.spawnTimer = 90; // 开局缓冲，避免一进关就被围
      state.spawnInterval = 90;
      state.obstacles = [];
      state.platforms = [
        { x: 250, y: canvasHeight - groundHeight - 96, width: 150, height: 14 },
        { x: 540, y: canvasHeight - groundHeight - 168, width: 140, height: 14 },
      ];
      state.enemies = [];
      state.playerShots = [];
      state.enemyShots = [];
      state.boss = null;
      state.obstaclesCreated = 0;
      state.passedObstacles = 0;
      state.door = null;
      state.doorSequence = false;
      state.doorFlashTimer = 0;
      state.hintText = '';
      player.x = 28;
      player.y = canvasHeight - groundHeight - player.height;
      player.jumpCount = 0;
      player.maxJumps = 2;
      resetPlayerFeel();
      document.getElementById('stage').textContent = state.stage;
      scoreEl.textContent = state.score;
      speedEl.textContent = state.speed.toFixed(1);
      { const bs = document.getElementById('btnShoot'); if (bs) bs.style.display = 'flex'; } // 第二关显示射击键
      showMessage('第二关开启！可二段跳，按 J 蓄力射击。按空格继续', '进入第二关', 'stage2');
    }

    /* ============================ 生成 ============================ */
    function spawnObstacle() {
      if (state.stage !== 1) return;
      if (state.obstaclesCreated >= state.obstaclesToPass) return;
      const r = Math.random();
      let type, width, height, y;
      if (r < 0.4) {
        type = 'block';
        width = 34 + Math.random() * 24;
        height = 40 + Math.random() * 30;
        y = canvasHeight - groundHeight - height;
      } else if (r < 0.62) {
        type = 'tall';
        width = 30 + Math.random() * 16;
        height = 74 + Math.random() * 34;
        y = canvasHeight - groundHeight - height;
      } else if (r < 0.82) {
        type = 'spike';
        width = 40 + Math.random() * 30;
        height = 30 + Math.random() * 22;
        y = canvasHeight - groundHeight - height;
      } else {
        type = 'floating';
        height = 36 + Math.random() * 26;
        width = 62 + Math.random() * 40;
        const gap = 30 + Math.random() * 10; // 低压顶障碍：站着/跳起会撞，必须下蹲通过
        y = canvasHeight - groundHeight - gap - height;
      }
      state.obstacles.push({ x: canvasWidth + 40, y, width, height, type, passed: false });
      state.obstaclesCreated += 1;
    }

    function spawnEnemy() {
      if (state.stage !== 2 || state.boss) return;
      const r = Math.random();
      let type;
      if (r < 0.38) type = 'green';
      else if (r < 0.62) type = 'red';
      else if (r < 0.83) type = 'flyer';
      else type = 'charger';
      const enemy = {
        x: canvasWidth + 60,
        width: 46,
        height: 52,
        dy: 0,
        gravity: 0.85,
        jumpTimer: 0,
        canJump: true,
        type,
        hp: 2,
        alive: true,
        blink: 0,
        phase: 'move',
        skillTimer: 0,
        pulse: Math.random() * Math.PI * 2,
        trail: [],
      };
      if (type === 'green') {
        enemy.width = 44; enemy.height = 48;
        enemy.y = canvasHeight - groundHeight - enemy.height;
        enemy.vx = -(2 + state.speed * 0.25);
        enemy.hp = 2;
      } else if (type === 'red') {
        enemy.height = 52;
        enemy.y = canvasHeight - groundHeight - enemy.height;
        enemy.vx = -(1.8 + state.speed * 0.2);
        enemy.hp = 2;
        enemy.skillTimer = 120 + Math.random() * 60;
      } else if (type === 'flyer') {
        enemy.width = 44; enemy.height = 40;
        enemy.baseY = 80 + Math.random() * 120;
        enemy.y = enemy.baseY;
        enemy.vx = -(2.6 + state.speed * 0.35);
        enemy.gravity = 0;
        enemy.floatPhase = Math.random() * Math.PI * 2;
        enemy.floatAmp = 18 + Math.random() * 30;
        enemy.hp = 1;
        enemy.skillTimer = 90 + Math.random() * 60;
      } else { // charger
        enemy.width = 46; enemy.height = 44;
        enemy.y = canvasHeight - groundHeight - enemy.height;
        enemy.vx = -(3 + state.speed * 0.3);
        enemy.hp = 3;
        enemy.phase = 'run';
        enemy.skillTimer = 70 + Math.random() * 40;
      }
      state.enemies.push(enemy);
    }

    function spawnBoss() {
      state.boss = {
        x: canvasWidth + 80,
        y: 70,
        width: 120,
        height: 120,
        hp: 26,
        maxHp: 26,
        phaseTimer: 120,
        shootTimer: 60,
        dashTimer: 180,
        dashSpeed: 11,
        inDash: false,
        dir: -1,        // 巡逻方向
        dashDir: -1,    // 冲刺方向
        patrolSpeed: 2.4,
        entering: true,
        entryTimer: 80,
        minX: 70,
        maxX: canvasWidth - 170, // 更大的左右活动范围
        hitTimer: 0,
        particles: [],
      };
      createBossMusic();
      showMessage('警告：Boss来袭！按空格继续战斗', '挑战 Boss', 'boss');
    }

    function firePlayerShot(damage, charged = false) {
      if (player.shootCooldown > 0) return;
      const dir = player.direction === 'left' ? -1 : 1;
      const muzzleX = player.x + player.width / 2 + dir * (player.width / 2 + 4);
      const shot = {
        x: muzzleX,
        y: player.y + 24,
        vx: (charged ? 16 : 11) * dir,
        vy: 0,
        radius: charged ? 20 : 6,
        damage,
        color: charged ? '#7effff' : '#7cff9b',
        charged,
        spin: 0,
      };
      state.playerShots.push(shot);
      player.shootCooldown = charged ? 26 : 14;
      // 枪口粒子（朝射击方向喷发）
      spawnParticles(muzzleX, shot.y, charged ? 20 : 5, {
        color: charged ? ['#7effff', '#ffffff', '#b6fff0'] : ['#7cff9b', '#ffffff'],
        angle: dir > 0 ? 0 : Math.PI, spread: charged ? 1.1 : 0.6,
        speedMin: 1, speedMax: charged ? 5 : 3, gravity: 0, life: charged ? 18 : 12, size: charged ? 3.5 : 2
      });
      if (charged) { playChargeReleaseSound(); addShake(7, 10); }
      else playShootSound();
    }

    function fireEnemyShot(enemy, vx, vy = 0, color = '#fc5e5e', homing = 0) {
      state.enemyShots.push({
        x: enemy.x,
        y: enemy.y + enemy.height / 2,
        vx,
        vy,
        radius: 6,
        color,
        homing,
      });
    }

    /* ============================ 输入 ============================ */
    function handleInput() {
      if (!state.active) return;

      // 跳跃：缓冲 + 土狼时间 + 二段跳
      if (player.jumpBuffer > 0) {
        const canGroundJump = player.onGround || player.coyoteTimer > 0;
        if (canGroundJump) {
          player.dy = -player.jumpPower;
          player.jumpCount = 1;
          player.onGround = false;
          player.coyoteTimer = 0;
          player.jumpBuffer = 0;
          player.squash = 0.7; player.stretch = 1.35;
          playJumpSound();
          spawnParticles(player.x + player.width / 2, player.y + player.height, 10, {
            color: ['#8df4ff', '#ffffff'], angle: Math.PI / 2, spread: Math.PI * 0.7,
            speedMin: 1, speedMax: 3, gravity: 0.12, life: 18, size: 2.5
          });
        } else if (player.jumpCount < player.maxJumps) {
          player.dy = -player.jumpPower * 0.92;
          player.jumpCount += 1;
          player.jumpBuffer = 0;
          player.squash = 0.72; player.stretch = 1.3;
          playDoubleJumpSound();
          // 二段跳空中环形气浪
          spawnParticles(player.x + player.width / 2, player.y + player.height / 2, 14, {
            color: ['#8df4ff', '#7cff9b', '#ffffff'], angle: Math.PI / 2, spread: Math.PI,
            speedMin: 1.5, speedMax: 3.5, gravity: 0.04, life: 22, size: 2.5
          });
        }
      }

      // 下蹲：仅地面有效，下蹲时移动减速
      player.crouching = state.keys.KeyS && player.onGround;

      const accel = (player.onGround ? player.accel : player.airAccel) * (player.crouching ? 0.55 : 1);
      if (state.keys.KeyA) {
        player.vx -= accel;
        player.direction = 'left';
      }
      if (state.keys.KeyD) {
        player.vx += accel;
        player.direction = 'right';
      }

      player.vx = Math.max(-player.maxVx, Math.min(player.maxVx, player.vx));

      if (state.stage === 2 && state.keys.KeyJ) {
        if (!player.charging) {
          player.charging = true;
          player.chargeTime = 0;
          player.chargeReady = false;
        } else {
          player.chargeTime += 1;
          if (player.chargeTime === 55) {
            player.chargeReady = true;
            playChargeSound();
          }
        }
      } else if (state.stage !== 2) {
        player.charging = false;
        player.chargeTime = 0;
        player.chargeReady = false;
      }
    }

    /* ============================ 更新 ============================ */
    function updatePlayer() {
      if (player.jumpBuffer > 0) player.jumpBuffer -= 1;
      if (player.invuln > 0) player.invuln -= 1;
      if (player.coyoteTimer > 0) player.coyoteTimer -= 1;

      // 可变重力：上升松手减速快（短跳），下落更干脆（更好的平台手感）
      let g = player.gravity;
      if (player.dy > 0) g = player.fallGravity;
      else if (player.dy < 0 && !player.jumpHeld) g = player.lowJumpGravity;
      player.dy += g;
      if (player.dy > 20) player.dy = 20;

      const prevY = player.y;
      const fallSpeed = player.dy; // 落地前的下落速度，用于计算冲击强度
      player.y += player.dy;
      const wasOnGround = player.onGround;
      player.onGround = false;

      if (state.stage === 2) {
        for (const platform of state.platforms) {
          if (player.dy >= 0 && prevY + player.height <= platform.y && player.y + player.height >= platform.y && player.x + player.width > platform.x + 8 && player.x < platform.x + platform.width - 8) {
            player.y = platform.y - player.height;
            player.dy = 0;
            player.jumpCount = 0;
            player.onGround = true;
          }
        }
      }
      if (player.y >= canvasHeight - groundHeight - player.height) {
        player.y = canvasHeight - groundHeight - player.height;
        player.dy = 0;
        player.jumpCount = 0;
        player.onGround = true;
      }

      if (player.onGround) {
        player.coyoteTimer = player.coyoteMax;
        if (!wasOnGround) {
          // 冲击强度：下落越快，震动/压扁/尘土越强（0~1）
          const impact = Math.min(1, Math.max(0, fallSpeed / 15));
          player.squash = 1.3 + impact * 0.3;   // 落地压扁：变宽
          player.stretch = 0.76 - impact * 0.2;  // 落地压扁：变矮
          // 向上扬起的尘土
          const dust = Math.round(10 + impact * 18);
          spawnParticles(player.x + player.width / 2, player.y + player.height, dust, {
            color: ['#c9d4ff', '#ffffff'], angle: -Math.PI / 2, spread: Math.PI * 0.95,
            speedMin: 1, speedMax: 2.5 + impact * 4.5, gravity: 0.24, life: 20 + impact * 14, size: 2.6
          });
          // 向左右扩散的冲击波尘土（冲击越大越明显）
          const wave = Math.round(impact * 12);
          spawnParticles(player.x + player.width / 2, player.y + player.height, wave, {
            color: ['#aeb8e0', '#ffffff'], angle: 0, spread: 0.35, speedMin: 3 + impact * 3, speedMax: 6 + impact * 5, gravity: 0.22, life: 18, size: 2.2
          });
          spawnParticles(player.x + player.width / 2, player.y + player.height, wave, {
            color: ['#aeb8e0', '#ffffff'], angle: Math.PI, spread: 0.35, speedMin: 3 + impact * 3, speedMax: 6 + impact * 5, gravity: 0.22, life: 18, size: 2.2
          });
          playLandSound(impact);
        }
      }

      player.x += player.vx;
      player.vx *= player.onGround ? player.friction : player.airFriction;
      if (Math.abs(player.vx) < 0.08) player.vx = 0;
      player.x = Math.max(10, Math.min(canvasWidth - player.width - 10, player.x));

      // 跑步相位 + 跑动尘土
      if (player.onGround && Math.abs(player.vx) > 0.6) {
        player.runPhase += Math.abs(player.vx) * 0.05;
        if (Math.random() < 0.22) {
          spawnParticles(player.x + player.width / 2 - player.vx * 2, player.y + player.height - 2, 1, {
            color: ['#9fb0e0', '#c9d4ff'], angle: Math.PI, spread: 0.8,
            vx: -player.vx * 0.25, speedMin: 0.3, speedMax: 1, gravity: 0.05, life: 16, size: 2
          });
        }
      } else {
        player.runPhase *= 0.8;
      }

      // squash & stretch 回弹
      player.squash += (1 - player.squash) * 0.2;
      player.stretch += (1 - player.stretch) * 0.2;

      // 拖尾记录
      player.trail.unshift({ x: player.x, y: player.y });
      if (player.trail.length > 6) player.trail.pop();

      if (player.shootCooldown > 0) player.shootCooldown -= 1;
    }

    function updateObstacles() {
      state.obstacles.forEach(obs => {
        obs.x -= 5.5 + state.speed * 1.6;
        if (!obs.passed && obs.x + obs.width < 0) {
          obs.passed = true;
          state.passedObstacles += 1;
          state.score = state.passedObstacles;
          scoreEl.textContent = state.score;
          if (state.passedObstacles === state.obstaclesToPass) {
            state.door = {
              x: canvasWidth - 120,
              y: canvasHeight - groundHeight - 160,
              width: 80,
              height: 140,
              flash: 0,
            };
            state.hintText = '前往闪光大门进入第二关';
          }
        }
      });
      state.obstacles = state.obstacles.filter(obs => obs.x + obs.width > -40);
    }

    /* ==================== 天降坠落物（需左右躲避） ==================== */
    function spawnFalling() {
      const targetX = Math.max(20, Math.min(canvasWidth - 60, player.x + player.vx * 6 + (Math.random() - 0.5) * 70));
      state.fallingObjects.push({
        x: targetX, y: -44, width: 36, height: 36,
        phase: 'warn', timer: 42, vy: 0,
      });
    }

    function updateFalling() {
      state.fallingObjects.forEach(o => {
        if (o.phase === 'warn') {
          o.timer -= 1;
          if (o.timer <= 0) { o.phase = 'fall'; o.vy = 3.5; o.y = -44; }
        } else if (o.phase === 'fall') {
          o.vy += 0.4;
          o.y += o.vy;
          if (o.y + o.height >= canvasHeight - groundHeight) {
            o.phase = 'done';
            spawnParticles(o.x + o.width / 2, canvasHeight - groundHeight, 18, {
              color: ['#ffb060', '#ff5b5b', '#ffffff'], angle: -Math.PI / 2, spread: Math.PI,
              speedMin: 2, speedMax: 5.5, gravity: 0.3, life: 22, size: 3
            });
          }
        }
      });
      state.fallingObjects = state.fallingObjects.filter(o => o.phase !== 'done');
    }

    function drawFalling() {
      const gy = canvasHeight - groundHeight;
      state.fallingObjects.forEach(o => {
        const cxo = o.x + o.width / 2;
        if (o.phase === 'warn') {
          const blink = 0.35 + 0.45 * Math.sin(Date.now() * 0.02);
          ctx.save();
          ctx.strokeStyle = `rgba(255,80,80,${blink})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(cxo, gy - 3, o.width * 0.7, 8, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = `rgba(255,80,80,${blink * 0.32})`;
          ctx.beginPath();
          ctx.ellipse(cxo, gy - 3, o.width * 0.7, 8, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          // 顶部下落警示三角
          ctx.fillStyle = `rgba(255,90,90,${blink})`;
          ctx.beginPath();
          ctx.moveTo(cxo - 8, 8);
          ctx.lineTo(cxo + 8, 8);
          ctx.lineTo(cxo, 22);
          ctx.closePath(); ctx.fill();
        } else if (o.phase === 'fall') {
          ctx.save();
          ctx.shadowBlur = 16; ctx.shadowColor = '#ff7b30';
          // 火焰尾
          ctx.fillStyle = '#ffce6a';
          ctx.beginPath();
          ctx.moveTo(o.x + 4, o.y);
          ctx.lineTo(cxo, o.y - 22);
          ctx.lineTo(o.x + o.width - 4, o.y);
          ctx.closePath(); ctx.fill();
          // 陨石本体
          ctx.fillStyle = '#6a4a3a';
          ctx.beginPath();
          ctx.arc(cxo, o.y + o.height / 2, o.width / 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#8a6a55';
          ctx.beginPath();
          ctx.arc(cxo - 5, o.y + o.height / 2 - 4, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      });
    }

    function updateEnemies() {
      state.enemies.forEach(enemy => {
        if (enemy.blink > 0) enemy.blink -= 1;
        enemy.pulse += 0.15;

        // 拖尾记录（飞行/冲刺怪）
        if (enemy.type === 'flyer' || enemy.type === 'charger') {
          enemy.trail.unshift({ x: enemy.x, y: enemy.y });
          if (enemy.trail.length > 8) enemy.trail.pop();
        }

        // 浮游炮：空中浮动，技能=朝玩家三连散射
        if (enemy.type === 'flyer') {
          enemy.x += enemy.vx;
          enemy.floatPhase += 0.06;
          enemy.y = enemy.baseY + Math.sin(enemy.floatPhase) * enemy.floatAmp;
          enemy.skillTimer -= 1;
          if (enemy.skillTimer <= 0) {
            enemy.skillTimer = 130 + Math.random() * 60;
            const dx = (player.x + player.width / 2) - enemy.x;
            const dy = (player.y + 20) - (enemy.y + enemy.height / 2);
            const base = Math.atan2(dy, dx);
            for (let a = -1; a <= 1; a++) {
              const ang = base + a * 0.28;
              fireEnemyShot(enemy, Math.cos(ang) * 5, Math.sin(ang) * 5, '#c9a3ff');
            }
            spawnParticles(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, 8, { color: ['#c9a3ff', '#ffffff'], speedMin: 1, speedMax: 3, gravity: 0, life: 14, size: 2 });
          }
          return;
        }

        const prevY = enemy.y;
        enemy.x += enemy.vx;
        enemy.y += enemy.dy;
        enemy.dy += enemy.gravity;

        for (const platform of state.platforms) {
          if (enemy.dy >= 0 && prevY + enemy.height <= platform.y && enemy.y + enemy.height >= platform.y && enemy.x + enemy.width > platform.x + 6 && enemy.x < platform.x + platform.width - 6) {
            enemy.y = platform.y - enemy.height;
            enemy.dy = 0;
            enemy.canJump = true;
          }
        }

        if (enemy.y >= canvasHeight - groundHeight - enemy.height) {
          enemy.y = canvasHeight - groundHeight - enemy.height;
          enemy.dy = 0;
          enemy.canJump = true;
        }

        if (enemy.type === 'green') {
          // 弹跳晶体：定期跳跃
          enemy.jumpTimer -= 1;
          if (enemy.jumpTimer <= 0 && enemy.canJump) {
            enemy.jumpTimer = 80 + Math.random() * 60;
            enemy.dy = -12 - Math.random() * 5;
            enemy.canJump = false;
          }
        } else if (enemy.type === 'red') {
          // 法师：蓄力预警 → 发射追踪弹
          enemy.skillTimer -= 1;
          if (enemy.phase === 'move' && enemy.skillTimer <= 30) enemy.phase = 'aim';
          if (enemy.skillTimer <= 0) {
            enemy.phase = 'move';
            enemy.skillTimer = 150 + Math.random() * 80;
            const dx = (player.x + player.width / 2) - enemy.x;
            const dy = (player.y + 20) - (enemy.y + enemy.height / 2);
            const len = Math.hypot(dx, dy) || 1;
            fireEnemyShot(enemy, (dx / len) * 4.5, (dy / len) * 4.5, '#ff5e8a', 70);
            spawnParticles(enemy.x, enemy.y + enemy.height / 2, 12, { color: ['#ff5e8a', '#ffffff'], speedMin: 1, speedMax: 3.5, gravity: 0, life: 16, size: 2 });
          }
        } else if (enemy.type === 'charger') {
          // 冲锋怪：奔跑 → 蓄力预警 → 高速冲刺（留残影）
          enemy.skillTimer -= 1;
          if (enemy.phase === 'run') {
            if (enemy.skillTimer <= 0) {
              enemy.phase = 'windup';
              enemy.skillTimer = 36;
              enemy.vx = -0.3;
            }
          } else if (enemy.phase === 'windup') {
            enemy.vx = -0.3 + Math.sin(enemy.pulse * 3) * 0.6;
            if (enemy.skillTimer <= 0) {
              enemy.phase = 'dash';
              enemy.skillTimer = 60;
              enemy.vx = -(11 + state.speed);
              spawnParticles(enemy.x + enemy.width, enemy.y + enemy.height / 2, 14, { color: ['#ff9a3c', '#ffffff'], angle: 0, spread: 1.2, speedMin: 2, speedMax: 5, gravity: 0.1, life: 18, size: 2.5 });
            }
          } else if (enemy.phase === 'dash') {
            if (Math.random() < 0.6) spawnParticles(enemy.x + enemy.width, enemy.y + enemy.height / 2, 2, { color: ['#ff9a3c', '#ffd86a'], speedMin: 0.5, speedMax: 2, gravity: 0.05, life: 12, size: 2 });
            if (enemy.skillTimer <= 0) {
              enemy.phase = 'run';
              enemy.skillTimer = 90 + Math.random() * 50;
              enemy.vx = -(3 + state.speed * 0.3);
            }
          }
        }
      });
      state.enemies = state.enemies.filter(enemy => enemy.x + enemy.width > -80 && enemy.alive);
    }

    function updateBoss() {
      if (!state.boss) return;
      const boss = state.boss;
      if (boss.entering) {
        boss.entryTimer -= 1;
        boss.x -= 3.4;
        if (boss.entryTimer <= 0 || boss.x <= boss.maxX) {
          boss.entering = false;
          boss.x = boss.maxX;
          boss.dir = -1;
          addShake(8, 18);
        }
      } else if (!boss.inDash) {
        // 持续左右巡逻移动
        boss.x += boss.dir * boss.patrolSpeed;
        if (boss.x <= boss.minX) { boss.x = boss.minX; boss.dir = 1; }
        if (boss.x >= boss.maxX) { boss.x = boss.maxX; boss.dir = -1; }
      } else {
        // 冲刺：朝玩家所在方向突进，撞到边界则反弹
        boss.x += boss.dashDir * boss.dashSpeed;
        if (boss.x <= boss.minX) { boss.x = boss.minX; boss.dashDir = 1; }
        if (boss.x >= boss.maxX) { boss.x = boss.maxX; boss.dashDir = -1; }
      }

      boss.phaseTimer -= 1;
      if (boss.phaseTimer <= 0) {
        boss.phaseTimer = 120;
        boss.inDash = !boss.inDash;
        if (boss.inDash) boss.dashDir = (player.x + player.width / 2 < boss.x + boss.width / 2) ? -1 : 1;
      }

      boss.shootTimer -= 1;
      if (boss.shootTimer <= 0) {
        boss.shootTimer = 36;
        [{vx: -6, vy: 0}, {vx: -5, vy: -2}, {vx: -5, vy: 2}, {vx: -4, vy: -3.5}, {vx: -4, vy: 3.5}].forEach(s => fireEnemyShot(boss, s.vx, s.vy));
      }

      boss.dashTimer -= 1;
      if (boss.dashTimer <= 0) {
        boss.dashTimer = 200;
        boss.inDash = true;
        boss.dashSpeed = 12 + Math.random() * 4;
        boss.dashDir = (player.x + player.width / 2 < boss.x + boss.width / 2) ? -1 : 1;
      }

      if (boss.hitTimer && boss.hitTimer > 0) boss.hitTimer -= 1;
      for (const p of boss.particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life -= 1;
      }
      boss.particles = boss.particles.filter(p => p.life > 0);
    }

    function updatePlayerShots() {
      state.playerShots.forEach(shot => {
        shot.x += shot.vx;
        if (shot.charged) {
          shot.spin = (shot.spin || 0) + 0.3;
          // 沿途发光拖尾
          if (Math.random() < 0.9) {
            spawnParticles(shot.x, shot.y, 2, {
              color: ['#8df4ff', '#ffffff', '#b6fff0'], speedMin: 0.2, speedMax: 1.2,
              gravity: 0, life: 14, size: 3
            });
          }
        }
      });
      state.playerShots = state.playerShots.filter(shot => shot.x > -40 && shot.x < canvasWidth + 40);
    }

    function updateEnemyShots() {
      state.enemyShots.forEach(shot => {
        // 追踪弹：一段时间内朝玩家微调方向
        if (shot.homing && shot.homing > 0) {
          const dx = (player.x + player.width / 2) - shot.x;
          const dy = (player.y + 20) - shot.y;
          const len = Math.hypot(dx, dy) || 1;
          const sp = Math.hypot(shot.vx, shot.vy) || 4.5;
          shot.vx += ((dx / len) * sp - shot.vx) * 0.05;
          shot.vy += ((dy / len) * sp - shot.vy) * 0.05;
          shot.homing -= 1;
        }
        shot.x += shot.vx;
        shot.y += shot.vy;
      });
      state.enemyShots = state.enemyShots.filter(shot => shot.x > -20 && shot.x < canvasWidth + 20 && shot.y > 0 && shot.y < canvasHeight - groundHeight);
    }

    /* ============================ 碰撞 ============================ */
    function rectOverlap(a, b) {
      return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
    }

    function pointCircleCollide(px, py, circle) {
      const dx = px - circle.x;
      const dy = py - circle.y;
      return dx * dx + dy * dy <= circle.radius * circle.radius;
    }

    function handleCollisions() {
      // 下蹲时碰撞盒变矮（顶部降低），可从低压顶障碍下方钻过
      const ph = player.crouching ? player.height * 0.5 : player.height;
      const playerBox = {x: player.x + 6, y: player.y + (player.height - ph) + 8, width: player.width - 12, height: ph - 12};

      // 无敌期（破盾后短暂）忽略一切致命碰撞
      const canDie = player.invuln <= 0;

      if (state.stage === 1) {
        if (canDie) {
          for (const obs of state.obstacles) {
            if (rectOverlap(playerBox, obs)) {
              takeDamage('游戏失败！被障碍物撞到了');
              return;
            }
          }
          for (const o of state.fallingObjects) {
            if (o.phase === 'fall') {
              const box = {x: o.x, y: o.y, width: o.width, height: o.height};
              if (rectOverlap(playerBox, box)) {
                takeDamage('游戏失败！被坠落物砸中');
                return;
              }
            }
          }
        }
        if (state.door) {
          const doorBox = {x: state.door.x, y: state.door.y, width: state.door.width, height: state.door.height};
          if (rectOverlap(playerBox, doorBox)) {
            state.doorSequence = true;
            state.doorFlashTimer = 120;
            state.door = null;
            state.hintText = '传送门闪烁中...';
            spawnParticles(playerBox.x + playerBox.width / 2, playerBox.y + playerBox.height / 2, 30, {
              color: ['#5ae2ff', '#ffffff', '#7cff9b'], speedMin: 1, speedMax: 5, gravity: 0.02, life: 40, size: 3
            });
            playDoorMusic();
          }
        }
      }

      if (state.stage === 2 && canDie) {
        for (const enemy of state.enemies) {
          if (rectOverlap(playerBox, enemy)) {
            takeDamage('游戏失败！被小怪碰到');
            return;
          }
        }
        if (state.boss && rectOverlap(playerBox, state.boss)) {
          takeDamage('游戏失败！被 Boss 撞到了');
          return;
        }
      }

      if (canDie) {
        for (const shot of state.enemyShots) {
          if (pointCircleCollide(player.x + player.width/2, player.y + 20, shot)) {
            takeDamage('游戏失败！被敌人攻击命中');
            return;
          }
        }
      }

      state.playerShots.forEach(shot => {
        state.enemies.forEach(enemy => {
          if (!enemy.alive) return;
          const ecx = enemy.x + enemy.width / 2, ecy = enemy.y + enemy.height / 2;
          const rr = Math.max(enemy.width, enemy.height) / 2 + (shot.radius || 4);
          if ((shot.x - ecx) ** 2 + (shot.y - ecy) ** 2 <= rr * rr) {
            enemy.hp -= shot.damage;
            enemy.blink = 6;
            playEnemyHitSound();
            spawnParticles(shot.x, shot.y, shot.charged ? 12 : 6, { color: ['#ffd86a', '#ffffff'], speedMin: 1, speedMax: shot.charged ? 5 : 3, gravity: 0.1, life: 16, size: 2 });
            if (!shot.charged) shot.x = canvasWidth + 200; // 普通弹命中即消失；蓄力弹穿透杂兵
            if (enemy.hp <= 0) {
              enemy.alive = false;
              state.score += 5;
              scoreEl.textContent = state.score;
              state.speed = Math.min(2.4, state.speed + 0.08);
              speedEl.textContent = state.speed.toFixed(1);
              const col = enemy.type === 'green' ? ['#5edc5e', '#ffffff']
                : enemy.type === 'red' ? ['#ff6c6c', '#ffffff']
                : enemy.type === 'flyer' ? ['#c17cff', '#ffffff']
                : ['#ff9a3c', '#ffffff'];
              spawnParticles(ecx, ecy, 18, { color: col, speedMin: 1.5, speedMax: 4.5, gravity: 0.18, life: 26, size: 3 });
              if (state.score >= 55 && !state.boss) spawnBoss();
            }
          }
        });
        if (state.boss) {
          const bossBox = {x: state.boss.x, y: state.boss.y, width: state.boss.width, height: state.boss.height};
          if (pointCircleCollide(shot.x, shot.y, {x: bossBox.x + bossBox.width/2, y: bossBox.y + bossBox.height/2, radius: bossBox.width/2 + (shot.radius || 4)})) {
            state.boss.hp -= shot.damage;
            state.boss.hitTimer = 12;
            for (let i = 0; i < 14; i++) {
              state.boss.particles.push({
                x: shot.x, y: shot.y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 1.5) * 6,
                life: 30 + Math.floor(Math.random() * 20),
                color: Math.random() < 0.5 ? '#ff9bca' : '#ffd86a'
              });
            }
            shot.x = canvasWidth + 100;
            playBossHitSound();
            addShake(3, 4);
            if (state.boss.hp <= 0) {
              state.score += 20;
              scoreEl.textContent = state.score;
              for (let i = 0; i < 48; i++) {
                state.boss.particles.push({
                  x: state.boss.x + state.boss.width/2,
                  y: state.boss.y + state.boss.height/2,
                  vx: (Math.random() - 0.5) * 10,
                  vy: (Math.random() - 0.8) * 10,
                  life: 40 + Math.floor(Math.random() * 40),
                  color: ['#ff6d6d','#7cff9b','#8df4ff','#ffd86a'][Math.floor(Math.random()*4)]
                });
              }
              addShake(12, 24);
              winGame();
            }
          }
        }
      });
    }

    /* ============================ 绘制 ============================ */
    function drawBackground() {
      const horizon = canvasHeight - groundHeight;
      // 天空渐变
      const skyGradient = ctx.createLinearGradient(0, 0, 0, canvasHeight);
      skyGradient.addColorStop(0, '#1c1248');
      skyGradient.addColorStop(0.45, '#141c3e');
      skyGradient.addColorStop(1, '#05060c');
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      // 星云斑块（多层径向光晕）
      const neb = [
        { x: canvasWidth * 0.72, y: 72, r: 250, c: 'rgba(120,90,220,0.30)' },
        { x: canvasWidth * 0.24, y: 120, r: 210, c: 'rgba(60,140,220,0.20)' },
        { x: canvasWidth * 0.5, y: 40, r: 170, c: 'rgba(200,90,160,0.14)' },
      ];
      for (const n of neb) {
        const g = ctx.createRadialGradient(n.x, n.y, 10, n.x, n.y, n.r);
        g.addColorStop(0, n.c);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
      }

      // 星星（亮星带十字光芒）
      for (const st of state.stars) {
        const a = 0.35 + 0.45 * Math.sin(st.twinkle);
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.beginPath();
        ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
        ctx.fill();
        if (st.bright) {
          ctx.strokeStyle = `rgba(200,230,255,${a * 0.55})`;
          ctx.lineWidth = 1;
          const g2 = st.r * 3.2;
          ctx.beginPath();
          ctx.moveTo(st.x - g2, st.y); ctx.lineTo(st.x + g2, st.y);
          ctx.moveTo(st.x, st.y - g2); ctx.lineTo(st.x, st.y + g2);
          ctx.stroke();
        }
      }

      // 流星（弱化为遥远背景星尘：细、淡、无刺眼发光，长拖尾显得很远）
      for (const me of state.meteors) {
        const al = Math.min(1, me.life / 30) * 0.45;
        ctx.strokeStyle = `rgba(200,210,255,${al})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(me.x, me.y);
        ctx.lineTo(me.x - me.vx * 6, me.y - me.vy * 6);
        ctx.stroke();
      }

      // 远景城市剪影（带发光窗）
      for (let pass = 0; pass < 2; pass++) {
        const ox = state.cityOffset + pass * (canvasWidth + 60);
        for (const b of state.city) {
          const bxp = b.x + ox;
          if (bxp > canvasWidth || bxp + b.w < -2) continue;
          ctx.fillStyle = '#0f1636';
          ctx.fillRect(bxp, horizon - b.h, b.w, b.h);
          ctx.fillStyle = 'rgba(120,200,255,0.32)';
          for (let wy = horizon - b.h + 7; wy < horizon - 6; wy += 12) {
            for (let wx = bxp + 5; wx < bxp + b.w - 4; wx += 11) {
              if ((Math.floor(wx / 11) + Math.floor(wy / 12) + b.win) % 3 !== 0) ctx.fillRect(wx, wy, 3, 5);
            }
          }
        }
      }

      // 视差山丘
      for (const h of state.hills) {
        ctx.fillStyle = h.color;
        ctx.beginPath();
        ctx.moveTo(-h.step, horizon);
        let up = true;
        for (let x = -h.step + h.offset; x <= canvasWidth + h.step; x += h.step) {
          ctx.quadraticCurveTo(x - h.step / 2, h.base - (up ? h.amp : h.amp * 0.35), x, h.base);
          up = !up;
        }
        ctx.lineTo(canvasWidth + h.step, horizon);
        ctx.closePath();
        ctx.fill();
      }

      // 漂浮光尘
      for (const m of state.motes) {
        const a = 0.2 + 0.25 * (0.5 + 0.5 * Math.sin(m.drift * 2));
        ctx.fillStyle = `rgba(${m.hue},${a})`;
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 地面
      const groundGrad = ctx.createLinearGradient(0, horizon, 0, canvasHeight);
      groundGrad.addColorStop(0, '#2f3a63');
      groundGrad.addColorStop(0.5, '#1c2340');
      groundGrad.addColorStop(1, '#0f1428');
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, horizon, canvasWidth, groundHeight);
      // 地平线发光
      ctx.save();
      ctx.shadowBlur = 12; ctx.shadowColor = '#7fb0ff';
      ctx.fillStyle = '#6a7cd0';
      ctx.fillRect(0, horizon, canvasWidth, 3);
      ctx.restore();
      ctx.fillStyle = 'rgba(160,200,255,0.6)';
      ctx.fillRect(0, horizon, canvasWidth, 1);

      // 地面纵向斜纹网格（随速度滚动）
      ctx.strokeStyle = 'rgba(90,110,190,0.18)';
      ctx.lineWidth = 1;
      const gridOffset = ((state.groundScroll % 60) + 60) % 60;
      for (let x = gridOffset; x < canvasWidth + 60; x += 60) {
        ctx.beginPath();
        ctx.moveTo(x, horizon + 6);
        ctx.lineTo(x - 40, canvasHeight);
        ctx.stroke();
      }
      // 地面横向透视线
      ctx.strokeStyle = 'rgba(90,110,190,0.12)';
      for (let i = 1; i <= 3; i++) {
        const yy = horizon + i * i * 8;
        ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(canvasWidth, yy); ctx.stroke();
      }
    }

    function drawParticles() {
      for (const p of state.particles) {
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawPlayer() {
      const groundY = canvasHeight - groundHeight;

      // 影子（随高度缩放）
      const heightAbove = groundY - (player.y + player.height);
      const shadowScale = Math.max(0.35, 1 - heightAbove / 320);
      ctx.save();
      ctx.fillStyle = `rgba(0,0,0,${0.4 * shadowScale})`;
      ctx.beginPath();
      ctx.ellipse(player.x + player.width / 2, groundY - 2, (player.width / 2 + 4) * shadowScale, 6 * shadowScale, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 高速/空中拖尾残影
      if (Math.abs(player.vx) > 2.6 || !player.onGround) {
        for (let i = 1; i < player.trail.length; i++) {
          const t = player.trail[i];
          ctx.save();
          ctx.globalAlpha = 0.12 * (1 - i / player.trail.length);
          ctx.fillStyle = '#4fe3ff';
          ctx.fillRect(t.x + 10, t.y + 8, player.width - 20, player.height - 10);
          ctx.restore();
        }
      }

      const s = player.height / 64;
      const U = n => n * s;
      const cx = player.x + player.width / 2;
      const feetY = player.y + player.height;
      const face = player.direction === 'left' ? -1 : 1;
      const glow = 0.5 + 0.35 * Math.sin(Date.now() * 0.006);
      const legOff = (player.onGround && Math.abs(player.vx) > 0.6) ? Math.sin(player.runPhase) * 4 : 0;

      ctx.save();
      // squash & stretch 以脚底为锚点
      ctx.translate(cx, feetY);
      const crouchY = player.crouching ? 0.5 : 1;
      ctx.scale(player.squash * (player.crouching ? 1.2 : 1), player.stretch * crouchY);
      ctx.scale(face, 1);
      // 坐标系：原点脚底中心，向上为 -y，x 已按朝向翻转

      // —— 围巾（双层 + 高光，多段飘动）——
      const sw = Math.sin(Date.now() * 0.015) * 3 + Math.abs(player.vx) * 0.8 + player.dy * 0.28;
      ctx.fillStyle = '#c23a5a'; // 深色底
      ctx.beginPath();
      ctx.moveTo(U(-2), -U(43));
      ctx.quadraticCurveTo(U(-18), -U(46) - sw, U(-30), -U(30) - sw * 1.4);
      ctx.quadraticCurveTo(U(-20), -U(31), U(-4), -U(37));
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff5d7a'; // 亮面
      ctx.beginPath();
      ctx.moveTo(U(-2), -U(43));
      ctx.quadraticCurveTo(U(-16), -U(45) - sw, U(-26), -U(31) - sw * 1.3);
      ctx.quadraticCurveTo(U(-16), -U(32), U(-4), -U(38));
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,190,205,0.7)'; // 高光条
      ctx.lineWidth = Math.max(1, U(1));
      ctx.beginPath();
      ctx.moveTo(U(-6), -U(41));
      ctx.quadraticCurveTo(U(-16), -U(42) - sw, U(-24), -U(31) - sw);
      ctx.stroke();

      // —— 腿（装甲分段 + 膝盖发光 + 渐变鞋）——
      ctx.fillStyle = '#1f2648';
      ctx.fillRect(U(-11) - legOff, -U(18), U(9), U(18)); // 后腿
      ctx.fillStyle = '#2a3360';
      ctx.fillRect(U(-11) - legOff, -U(18), U(9), U(4));
      ctx.fillStyle = '#2c356a';
      ctx.fillRect(U(2) + legOff, -U(18), U(9), U(18)); // 前腿
      ctx.fillStyle = '#3a4680';
      ctx.fillRect(U(2) + legOff, -U(18), U(9), U(4));
      ctx.fillStyle = 'rgba(120,240,255,0.85)'; // 膝盖发光
      ctx.fillRect(U(-10) - legOff, -U(10), U(3), U(2));
      ctx.fillRect(U(4) + legOff, -U(10), U(3), U(2));
      ctx.save();
      ctx.shadowBlur = 10 * glow; ctx.shadowColor = '#4fe3ff';
      const shoeG = ctx.createLinearGradient(0, -U(4), 0, 0);
      shoeG.addColorStop(0, '#8df4ff'); shoeG.addColorStop(1, '#2aa8d8');
      ctx.fillStyle = shoeG;
      ctx.fillRect(U(-12) - legOff, -U(4), U(11), U(4));
      ctx.fillRect(U(1) + legOff, -U(4), U(11), U(4));
      ctx.restore();

      // —— 身体（分段机甲 + 肩甲 + 能量线）——
      const bodyG = ctx.createLinearGradient(U(-13), -U(40), U(13), -U(16));
      bodyG.addColorStop(0, '#2b3470');
      bodyG.addColorStop(1, '#1b2350');
      ctx.fillStyle = bodyG;
      ctx.fillRect(U(-13), -U(40), U(26), U(24));
      ctx.fillStyle = '#3a4a9e'; // 胸甲上段
      ctx.fillRect(U(-13), -U(40), U(26), U(7));
      ctx.strokeStyle = 'rgba(10,14,30,0.55)'; // 腹部分段线
      ctx.lineWidth = Math.max(1, U(1));
      ctx.beginPath(); ctx.moveTo(U(-13), -U(26)); ctx.lineTo(U(13), -U(26)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(U(-13), -U(21)); ctx.lineTo(U(13), -U(21)); ctx.stroke();
      ctx.fillStyle = '#454f9e'; // 肩甲
      ctx.fillRect(U(-15), -U(40), U(5), U(9));
      ctx.fillRect(U(10), -U(40), U(5), U(9));
      ctx.strokeStyle = `rgba(79,227,255,${glow})`; // 侧面能量线
      ctx.lineWidth = Math.max(1, U(1));
      ctx.beginPath(); ctx.moveTo(U(-11), -U(38)); ctx.lineTo(U(-11), -U(20)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(U(11), -U(38)); ctx.lineTo(U(11), -U(20)); ctx.stroke();

      // 能量核心（多层光晕 + 旋转环）
      const coreP = 0.7 + 0.3 * Math.sin(Date.now() * 0.01);
      ctx.save();
      ctx.shadowBlur = 18; ctx.shadowColor = '#4fe3ff';
      const coreG = ctx.createRadialGradient(0, -U(28), 0, 0, -U(28), U(7));
      coreG.addColorStop(0, '#ffffff');
      coreG.addColorStop(0.5, `rgba(140,240,255,${coreP})`);
      coreG.addColorStop(1, 'rgba(79,227,255,0)');
      ctx.fillStyle = coreG;
      ctx.beginPath(); ctx.arc(0, -U(28), U(7), 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = `rgba(180,250,255,${0.6 * coreP})`;
      ctx.lineWidth = Math.max(1, U(1));
      ctx.beginPath(); ctx.ellipse(0, -U(28), U(6), U(2.4), Date.now() * 0.004, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = `rgba(79,227,255,${0.5 * glow})`; // 整体发光描边
      ctx.lineWidth = Math.max(1, U(1.2));
      ctx.strokeRect(U(-13), -U(40), U(26), U(24));

      // —— 前臂（能量手套 + 手环）——
      ctx.fillStyle = '#2c356a';
      ctx.fillRect(U(9), -U(38), U(6), U(16));
      ctx.fillStyle = '#3a4680';
      ctx.fillRect(U(9), -U(38), U(6), U(4));
      ctx.save();
      ctx.shadowBlur = 8 * glow; ctx.shadowColor = '#4fe3ff';
      ctx.fillStyle = '#4fe3ff';
      ctx.fillRect(U(9), -U(24), U(6), U(3)); // 手套发光
      ctx.fillRect(U(9), -U(31), U(6), U(1.5)); // 手环
      ctx.restore();

      // —— 头（脸渐变 + 头盔中脊 + 护目镜高光）——
      const faceG = ctx.createLinearGradient(0, -U(57), 0, -U(40));
      faceG.addColorStop(0, '#ffe6d2'); faceG.addColorStop(1, '#eec4aa');
      ctx.fillStyle = faceG;
      ctx.beginPath(); ctx.arc(0, -U(48), U(9), 0, Math.PI * 2); ctx.fill();
      const helmG = ctx.createLinearGradient(0, -U(58), 0, -U(46));
      helmG.addColorStop(0, '#3a4590'); helmG.addColorStop(1, '#232a52');
      ctx.fillStyle = helmG;
      ctx.beginPath(); ctx.arc(0, -U(49), U(9.5), Math.PI, 0); ctx.fill();
      ctx.fillRect(U(-9.5), -U(50), U(19), U(4));
      ctx.fillStyle = '#4fe3ff'; // 头盔中脊
      ctx.fillRect(U(-1), -U(58), U(2), U(9));
      ctx.strokeStyle = 'rgba(10,14,30,0.5)';
      ctx.lineWidth = Math.max(1, U(1));
      ctx.beginPath(); ctx.moveTo(U(-9), -U(49)); ctx.lineTo(U(9), -U(49)); ctx.stroke();
      // 天线 + 发光点
      ctx.strokeStyle = '#4fe3ff';
      ctx.lineWidth = Math.max(1, U(1.2));
      ctx.beginPath(); ctx.moveTo(U(5), -U(56)); ctx.lineTo(U(9), -U(64)); ctx.stroke();
      ctx.save();
      ctx.shadowBlur = 12; ctx.shadowColor = '#4fe3ff';
      ctx.fillStyle = '#8df4ff';
      ctx.beginPath(); ctx.arc(U(9), -U(64), U(2.2), 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      // 护目镜（渐变 + 高光反光）
      ctx.save();
      ctx.shadowBlur = 12; ctx.shadowColor = '#4fe3ff';
      ctx.fillStyle = '#0d1638';
      ctx.fillRect(U(-6.5), -U(51), U(14), U(6.5));
      const goG = ctx.createLinearGradient(U(-6), -U(50), U(7), -U(45));
      goG.addColorStop(0, '#bffcff'); goG.addColorStop(0.5, '#4fe3ff'); goG.addColorStop(1, '#1aa0d0');
      ctx.fillStyle = goG;
      ctx.fillRect(U(-5), -U(50), U(11), U(3.2));
      ctx.fillStyle = 'rgba(255,255,255,0.85)'; // 反光高光
      ctx.fillRect(U(-4), -U(50), U(3), U(1.2));
      ctx.restore();

      ctx.restore(); // 结束角色变换
    }

    function drawScene() {
      ctx.save();
      // 屏幕震动
      if (state.shakeTimer && state.shakeTimer > 0) {
        // 随时间衰减的抖动，位移加大，落地/命中更有冲击感
        const decay = state.shakeBase ? state.shakeTimer / state.shakeBase : 1;
        const st = (state.shakeStrength || 6) * decay;
        ctx.translate((Math.random() - 0.5) * st * 2, (Math.random() - 0.5) * st * 1.6);
        state.shakeTimer -= 1;
        if (state.shakeTimer <= 0) { state.shakeStrength = 0; state.shakeBase = 0; }
      }

      ctx.clearRect(0, 0, canvasWidth, canvasHeight);
      drawBackground();

      // 障碍物（多样化：柱子 / 高柱 / 尖刺 / 悬空）
      if (state.stage === 1) {
        state.obstacles.forEach(obs => {
          if (obs.type === 'spike') {
            const n = Math.max(2, Math.round(obs.width / 16));
            const sw = obs.width / n;
            ctx.save();
            ctx.shadowBlur = 8; ctx.shadowColor = '#ff5b5b';
            ctx.fillStyle = '#d34b4b';
            for (let i = 0; i < n; i++) {
              ctx.beginPath();
              ctx.moveTo(obs.x + i * sw, obs.y + obs.height);
              ctx.lineTo(obs.x + i * sw + sw / 2, obs.y);
              ctx.lineTo(obs.x + (i + 1) * sw, obs.y + obs.height);
              ctx.closePath(); ctx.fill();
            }
            ctx.restore();
            ctx.fillStyle = '#ffb0b0';
            for (let i = 0; i < n; i++) {
              ctx.fillRect(obs.x + i * sw + sw / 2 - 1, obs.y, 2, obs.height * 0.5);
            }
            ctx.fillStyle = '#7d2b2b';
            ctx.fillRect(obs.x, obs.y + obs.height - 5, obs.width, 5);
          } else if (obs.type === 'floating') {
            // 悬浮能量束
            ctx.strokeStyle = 'rgba(90,208,255,0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(obs.x + obs.width / 2, 0);
            ctx.lineTo(obs.x + obs.width / 2, obs.y);
            ctx.stroke();
            ctx.save();
            ctx.shadowBlur = 14; ctx.shadowColor = '#5ad0ff';
            const g = ctx.createLinearGradient(obs.x, obs.y, obs.x, obs.y + obs.height);
            g.addColorStop(0, '#5fc7f5');
            g.addColorStop(1, '#2d7fb8');
            ctx.fillStyle = g;
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            ctx.restore();
            ctx.fillStyle = '#cdeeff';
            ctx.fillRect(obs.x, obs.y, obs.width, 6);
            ctx.fillStyle = '#bfe9ff';
            ctx.fillRect(obs.x, obs.y + obs.height - 4, obs.width, 4);
          } else if (obs.type === 'tall') {
            const g = ctx.createLinearGradient(obs.x, obs.y, obs.x, obs.y + obs.height);
            g.addColorStop(0, '#b26bff');
            g.addColorStop(1, '#6a2fb0');
            ctx.fillStyle = g;
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            ctx.fillStyle = '#e0c0ff';
            ctx.fillRect(obs.x, obs.y, obs.width, 8);
            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.fillRect(obs.x + 4, obs.y + 12, 4, obs.height - 20);
            ctx.fillStyle = '#4a1d80';
            ctx.fillRect(obs.x, obs.y + obs.height - 6, obs.width, 6);
          } else { // block
            const g = ctx.createLinearGradient(obs.x, obs.y, obs.x, obs.y + obs.height);
            g.addColorStop(0, '#e8a05f');
            g.addColorStop(1, '#b8642f');
            ctx.fillStyle = g;
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            ctx.fillStyle = '#f2c48a';
            ctx.fillRect(obs.x, obs.y, obs.width, 8);
            ctx.fillStyle = '#8a4a22';
            ctx.fillRect(obs.x, obs.y + obs.height - 6, obs.width, 6);
          }
        });
      }
      // 天降坠落物（预警圈 + 陨石）
      if (state.stage === 1) drawFalling();
      // 平台
      if (state.stage === 2) {
        state.platforms.forEach(platform => {
          ctx.fillStyle = '#6a7cff';
          ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
          ctx.fillStyle = '#d5e0ff';
          ctx.fillRect(platform.x, platform.y, platform.width, 4);
        });
      }

      // 玩家子弹
      state.playerShots.forEach(shot => {
